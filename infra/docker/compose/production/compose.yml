name: waterbridge-production

services:
  web:
    image: "${WEB_IMAGE:?WEB_IMAGE is required}@${WEB_IMAGE_DIGEST:?WEB_IMAGE_DIGEST is required}"
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-18080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - admin_static:/usr/share/nginx/html/static:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - edge

  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}@${BACKEND_IMAGE_DIGEST:?BACKEND_IMAGE_DIGEST is required}"
    restart: unless-stopped
    init: true
    env_file:
      - "${BACKEND_RUNTIME_ENV_FILE:?BACKEND_RUNTIME_ENV_FILE is required}"
    environment:
      RELEASE_SHA: "${RELEASE_SHA:?RELEASE_SHA is required}"
      DJANGO_SETTINGS_MODULE: config.settings.production
      AI_SERVICE_BASE_URL: http://ai:8001
      POSTGRES_SSLROOTCERT: /run/secrets/rds-ca.pem
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
      - --timeout
      - "60"
      - --worker-class
      - sync
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - "${RDS_CA_HOST_PATH:?RDS_CA_HOST_PATH is required}:/run/secrets/rds-ca.pem:ro"
      - admin_static:/workspace/backend/staticfiles:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; host=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); request=urllib.request.Request('http://127.0.0.1:8000/health', headers={'Host': host}); urllib.request.urlopen(request, timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    depends_on:
      ai:
        condition: service_healthy
    networks:
      - edge
      - internal

  ai:
    image: "${AI_IMAGE:?AI_IMAGE is required}@${AI_IMAGE_DIGEST:?AI_IMAGE_DIGEST is required}"
    restart: unless-stopped
    init: true
    env_file:
      - "${AI_RUNTIME_ENV_FILE:?AI_RUNTIME_ENV_FILE is required}"
    environment:
      RELEASE_SHA: "${RELEASE_SHA:?RELEASE_SHA is required}"
      AI_ENV: production
      AI_OTEL_ENABLED: "true"
      AI_ENABLE_EXPERIMENT_PLAYGROUND: "false"
      PGSSLROOTCERT: /run/secrets/rds-ca.pem
      OTEL_SERVICE_NAME: waterbridge-ai
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://trace-store:4318/v1/traces
      HF_HOME: /home/waterbridge/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /home/waterbridge/.cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /home/waterbridge/.cache/sentence-transformers
    expose:
      - "8001"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ai_model_cache:/home/waterbridge/.cache
      - "${RDS_CA_HOST_PATH:?RDS_CA_HOST_PATH is required}:/run/secrets/rds-ca.pem:ro"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/ai/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      trace-store:
        condition: service_healthy
    networks:
      - internal
      - egress

  trace-store:
    image: grafana/tempo:3.0.3@sha256:05321ebf1f191fde34282b3dc86e68f511d489133df7963cd1670a2e1e11b33c
    restart: unless-stopped
    init: true
    command:
      - -config.file=/etc/tempo/tempo.yml
      - -config.expand-env=true
      - -target=all
    environment:
      AWS_REGION: "${AWS_REGION:?AWS_REGION is required}"
      TEMPO_S3_BUCKET: "${TEMPO_S3_BUCKET:?TEMPO_S3_BUCKET is required}"
    expose:
      - "3200"
      - "4317"
      - "4318"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_work:/var/tempo
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/tempo", "-health", "-health.url=http://127.0.0.1:3200/ready"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks:
      - internal
      - egress

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  admin_static:
    name: "waterbridge-admin-static-${RELEASE_SHA:?RELEASE_SHA is required}"
  ai_model_cache:
    name: waterbridge-ai-model-cache
  tempo_work:
    name: waterbridge-tempo-work
