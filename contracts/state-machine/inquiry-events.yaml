contract:
  name: inquiry-events
  version: 1.0.0
  status: TEAM_APPROVED
  owner: PM_TECHNICAL_INTEGRATION
  source_documents:
  - docs/planning/md/week3-scope-and-dod.md
  - (화면설계서_29기_4팀) 정수기 구독 고객 케어 및 A_S 업무 지원 시스템.md
  description: '사용자의 행동, 담당자의 업무 처리와 백엔드 자동 판정을 State Machine 이벤트로 정의한다. 외부 클라이언트는 다음 상태를 직접 지정하지 않고 행동별 API를 호출하며, 백엔드가 이벤트·현재
    상태·역할·담당자·state_version을 검증한다.

    '
categories:
- USER_COMMAND
- STAFF_COMMAND
- SYSTEM_EVENT
- DATA_UPDATE
scopes:
- QUESTIONNAIRE
- PRODUCT
- INQUIRY
- CONSULTATION
- VISIT
- AI_RESULT
actor_roles:
- CUSTOMER
- CONSULTANT
- TECHNICIAN
- OPERATOR
- SYSTEM
events:
- code: START_CARE_PRECHECK
  category: USER_COMMAND
  scope: QUESTIONNAIRE
  actor_roles:
  - CUSTOMER
  changes_inquiry_state: false
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: false
  external_action:
    exposed: true
    operation_id: startCarePrecheck
  description: 'Inquiry를 생성하지 않고 CARE_PRECHECK용 QuestionnaireSession을 시작한다.

    '
- code: START_INQUIRY
  category: USER_COMMAND
  scope: INQUIRY
  actor_roles:
  - CUSTOMER
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: false
  external_action:
    exposed: true
    operation_id: startInquiry
  description: '새 Inquiry를 생성하고 초기 상태 DRAFT로 진입한다. 기존 사전 문진이 있으면 새 inquiry_id에 연결할 수 있다.

    '
- code: REGISTER_PHONE_INQUIRY
  category: STAFF_COMMAND
  scope: INQUIRY
  actor_roles:
  - CONSULTANT
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: false
  external_action:
    exposed: true
    operation_id: registerConsultantPhoneInquiry
  description: '상담사가 합성 고객의 활성 구독을 선택해 PHONE 문의를 등록하고 현재 상담사에게 배정된 CONSULTATION_REQUIRED 상태로 초기화한다. AI·RAG는 자동 실행하지 않는다.

    '
- code: PRODUCT_UPDATED
  category: DATA_UPDATE
  scope: PRODUCT
  actor_roles:
  - CUSTOMER
  changes_inquiry_state: false
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: false
  external_action:
    exposed: true
    operation_id: updateCustomerProduct
  description: '고객 제품 정보를 수정한다. 문의 상태 전이와는 분리하여 처리한다.

    '
- code: SUBMIT_SYMPTOM
  category: USER_COMMAND
  scope: INQUIRY
  actor_roles:
  - CUSTOMER
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: submitSymptom
  description: '최초 증상과 고객 원문을 제출하고 DRAFT에서 QUESTIONNAIRE_IN_PROGRESS로 전환한다.

    '
- code: CANCEL_INQUIRY
  category: USER_COMMAND
  scope: INQUIRY
  actor_roles:
  - CUSTOMER
  - CONSULTANT
  - OPERATOR
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: cancelInquiry
  description: '허용 상태와 역할, 취소 사유를 검증한 뒤 문의를 CANCELLED로 종료한다.

    '
- code: SUBMIT_ANSWERS
  category: USER_COMMAND
  scope: QUESTIONNAIRE
  actor_roles:
  - CUSTOMER
  changes_inquiry_state: false
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: submitFollowUpAnswers
  description: '누락 정보에 대한 추가 답변을 저장한다. 답변 저장 자체는 QUESTIONNAIRE_IN_PROGRESS 상태를 유지하며 후속 자동 판정을 촉발할 수 있다.

    '
- code: CUSTOMER_REPORTED_SELF_RESOLVED
  category: USER_COMMAND
  scope: INQUIRY
  actor_roles:
  - CUSTOMER
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: reportSelfResolution
  description: 'AI_GUIDANCE 상태의 자가조치 단독 해결을 고객이 확정하여 RESOLVED로 전환한다.

    '
- code: REQUEST_CONSULTATION
  category: USER_COMMAND
  scope: INQUIRY
  actor_roles:
  - CUSTOMER
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: requestConsultation
  description: '고객이 상담을 요청하거나 재요청하여 문의를 CONSULTATION_REQUIRED로 전환한다.

    '
- code: SUBMIT_RESOLUTION_FEEDBACK
  category: DATA_UPDATE
  scope: INQUIRY
  actor_roles:
  - CUSTOMER
  changes_inquiry_state: false
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: submitResolutionFeedback
  description: 'COMPLETION_PENDING 상태에서 고객의 해결됨 피드백을 저장한다. 문의 상태는 유지하며 담당자의 FINALIZE_INQUIRY가 별도로 필요하다.

    '
- code: CUSTOMER_REPORTED_UNRESOLVED
  category: USER_COMMAND
  scope: INQUIRY
  actor_roles:
  - CUSTOMER
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: reportUnresolved
  description: '고객이 미해결을 보고하여 COMPLETION_PENDING 문의를 REOPENED로 전환한다.

    '
- code: RESUME_CONSULTATION
  category: STAFF_COMMAND
  scope: CONSULTATION
  actor_roles:
  - CONSULTANT
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: resumeConsultation
  description: '재개 문의를 상담 대기열에 다시 올려 REOPENED에서 CONSULTATION_REQUIRED로 전환한다.

    '
- code: CLAIM_CONSULTATION
  category: STAFF_COMMAND
  scope: CONSULTATION
  actor_roles:
  - CONSULTANT
  changes_inquiry_state: false
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: claimConsultation
  description: '미배정 WAITING 상담 문의를 현재 상담사에게 배정한다. Inquiry 상태는 CONSULTATION_REQUIRED로 유지하며 상담 시작은 별도 START_CONSULTATION으로 처리한다.

    '
- code: START_CONSULTATION
  category: STAFF_COMMAND
  scope: CONSULTATION
  actor_roles:
  - CONSULTANT
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: startConsultation
  description: '담당 상담사가 상담을 시작하여 CONSULTATION_REQUIRED에서 CONSULTATION_IN_PROGRESS로 전환한다.

    '
- code: CONSULTATION_COMPLETED
  category: STAFF_COMMAND
  scope: CONSULTATION
  actor_roles:
  - CONSULTANT
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: completeConsultation
  description: '상담 처리를 완료하고 고객 피드백과 담당자 최종 완료를 위해 COMPLETION_PENDING으로 전환한다.

    '
- code: VISIT_REVIEW_REQUIRED
  category: STAFF_COMMAND
  scope: CONSULTATION
  actor_roles:
  - CONSULTANT
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: requestVisitReview
  description: '상담 결과 방문 필요 여부를 검토하기 위해 VISIT_REVIEW_PENDING으로 전환한다.

    '
- code: UPDATE_CONSULTATION_SUMMARY
  category: DATA_UPDATE
  scope: CONSULTATION
  actor_roles:
  - CONSULTANT
  changes_inquiry_state: false
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: updateConsultationSummary
  description: 'AI 상담 요약 초안을 상담사가 수정한다. 문의 상태는 변경하지 않는다.

    '
- code: CONFIRM_CONSULTATION_SUMMARY
  category: DATA_UPDATE
  scope: CONSULTATION
  actor_roles:
  - CONSULTANT
  changes_inquiry_state: false
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: confirmConsultationSummary
  description: '상담사가 수정한 상담 요약을 확정한다. 문의 상태는 변경하지 않는다.

    '
- code: VISIT_NEEDED
  category: STAFF_COMMAND
  scope: VISIT
  actor_roles:
  - CONSULTANT
  changes_inquiry_state: true
  changes_visit_state: true
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: createVisitRequest
  description: '방문 필요를 확정하고 Inquiry를 VISIT_SCHEDULING으로, Visit을 ASSIGNING으로 전환하거나 생성한다.

    '
- code: UPDATE_VISIT_SCHEDULE
  category: STAFF_COMMAND
  scope: VISIT
  actor_roles:
  - CONSULTANT
  changes_inquiry_state: true
  changes_visit_state: true
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: updateVisitSchedule
  description: '기사와 일정을 조율한다. 일반 방문 조율에서는 Inquiry가 VISIT_SCHEDULING을 유지하고 Visit이 SCHEDULING으로 전환하며, REVISIT_REQUIRED에서 호출되면
    Inquiry도 VISIT_SCHEDULING으로 복귀한다.

    '
- code: CONFIRM_VISIT
  category: STAFF_COMMAND
  scope: VISIT
  actor_roles:
  - CONSULTANT
  changes_inquiry_state: true
  changes_visit_state: true
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: confirmVisit
  description: '방문 일정을 확정하여 Inquiry를 VISIT_SCHEDULED로, Visit을 CONFIRMED로 전환한다.

    '
- code: UPDATE_PREVISIT_REPORT
  category: DATA_UPDATE
  scope: VISIT
  actor_roles:
  - TECHNICIAN
  changes_inquiry_state: false
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: updatePrevisitReport
  description: 'AI 기사 사전 리포트 초안을 담당 방문기사가 수정한다. 상태는 변경하지 않는다.

    '
- code: CONFIRM_PREVISIT_REPORT
  category: DATA_UPDATE
  scope: VISIT
  actor_roles:
  - TECHNICIAN
  changes_inquiry_state: false
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: confirmPrevisitReport
  description: '담당 방문기사가 사전 리포트를 확정한다. 상태는 변경하지 않는다.

    '
- code: START_VISIT
  category: STAFF_COMMAND
  scope: VISIT
  actor_roles:
  - TECHNICIAN
  changes_inquiry_state: false
  changes_visit_state: true
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: startVisit
  description: '담당 방문기사가 현장 점검을 시작하여 Visit을 CONFIRMED에서 IN_PROGRESS로 전환한다. Inquiry는 VISIT_SCHEDULED를 유지한다.

    '
- code: VISIT_COMPLETED
  category: STAFF_COMMAND
  scope: VISIT
  actor_roles:
  - TECHNICIAN
  changes_inquiry_state: true
  changes_visit_state: true
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: completeVisit
  description: '방문 처리를 완료하여 Visit을 COMPLETED로, Inquiry를 COMPLETION_PENDING으로 전환한다.

    '
- code: REVISIT_NEEDED
  category: STAFF_COMMAND
  scope: VISIT
  actor_roles:
  - TECHNICIAN
  changes_inquiry_state: true
  changes_visit_state: true
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: requestRevisit
  description: '추가 방문 필요를 기록하여 Visit을 FOLLOW_UP_REQUIRED로, Inquiry를 REVISIT_REQUIRED로 전환한다.

    '
- code: FINALIZE_INQUIRY
  category: STAFF_COMMAND
  scope: INQUIRY
  actor_roles:
  - CONSULTANT
  - TECHNICIAN
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: finalizeInquiry
  description: '고객의 해결됨 피드백이 저장된 COMPLETION_PENDING 문의를 해당 상담 또는 방문 처리 담당자가 RESOLVED로 최종 완료한다.

    '
- code: PRODUCT_VALIDATION_FAILED
  category: SYSTEM_EVENT
  scope: AI_RESULT
  actor_roles:
  - SYSTEM
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: false
  requires_state_version: true
  external_action:
    exposed: false
    operation_id: null
  description: '지원 모델, 제품 소유권 또는 필수값 검증 실패 시 AI·RAG 실행을 차단하고 입력을 보존한 채 상담 연결이 가능한 상태로 전환한다.

    '
- code: SAFE_GUIDANCE_READY
  category: SYSTEM_EVENT
  scope: AI_RESULT
  actor_roles:
  - SYSTEM
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: false
  requires_state_version: true
  external_action:
    exposed: false
    operation_id: null
  description: '공식 근거와 안전 검증을 통과한 고객 안내가 준비되어 Inquiry를 AI_GUIDANCE로 전환한다.

    '
- code: HUMAN_REVIEW_GUIDANCE_APPROVED
  category: SYSTEM_EVENT
  scope: INQUIRY
  actor_roles:
  - SYSTEM
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: false
  requires_state_version: true
  external_action:
    exposed: false
    operation_id: null
  description: '상담사가 검증 Evidence를 확인해 CAUTION Guidance를 승인하거나 수정했고 최종 상담 필요 값이 false이면 고객 안내 상태로 전환한다.

    '
- code: HUMAN_REVIEW_CONSULTATION_REQUIRED
  category: SYSTEM_EVENT
  scope: INQUIRY
  actor_roles:
  - SYSTEM
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: false
  requires_state_version: true
  external_action:
    exposed: false
    operation_id: null
  description: '상담사가 Guidance를 승인하거나 수정했지만 최종 상담 필요 값이 true이면 승인된 안전 안내를 보존하고 상담 대기 건을 생성한다.

    '
- code: HUMAN_REVIEW_REJECTED
  category: SYSTEM_EVENT
  scope: INQUIRY
  actor_roles:
  - SYSTEM
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: false
  requires_state_version: true
  external_action:
    exposed: false
    operation_id: null
  description: '상담사가 Guidance를 거절하면 고객 공개를 차단하고 상담 대기 건을 생성한다.

    '
- code: DANGER_DETECTED
  category: SYSTEM_EVENT
  scope: AI_RESULT
  actor_roles:
  - SYSTEM
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: false
  requires_state_version: true
  external_action:
    exposed: false
    operation_id: null
  description: '명시적 위험 규칙에 해당하여 일반 자가조치 경로를 차단하고 Inquiry를 CONSULTATION_REQUIRED로 전환한다.

    '
- code: NO_EVIDENCE
  category: SYSTEM_EVENT
  scope: AI_RESULT
  actor_roles:
  - SYSTEM
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: false
  requires_state_version: true
  external_action:
    exposed: false
    operation_id: null
  description: '사용할 수 있는 공식 근거가 없어 임의 안내를 차단하고 Inquiry를 CONSULTATION_REQUIRED로 전환한다. 사용 안내 상태는 PENDING_CONSULTATION을 사용한다.

    '
- code: AI_PROCESSING_TIMEOUT
  category: SYSTEM_EVENT
  scope: AI_RESULT
  actor_roles:
  - SYSTEM
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: false
  requires_state_version: true
  external_action:
    exposed: false
    operation_id: null
  description: 'Backend가 AI-TIMEOUT-01을 확인하면 고객 입력을 보존하고 자동 재시도나 상담 레코드 생성 없이 Inquiry를 CONSULTATION_REQUIRED로 전환한다.

    '
- code: VISIT_NOT_NEEDED
  category: STAFF_COMMAND
  scope: CONSULTATION
  actor_roles:
  - CONSULTANT
  changes_inquiry_state: true
  changes_visit_state: false
  requires_idempotency_key: true
  requires_state_version: true
  external_action:
    exposed: true
    operation_id: markVisitNotNeeded
  description: 방문 검토 결과 방문이 불필요하다고 확정하고, 상담 처리 결과에 대한 고객 확인·담당자 최종 완료 단계로 전환한다.
