contract:
  name: role-permissions
  version: 1.0.0
  status: TEAM_APPROVED
  owner: PM_TECHNICAL_INTEGRATION
  description: State Machine 이벤트 실행 권한과 리소스 접근 범위를 역할별로 정의한다. 명시되지 않은 권한은 기본 거부하며, allowed_actions 계산과 API 권한 검사의 공통 기준으로
    사용한다.
references:
  inquiry_events: ./inquiry-events.yaml
  transition_rules: ./transition-rules.yaml
  transition_guards: ./transition-guards.yaml
  allowed_actions: ./allowed-actions.yaml
default_policy:
  unlisted_permission: DENY
  require_authentication_for_external_actions: true
  system_events_external_access: DENY
  resource_access_failure_status: 404
  role_failure_status: 403
roles:
- code: CUSTOMER
  description: 본인 제품과 문의를 등록하고 증상·문진·해결 피드백·상담 요청을 수행한다.
  resource_scope:
  - OWN_CUSTOMER_PROFILE
  - OWN_REGISTERED_PRODUCTS
  - OWN_INQUIRIES
  - OWN_QUESTIONNAIRE_SESSIONS
  allowed_events:
  - START_CARE_PRECHECK
  - START_INQUIRY
  - PRODUCT_UPDATED
  - SUBMIT_SYMPTOM
  - CANCEL_INQUIRY
  - SUBMIT_ANSWERS
  - CUSTOMER_REPORTED_SELF_RESOLVED
  - REQUEST_CONSULTATION
  - SUBMIT_RESOLUTION_FEEDBACK
  - CUSTOMER_REPORTED_UNRESOLVED
  prohibited_capabilities:
  - ASSIGN_CONSULTANT
  - ASSIGN_TECHNICIAN
  - CHANGE_STATE_DIRECTLY
  - EXECUTE_SYSTEM_EVENT
  - VIEW_INTERNAL_AI_FIELDS
- code: CONSULTANT
  description: 합성 고객의 전화 문의 등록, 미배정 상담 대기열 Claim과 배정된 문의의 상담 처리, 방문 판단·일정 조율 및 상담 건 최종 완료를 수행한다.
  resource_scope:
  - SYNTHETIC_ACTIVE_CUSTOMER_SUBSCRIPTIONS
  - UNASSIGNED_CONSULTATION_QUEUE
  - ASSIGNED_INQUIRIES
  - ASSIGNED_CONSULTATIONS
  - RELATED_VISITS_FOR_SCHEDULING
  allowed_events:
  - REGISTER_PHONE_INQUIRY
  - CANCEL_INQUIRY
  - RESUME_CONSULTATION
  - CLAIM_CONSULTATION
  - START_CONSULTATION
  - CONSULTATION_COMPLETED
  - VISIT_REVIEW_REQUIRED
  - VISIT_NEEDED
  - VISIT_NOT_NEEDED
  - UPDATE_VISIT_SCHEDULE
  - CONFIRM_VISIT
  - UPDATE_CONSULTATION_SUMMARY
  - CONFIRM_CONSULTATION_SUMMARY
  - FINALIZE_INQUIRY
  prohibited_capabilities:
  - FINALIZE_OTHER_HANDLER_WORK
  - START_OR_COMPLETE_FIELD_VISIT
  - CHANGE_STATE_DIRECTLY
  - EXECUTE_SYSTEM_EVENT
  - VIEW_RAW_VECTOR_FIELDS
- code: TECHNICIAN
  description: 배정된 방문의 사전 리포트, 현장 점검·완료·재방문 판단과 방문 건 최종 완료를 수행한다.
  resource_scope:
  - ASSIGNED_VISITS
  - INQUIRIES_LINKED_TO_ASSIGNED_VISITS
  allowed_events:
  - UPDATE_PREVISIT_REPORT
  - CONFIRM_PREVISIT_REPORT
  - START_VISIT
  - VISIT_COMPLETED
  - REVISIT_NEEDED
  - FINALIZE_INQUIRY
  prohibited_capabilities:
  - START_CONSULTATION
  - ASSIGN_SELF_TO_VISIT
  - FINALIZE_OTHER_HANDLER_WORK
  - CHANGE_STATE_DIRECTLY
  - EXECUTE_SYSTEM_EVENT
  - VIEW_RAW_VECTOR_FIELDS
- code: OPERATOR
  description: 운영 권한 범위 안에서 문의 취소 등 제한된 관리 작업을 수행한다.
  resource_scope:
  - AUTHORIZED_OPERATIONAL_INQUIRIES
  allowed_events:
  - CANCEL_INQUIRY
  required_permissions:
    CANCEL_INQUIRY:
    - INQUIRY_CANCEL
  prohibited_capabilities:
  - PERFORM_CONSULTATION
  - PERFORM_VISIT
  - FINALIZE_INQUIRY
  - EXECUTE_SYSTEM_EVENT
- code: SYSTEM
  description: 신뢰된 백엔드 내부 프로세스로서 검증된 AI·제품 판정 이벤트만 실행한다.
  resource_scope:
  - INTERNAL_SERVICE_CONTEXT
  allowed_events:
  - PRODUCT_VALIDATION_FAILED
  - SAFE_GUIDANCE_READY
  - AI_CONSULTATION_REQUIRED
  - DANGER_DETECTED
  - NO_EVIDENCE
  - AI_PROCESSING_TIMEOUT
  prohibited_capabilities:
  - EXPOSE_INTERNAL_EVENT_AS_PUBLIC_API
  - BYPASS_STATE_VERSION
  - WRITE_STATE_WITHOUT_GUARDS
g2_projection_contract:
  decision_id: DEC-007
  decision_status: FINAL_APPROVED
  scope: G2_CONSULTANT_VISIT_MACHINE_CONTRACT
  projection_authority: BACKEND
  data_policy:
    development_test_presentation_data: SYNTHETIC_ONLY
    actual_personal_data: DENY
    inaccessible_field_behavior: OMIT
    null_placeholder_for_denied_field: DENY
    pii_in_url_error_log_cache_analytics: DENY
  object_access:
    unassigned_consultation_queue:
      required_role: CONSULTANT
      required_assignment: inquiry.assigned_consultant_id is null
      required_consultation_status: WAITING
      claim_conflict_behavior:
        http_status: 404
        error_code: RESOURCE_NOT_FOUND
    consultant_inquiry:
      required_role: CONSULTANT
      required_assignment: inquiry.assigned_consultant_id == actor.user_id
      assignment_failure:
        http_status: 404
        error_code: RESOURCE_NOT_FOUND
    technician_visit:
      required_role: TECHNICIAN
      required_assignment: visit.assigned_technician_id == actor.user_id
      require_synthetic_actor: true
      assignment_failure:
        http_status: 404
        error_code: RESOURCE_NOT_FOUND
  projections:
    unassigned_consultation_queue:
      schema_ref: ../api/components/schemas/inquiry/UnassignedConsultationQueueItem.yaml
      required_scope: UNASSIGNED_CONSULTATION_QUEUE
      data_source: SYNTHETIC_FIXTURE
      allow_fields:
      - inquiry_id
      - inquiry_code
      - status
      - state_version
      - risk_level
      - priority
      - symptom_summary
      - customer_display_name_masked
      - product_model
      - current_assignee_type
      - received_at
      - updated_at
      - waiting_seconds
      - allowed_actions
      deny_fields:
      - customer_phone
      - customer_address
      - evidence
      - consultation_detail
    consultant_inquiry_list:
      schema_ref: ../api/components/schemas/inquiry/ConsultantInquiryListItem.yaml
      required_scope: ASSIGNED_INQUIRIES
      data_source: SYNTHETIC_FIXTURE
      allow_fields:
      - inquiry_id
      - inquiry_code
      - status
      - state_version
      - risk_level
      - priority
      - symptom_summary
      - customer_display_name_masked
      - product_model
      - current_assignee_type
      - received_at
      - updated_at
      - waiting_seconds
      - allowed_actions
      deny_fields:
      - customer_phone
      - customer_address
      - evidence
    consultant_inquiry_detail:
      schema_ref: ../api/components/schemas/inquiry/ConsultantInquiryDetail.yaml
      required_scope: ASSIGNED_INQUIRIES
      data_source: SYNTHETIC_FIXTURE
      customer_projection:
        required_constant:
          is_synthetic: true
        allow_fields:
        - display_name
        - phone
        deny_fields:
        - address
        - service_address
        - email
      synthetic_technician_projection:
        schema_ref: ../api/components/schemas/visit/SyntheticTechnicianProjection.yaml
        visibility_condition: visit.assigned_technician_id is not null
        required_constant:
          is_synthetic: true
        allow_fields:
        - technician_id
        - display_name
        - phone
    assigned_technician_visit:
      required_scope: ASSIGNED_VISITS
      data_source: SYNTHETIC_FIXTURE
      visibility_condition: visit.assigned_technician_id == actor.user_id
      customer_projection:
        required_constant:
          is_synthetic: true
        allow_fields:
        - display_name
        - phone
        - service_address
      allow_fields:
      - visit_id
      - inquiry_id
      - visit_handoff
      - visit_schedule
      - allowed_actions
      - state_version
      deny_fields:
      - unrelated_customer_consultations
      - evidence
  global_deny_fields:
  - actual_customer_name
  - actual_customer_phone
  - actual_customer_address
  - actual_customer_email
  - resident_registration_number
  - payment_information
  - raw_source_storage_path
  - vector_chunk_id
  - vector_embedding
  - model_internal_reasoning
  - internal_guard_failure_detail
field_visibility:
  customer:
    allow:
    - public_id
    - inquiry_code
    - current_status
    - state_version
    - customer_guidance
    - usage_guidance_status
    - official_evidence_display
    - allowed_actions
    - visit_schedule_display
    deny:
    - internal_pk
    - raw_source_storage_path
    - vector_chunk_id
    - model_internal_reasoning
    - internal_guard_failure_detail
  consultant:
    allow:
    - unassigned_consultation_queue_projection
    - assigned_inquiry_projection
    - synthetic_customer_projection
    - synthetic_technician_projection
    - approved_consultation_projection
    - date_only_visit_projection
    - allowed_actions
    - state_version
    deny:
    - actual_personal_data
    - unassigned_inquiry_detail
    - evidence
    - raw_source_storage_path
    - vector_embedding
    - model_internal_reasoning
  technician:
    allow:
    - visit_handoff
    - date_only_visit_schedule
    - synthetic_customer_projection
    - allowed_actions
    - state_version
    deny:
    - actual_personal_data
    - unassigned_visits
    - unrelated_customer_consultations
    - evidence
    - raw_source_storage_path
    - vector_chunk_id
    - model_internal_reasoning
validation_expectations:
- 모든 allowed_events는 inquiry-events.yaml에 존재해야 한다.
- 각 이벤트의 actor_roles와 이 파일의 역할별 allowed_events가 일치해야 한다.
- SYSTEM_EVENT는 SYSTEM 역할 외에 허용할 수 없다.
- FINALIZE_INQUIRY는 CONSULTANT와 TECHNICIAN에게만 허용하되 마지막 처리 담당자 Guard를 통과해야 한다.
- 명시되지 않은 역할·이벤트 조합은 거부한다.
- G2 Projection은 실제 개인정보 대신 합성 데이터만 사용하고, 허용 목록에 없는 필드는 null이 아니라 생략한다.
- 비담당 문의·방문은 RESOURCE_NOT_FOUND 404로 은닉한다.
