# current_state + event -> next_state
transitions:
  - {from: null, event: START_INQUIRY, to: DRAFT}
  - {from: DRAFT, event: SUBMIT_SYMPTOM, to: QUESTIONNAIRE_IN_PROGRESS}
  - {from: PRODUCT_VALIDATION_FAILED, event: SUBMIT_SYMPTOM, to: QUESTIONNAIRE_IN_PROGRESS}
  - {from: QUESTIONNAIRE_IN_PROGRESS, event: SUBMIT_ANSWERS, to: QUESTIONNAIRE_IN_PROGRESS}
  - {from: QUESTIONNAIRE_IN_PROGRESS, event: PRODUCT_VALIDATION_FAILED, to: PRODUCT_VALIDATION_FAILED}
  - {from: QUESTIONNAIRE_IN_PROGRESS, event: SAFE_GUIDANCE_READY, to: AI_GUIDANCE_READY}
  - {from: QUESTIONNAIRE_IN_PROGRESS, event: DANGER_DETECTED, to: CONSULTATION_PENDING}
  - {from: QUESTIONNAIRE_IN_PROGRESS, event: NO_EVIDENCE, to: CONSULTATION_PENDING}
  - {from: AI_GUIDANCE_READY, event: CUSTOMER_REPORTED_SELF_RESOLVED, to: RESOLVED}
  - {from: AI_GUIDANCE_READY, event: REQUEST_CONSULTATION, to: CONSULTATION_PENDING}
  - {from: CONSULTATION_PENDING, event: START_CONSULTATION, to: CONSULTATION_IN_PROGRESS}
  - {from: REOPENED, event: START_CONSULTATION, to: CONSULTATION_IN_PROGRESS}
  - {from: CONSULTATION_IN_PROGRESS, event: CONSULTATION_COMPLETED, to: COMPLETION_PENDING}
  - {from: CONSULTATION_IN_PROGRESS, event: VISIT_NEEDED, to: VISIT_REVIEW_PENDING}
  - {from: VISIT_REVIEW_PENDING, event: UPDATE_VISIT_SCHEDULE, to: VISIT_REVIEW_PENDING}
  - {from: VISIT_REVIEW_PENDING, event: CONFIRM_VISIT, to: VISIT_PENDING}
  - {from: VISIT_PENDING, event: UPDATE_VISIT_SCHEDULE, to: VISIT_PENDING}
  - {from: VISIT_PENDING, event: START_VISIT, to: VISIT_IN_PROGRESS}
  - {from: VISIT_IN_PROGRESS, event: VISIT_COMPLETED, to: COMPLETION_PENDING}
  - {from: COMPLETION_PENDING, event: SUBMIT_RESOLUTION_FEEDBACK, to: COMPLETION_PENDING}
  - {from: COMPLETION_PENDING, event: FINALIZE_INQUIRY, to: RESOLVED}
  - {from: COMPLETION_PENDING, event: RESUME_CONSULTATION, to: REOPENED}
  - {from: RESOLVED, event: RESUME_CONSULTATION, to: REOPENED}
