  - SET_USAGE_GUIDANCE_PENDING_CONSULTATION
  - DO_NOT_CREATE_CONSULTATION
  description: AI 처리 시간 초과를 감사 이력으로 남기고 고객이 직접 상담을 요청할 수 있는 상태로 전환한다.
