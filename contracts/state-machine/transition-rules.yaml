  from_inquiry_state: DRAFT
  to_inquiry_state: QUESTIONNAIRE_IN_PROGRESS
  visit:
    mode: REQUIRE_ABSENT
  history:
    record_inquiry_state_history: true
    record_visit_state_history: false
    record_business_event: true
  guard_refs:
  - G-ACTOR-CUSTOMER
  - G-INQUIRY-OWNER
  - G-STATE-VERSION
  - G-IDEMPOTENCY-KEY
  - G-SYMPTOM-PAYLOAD-VALID
  effects:
  - STORE_CUSTOMER_SYMPTOM_INPUT
  - MARK_QUESTIONNAIRE_SUBMITTED
  - REQUEST_AI_STRUCTURING
  description: 최초 증상을 제출하고 AI 구조화·추가 질문 확인 단계로 진입한다.
- id: TR-INQ-003
  event: SUBMIT_ANSWERS
  from_inquiry_state: QUESTIONNAIRE_IN_PROGRESS
  to_inquiry_state: QUESTIONNAIRE_IN_PROGRESS
  visit:
    mode: REQUIRE_ABSENT
  history:
    record_inquiry_state_history: false
    record_visit_state_history: false
    record_business_event: true
  guard_refs:
