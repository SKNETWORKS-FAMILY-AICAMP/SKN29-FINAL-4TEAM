    '
- event: PRODUCT_UPDATED
  reason: '제품 정보 수정은 Inquiry State Machine 전이가 아니며 products 계약과 감사 로그에서 관리한다.

    '
validation_expectations:
- 모든 from_inquiry_state와 to_inquiry_state는 inquiry-states.yaml에 존재해야 한다.
- 모든 event는 inquiry-events.yaml에 존재해야 한다.
- 같은 from_inquiry_state·event·Visit 조건 조합은 하나의 규칙만 가져야 한다.
- 상태가 바뀌는 규칙은 record_inquiry_state_history가 true여야 한다.
- Visit 상태가 생성되거나 바뀌는 규칙은 record_visit_state_history가 true여야 한다.
- RESOLVED와 CANCELLED에는 후속 전이가 없어야 한다.
- START_INQUIRY 외 규칙은 기존 Inquiry와 state_version을 전제로 한다.
