contract:
  name: transition-rules
  version: 1.0.0
  status: TEAM_APPROVED
  owner: PM_TECHNICAL_INTEGRATION
  description: 'Inquiry의 현재 상태와 이벤트를 다음 Inquiry 상태 및 Visit 상태에 연결한다. 목록에 없는 상태·이벤트 조합은 허용하지 않으며 INVALID_STATE_TRANSITION으로
    거부한다.

    '
  source_documents:
  - docs/planning/md/week3-scope-and-dod.md
  - (화면설계서_29기_4팀) 정수기 구독 고객 케어 및 A_S 업무 지원 시스템.md
  - (WBS_29기_4팀) 정수기 구독 고객 케어 및 AS 업무 지원 시스템.md
references:
  inquiry_states: ./inquiry-states.yaml
  inquiry_events: ./inquiry-events.yaml
  transition_guards: ./transition-guards.yaml
  allowed_actions: ./allowed-actions.yaml
  completion_policy: ./completion-policy.yaml
  concurrency_policy: ./concurrency-policy.yaml
guard_contract_status: defined_in_transition-guards_v1.0.0
rule_semantics:
  unlisted_transition_policy: DENY
  invalid_transition_error_code: INVALID_STATE_TRANSITION
  visit_modes:
    REQUIRE_ABSENT: Visit이 존재하지 않아야 하며 새 Visit을 만들지 않는다.
    PRESERVE: Visit 존재 여부와 현재 상태를 그대로 유지한다.
    PRESERVE_REQUIRE_STATUS: 지정한 Visit 상태가 존재해야 하며 상태는 유지한다.
    CREATE: Visit이 없어야 하며 지정 상태로 새 Visit을 생성한다.
    TRANSITION: 지정한 기존 Visit 상태를 결과 상태로 변경한다.
  version_actions:
    INITIALIZE_1: Inquiry 생성 시 state_version을 1로 설정한다.
    INCREMENT: 성공한 쓰기 작업마다 state_version을 1 증가시킨다.
defaults:
  require_correlation_id: true
  record_business_event: true
  version_action: INCREMENT
  preserve_customer_input_on_failure: true
terminal_state_policy:
  RESOLVED:
    allowed_events: []
    description: '종료된 문의는 같은 Inquiry 안에서 다시 전이하지 않는다. 새로운 증상이 생기면 새 Inquiry를 생성한다.

      '
  CANCELLED:
    allowed_events: []
    description: '취소된 문의는 다시 전이하지 않는다. 재시작이 필요하면 새 Inquiry를 생성한다.

      '
transitions:
- id: TR-INQ-001
  event: START_INQUIRY
  from_inquiry_state: null
  to_inquiry_state: DRAFT
  visit:
    mode: REQUIRE_ABSENT
  history:
    record_inquiry_state_history: true
    record_visit_state_history: false
    record_business_event: true
  version_action: INITIALIZE_1
  guard_refs:
  - G-ACTOR-CUSTOMER
  - G-CUSTOMER-PRODUCT-OWNERSHIP
  - G-IDEMPOTENCY-KEY
  effects:
  - CREATE_INQUIRY
  - LINK_OPTIONAL_QUESTIONNAIRE_SESSION
  description: 새 문의를 생성하고 초기 상태 DRAFT로 진입한다.
- id: TR-INQ-035
  event: REGISTER_PHONE_INQUIRY
  from_inquiry_state: null
  to_inquiry_state: CONSULTATION_REQUIRED
  visit:
    mode: REQUIRE_ABSENT
  history:
    record_inquiry_state_history: true
    record_visit_state_history: false
    record_business_event: true
  version_action: INITIALIZE_1
  guard_refs:
  - G-ACTOR-CONSULTANT
  - G-CONSULTANT-PHONE-SUBSCRIPTION
  - G-IDEMPOTENCY-KEY
  effects:
  - CREATE_INQUIRY
  - ASSIGN_CURRENT_CONSULTANT
  - STORE_PHONE_INTAKE
  - SET_REQUIRES_CONSULTATION
  description: 합성 고객의 활성 구독에 전화 문의를 생성하고 현재 상담사에게 배정한 상담 대기 상태로 진입한다.
- id: TR-INQ-002
