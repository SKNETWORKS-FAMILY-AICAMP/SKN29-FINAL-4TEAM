  - G-INQUIRY-OWNER
  - G-STATE-VERSION
  - G-IDEMPOTENCY-KEY
  - G-FOLLOWUP-ANSWERS-VALID
  effects:
  - APPEND_QUESTIONNAIRE_ANSWERS
  - REQUEST_AI_REEVALUATION
  description: 추가 답변을 누적하고 Inquiry 상태는 유지한다.
- id: TR-INQ-004
  event: CANCEL_INQUIRY
  from_inquiry_state: DRAFT
  to_inquiry_state: CANCELLED
  visit:
    mode: REQUIRE_ABSENT
  history:
    record_inquiry_state_history: true
    record_visit_state_history: false
    record_business_event: true
  guard_refs:
  - G-CANCEL-ACTOR-AUTHORIZED
  - G-STATE-VERSION
  - G-IDEMPOTENCY-KEY
  - G-CANCELLATION-REASON
  effects:
