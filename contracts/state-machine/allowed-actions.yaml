contract:
  name: allowed-actions
  version: 1.0.0
  status: TEAM_APPROVED
  owner: PM_TECHNICAL_INTEGRATION
  description: 'Inquiry의 현재 상태, 실행자 역할, Visit 상태와 Guard 평가 결과를 바탕으로 API가 클라이언트에 반환할 수 있는 행동을 정의한다. 웹·모바일은 상태를 독자적으로 해석하지 않고
    Backend가 반환한 allowed_actions만 노출한다.

    '
  source_documents:
  - docs/planning/md/week3-scope-and-dod.md
  - (화면설계서_29기_4팀) 정수기 구독 고객 케어 및 A_S 업무 지원 시스템.md
  - (요구사항정의서_29기_4팀) 정수기 구독 고객 케어 및 A_S 업무 지원 시스템.md
references:
  inquiry_states: ./inquiry-states.yaml
  inquiry_events: ./inquiry-events.yaml
  transition_rules: ./transition-rules.yaml
  transition_guards: ./transition-guards.yaml
  role_permissions: ./role-permissions.yaml
calculation_policy:
  authority: BACKEND
  include_only_external_actions: true
  include_system_events: false
  candidate_selection:
  - 현재 Inquiry 상태와 실행자 역할에 해당하는 state_role_actions를 조회한다.
  - Visit 조건이 있는 행동은 현재 Visit 존재 여부와 상태를 확인한다.
  - 연결된 transition_rule_ids 중 현재 Visit 조건과 일치하는 규칙을 선택한다.
  - 선택된 규칙의 모든 guard_refs를 평가한다.
  - 모든 Guard를 통과한 행동만 allowed_actions 응답에 포함한다.
  client_rules:
  - 웹·모바일은 상태 코드만 보고 행동 가능 여부를 재계산하지 않는다.
  - allowed_actions에 없는 버튼과 메뉴는 숨기거나 비활성화한다.
  - 쓰기 요청에는 응답으로 받은 state_version과 새 Idempotency-Key를 사용한다.
  - 409 STATE_VERSION_CONFLICT가 발생하면 최신 상태와 allowed_actions로 화면을 다시 그린다.
  security_rules:
  - 고객에게 Guard 실패 세부 조건이나 다른 사용자의 리소스 존재 여부를 노출하지 않는다.
  - internal_only 행동과 SYSTEM_EVENT는 외부 allowed_actions에 포함하지 않는다.
  - operation_id는 API 계약 연결용이며 실제 URL을 이 파일에서 고정하지 않는다.
response_contract:
  field_name: allowed_actions
  item_fields:
  - code
  - label
  - operation_id
  - style
  - requires_confirmation
  - confirmation_message
  example:
    current_status: CONSULTATION_REQUIRED
    state_version: 4
    allowed_actions:
    - code: START_CONSULTATION
      label: 상담 시작
      operation_id: startConsultation
      style: PRIMARY
      requires_confirmation: false
      confirmation_message: null
styles:
- PRIMARY
- SECONDARY
- DESTRUCTIVE
action_catalog:
