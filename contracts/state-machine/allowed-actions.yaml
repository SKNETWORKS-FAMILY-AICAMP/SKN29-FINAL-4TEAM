state_role_actions:
  DRAFT:
    CUSTOMER:
    - action: SUBMIT_SYMPTOM
      transition_rule_ids:
      - TR-INQ-002
    - action: CANCEL_INQUIRY
      transition_rule_ids:
      - TR-INQ-004
    CONSULTANT:
    - action: CANCEL_INQUIRY
      transition_rule_ids:
      - TR-INQ-004
      dynamic_requirements:
      - 현재 문의에 상담사로 배정되어 있어야 한다.
    OPERATOR:
    - action: CANCEL_INQUIRY
      transition_rule_ids:
      - TR-INQ-004
      dynamic_requirements:
      - INQUIRY_CANCEL 권한이 있어야 한다.
  QUESTIONNAIRE_IN_PROGRESS:
    CUSTOMER:
    - action: SUBMIT_ANSWERS
      transition_rule_ids:
      - TR-INQ-003
    - action: CANCEL_INQUIRY
      transition_rule_ids:
      - TR-INQ-005
    CONSULTANT:
    - action: CANCEL_INQUIRY
      transition_rule_ids:
      - TR-INQ-005
      dynamic_requirements:
      - 현재 문의에 상담사로 배정되어 있어야 한다.
    OPERATOR:
    - action: CANCEL_INQUIRY
      transition_rule_ids:
      - TR-INQ-005
      dynamic_requirements:
      - INQUIRY_CANCEL 권한이 있어야 한다.
  AI_GUIDANCE:
    CUSTOMER:
    - action: CUSTOMER_REPORTED_SELF_RESOLVED
      transition_rule_ids:
      - TR-INQ-011
    - action: REQUEST_CONSULTATION
      transition_rule_ids:
      - TR-INQ-012
  CONSULTATION_REQUIRED:
    CUSTOMER:
    - action: REQUEST_CONSULTATION
      transition_rule_ids:
      - TR-INQ-013
      dynamic_requirements:
      - 시스템 전환으로 생성된 상담 필요 상태에서 고객의 상담 요청 확인을 기록할 수 있다.
    - action: CANCEL_INQUIRY
      transition_rule_ids:
      - TR-INQ-038
    CONSULTANT:
    - action: CLAIM_CONSULTATION
      transition_rule_ids:
      - TR-INQ-037
      dynamic_requirements:
      - 문의와 WAITING 상담이 모두 미배정 상태여야 한다.
    - action: START_CONSULTATION
      transition_rule_ids:
      - TR-INQ-014
      dynamic_requirements:
      - 현재 문의의 담당 상담사여야 한다.
    - action: CANCEL_INQUIRY
      transition_rule_ids:
      - TR-INQ-038
      dynamic_requirements:
      - 현재 문의에 상담사로 배정되어 있어야 한다.
    OPERATOR:
    - action: CANCEL_INQUIRY
      transition_rule_ids:
      - TR-INQ-038
      dynamic_requirements:
      - INQUIRY_CANCEL 권한이 있어야 한다.
  CONSULTATION_IN_PROGRESS:
    CUSTOMER:
    - action: CANCEL_INQUIRY
      transition_rule_ids:
      - TR-INQ-039
    CONSULTANT:
    - action: UPDATE_CONSULTATION_SUMMARY
      transition_rule_ids:
      - TR-INQ-015
    - action: CONFIRM_CONSULTATION_SUMMARY
      transition_rule_ids:
      - TR-INQ-016
    - action: CONSULTATION_COMPLETED
      transition_rule_ids:
      - TR-INQ-017
    - action: VISIT_REVIEW_REQUIRED
      transition_rule_ids:
      - TR-INQ-018
    - action: CANCEL_INQUIRY
      transition_rule_ids:
      - TR-INQ-039
      dynamic_requirements:
      - 현재 문의에 상담사로 배정되어 있어야 한다.
    OPERATOR:
    - action: CANCEL_INQUIRY
      transition_rule_ids:
      - TR-INQ-039
      dynamic_requirements:
      - INQUIRY_CANCEL 권한이 있어야 한다.
  VISIT_REVIEW_PENDING:
    CONSULTANT:
    - action: VISIT_NEEDED
      transition_rule_ids:
      - TR-INQ-019
    - action: VISIT_NOT_NEEDED
      transition_rule_ids:
      - TR-INQ-034
  VISIT_SCHEDULING:
    CONSULTANT:
    - action: UPDATE_VISIT_SCHEDULE
      transition_rule_ids:
      - TR-INQ-020
      - TR-INQ-021
      visit_conditions:
        allowed_statuses:
        - ASSIGNING
        - SCHEDULING
    - action: CONFIRM_VISIT
      transition_rule_ids:
      - TR-INQ-022
      visit_conditions:
        required_status: SCHEDULING
  VISIT_SCHEDULED:
    TECHNICIAN:
    - action: UPDATE_PREVISIT_REPORT
      transition_rule_ids:
      - TR-INQ-023
      visit_conditions:
        required_status: CONFIRMED
    - action: CONFIRM_PREVISIT_REPORT
      transition_rule_ids:
      - TR-INQ-024
      visit_conditions:
        required_status: CONFIRMED
    - action: START_VISIT
      transition_rule_ids:
      - TR-INQ-025
      visit_conditions:
        required_status: CONFIRMED
    - action: VISIT_COMPLETED
      transition_rule_ids:
      - TR-INQ-026
      visit_conditions:
        required_status: IN_PROGRESS
    - action: REVISIT_NEEDED
      transition_rule_ids:
      - TR-INQ-027
      visit_conditions:
        required_status: IN_PROGRESS
  COMPLETION_PENDING:
    CUSTOMER:
    - action: SUBMIT_RESOLUTION_FEEDBACK
      transition_rule_ids:
      - TR-INQ-029
      dynamic_requirements:
      - 최신 처리 이후 해결됨 고객 피드백이 아직 없어야 한다.
    - action: CUSTOMER_REPORTED_UNRESOLVED
      transition_rule_ids:
      - TR-INQ-030
    - action: REQUEST_CONSULTATION
      transition_rule_ids:
      - TR-INQ-031
      dynamic_requirements:
      - 최신 처리 이후 해결됨 고객 피드백이 아직 없어야 한다.
    CONSULTANT:
    - action: FINALIZE_INQUIRY
      transition_rule_ids:
      - TR-INQ-033
      dynamic_requirements:
      - completion_source가 CONSULTATION이어야 한다.
      - 실행자가 마지막 상담 처리 담당자여야 한다.
      - 최신 고객 해결됨 피드백이 존재해야 한다.
    TECHNICIAN:
    - action: FINALIZE_INQUIRY
      transition_rule_ids:
      - TR-INQ-033
      dynamic_requirements:
      - completion_source가 VISIT이어야 한다.
      - 실행자가 마지막 방문 처리 담당자여야 한다.
      - 최신 고객 해결됨 피드백이 존재해야 한다.
  REVISIT_REQUIRED:
    CONSULTANT:
    - action: UPDATE_VISIT_SCHEDULE
      transition_rule_ids:
      - TR-INQ-028
      visit_conditions:
        required_status: FOLLOW_UP_REQUIRED
  REOPENED:
    CONSULTANT:
    - action: RESUME_CONSULTATION
      transition_rule_ids:
      - TR-INQ-032
  RESOLVED: {}
  CANCELLED: {}
internal_events_by_state:
  DRAFT:
  - PRODUCT_VALIDATION_FAILED
  QUESTIONNAIRE_IN_PROGRESS:
  - PRODUCT_VALIDATION_FAILED
  - SAFE_GUIDANCE_READY
  - DANGER_DETECTED
  - NO_EVIDENCE
  - AI_PROCESSING_TIMEOUT
  AI_GUIDANCE: []
  CONSULTATION_REQUIRED: []
  CONSULTATION_IN_PROGRESS: []
  VISIT_REVIEW_PENDING: []
  VISIT_SCHEDULING: []
  VISIT_SCHEDULED: []
  COMPLETION_PENDING: []
  REVISIT_REQUIRED: []
  REOPENED: []
  RESOLVED: []
  CANCELLED: []
validation_expectations:
- action_catalog의 모든 code는 inquiry-events.yaml에 존재해야 한다.
- action_catalog의 operation_id는 inquiry-events.yaml의 operation_id와 일치해야 한다.
- state_role_actions의 모든 상태는 inquiry-states.yaml에 존재해야 한다.
- state_role_actions의 모든 action은 action_catalog에 존재해야 한다.
- 연결된 transition_rule_ids는 transition-rules.yaml에 존재해야 한다.
- 연결된 전이의 from_inquiry_state는 상위 상태와 일치해야 한다.
- 역할은 inquiry-events.yaml의 actor_roles에 포함되어야 한다.
- SYSTEM_EVENT는 외부 state_role_actions에 포함될 수 없다.
- RESOLVED와 CANCELLED의 외부 행동 목록은 비어 있어야 한다.
resolved_scope_gaps:
- id: GAP-AA-001
  resolution: VISIT_NOT_NEEDED 이벤트와 TR-INQ-034 전이를 추가하여 VISIT_REVIEW_PENDING에서 방문 없이 COMPLETION_PENDING으로 이동할 수 있게 했다.
