# 상태·역할별 화면 허용 행동
rules:
  - state: DRAFT
    actions:
      CUSTOMER: [SUBMIT_SYMPTOM]
  - state: QUESTIONNAIRE_IN_PROGRESS
    actions:
      CUSTOMER: [SUBMIT_ANSWERS]
  - state: PRODUCT_VALIDATION_FAILED
    actions:
      CUSTOMER: [UPDATE_PRODUCT, SUBMIT_SYMPTOM]
  - state: AI_GUIDANCE_READY
    actions:
      CUSTOMER: [CUSTOMER_REPORTED_SELF_RESOLVED, REQUEST_CONSULTATION]
  - state: CONSULTATION_PENDING
    actions:
      COUNSELOR: [START_CONSULTATION]
  - state: CONSULTATION_IN_PROGRESS
    actions:
      COUNSELOR: [CONSULTATION_COMPLETED, VISIT_NEEDED]
  - state: VISIT_REVIEW_PENDING
    actions:
      COUNSELOR: [UPDATE_VISIT_SCHEDULE, CONFIRM_VISIT]
  - state: VISIT_PENDING
    actions:
      COUNSELOR: [UPDATE_VISIT_SCHEDULE]
      TECHNICIAN: [START_VISIT]
  - state: VISIT_IN_PROGRESS
    actions:
      TECHNICIAN: [VISIT_COMPLETED]
  - state: COMPLETION_PENDING
    actions:
      CUSTOMER: [SUBMIT_RESOLUTION_FEEDBACK, RESUME_CONSULTATION]
      SNAPSHOT_COUNSELOR: [FINALIZE_INQUIRY]
      SNAPSHOT_TECHNICIAN: [FINALIZE_INQUIRY]
  - state: RESOLVED
    actions:
      CUSTOMER: [RESUME_CONSULTATION]
  - state: REOPENED
    actions:
      COUNSELOR: [START_CONSULTATION]
