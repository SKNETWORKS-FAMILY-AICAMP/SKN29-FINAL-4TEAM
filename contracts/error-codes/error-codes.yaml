errors:
  - code: AUTH_REQUIRED
    category: auth
    http_status: 401
    retryable: false
    user_message: 인증이 필요합니다.
    recommended_action: LOGIN
  - code: FORBIDDEN
    category: permission
    http_status: 403
    retryable: false
    user_message: 요청한 작업을 수행할 권한이 없습니다.
    recommended_action: CHECK_ROLE_OR_ASSIGNMENT
  - code: STATE-CONFLICT-01
    category: workflow
    http_status: 409
    retryable: true
    user_message: 다른 사용자가 문의 상태를 먼저 변경했습니다.
    recommended_action: REFRESH_AND_RETRY
  - code: DUPLICATE-EVENT-01
    category: workflow
    http_status: 409
    retryable: false
    user_message: 동일 Idempotency-Key가 다른 요청에 재사용되었습니다.
    recommended_action: USE_NEW_IDEMPOTENCY_KEY
  - code: AI-FAILED-01
    category: ai
    http_status: 503
    retryable: true
    user_message: AI 분석을 완료하지 못했습니다.
    recommended_action: RETRY_OR_REQUEST_CONSULTATION
  - code: SEARCH-FAILED-01
    category: retrieval
    http_status: 503
    retryable: true
    user_message: 공식 근거를 조회하지 못했습니다.
    recommended_action: RETRY_OR_REQUEST_CONSULTATION
