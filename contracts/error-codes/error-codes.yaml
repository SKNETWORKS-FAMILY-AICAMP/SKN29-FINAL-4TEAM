errors:
  - code: AUTH_REQUIRED
    category: auth
    http_status: 401
    retryable: false
    user_message: 인증이 필요합니다.
    recommended_action: LOGIN
  - code: AUTH_VERIFICATION_FAILED
    category: auth
    http_status: 401
    retryable: true
    user_message: 인증정보를 확인할 수 없습니다. 처음부터 다시 시도해 주세요.
    recommended_action: RESTART_VERIFICATION
  - code: AUTH_LOGIN_FAILED
    category: auth
    http_status: 401
    retryable: true
    user_message: 아이디 또는 비밀번호를 확인해 주세요.
    recommended_action: CHECK_CREDENTIALS
  - code: AUTH_IDENTIFIER_UNAVAILABLE
    category: auth
    http_status: 409
    retryable: false
    user_message: 사용할 수 없는 아이디입니다. 다른 아이디를 입력해 주세요.
    recommended_action: CHOOSE_ANOTHER_IDENTIFIER
  - code: AUTH_SIGNUP_CONFLICT
    category: auth
    http_status: 409
    retryable: false
    user_message: 회원가입을 완료할 수 없습니다. 처음부터 다시 시도하거나 고객지원을 이용해 주세요.
    recommended_action: RESTART_OR_CONTACT_SUPPORT
  - code: AUTH_RATE_LIMITED
    category: auth
    http_status: 429
    retryable: true
    user_message: 요청 횟수를 초과했습니다. 안내된 시간 후 다시 시도해 주세요.
    recommended_action: RETRY_AFTER
  - code: FORBIDDEN
    category: permission
    http_status: 403
    retryable: false
    user_message: 요청한 작업을 수행할 권한이 없습니다.
    recommended_action: CHECK_ROLE_OR_ASSIGNMENT
  - code: STATE-CONFLICT-01
    category: workflow
    http_status: 409
    retryable: true
    user_message: 다른 사용자가 문의 상태를 먼저 변경했습니다.
    recommended_action: REFRESH_AND_RETRY
  - code: DUPLICATE-EVENT-01
    category: workflow
    http_status: 409
    retryable: false
    user_message: 동일 Idempotency-Key가 다른 요청에 재사용되었습니다.
    recommended_action: USE_NEW_IDEMPOTENCY_KEY
  - code: CONSULTATION_RESULT_NOT_READY
    category: workflow
    http_status: 409
    retryable: true
    user_message: 상담 처리 결과가 아직 준비되지 않았습니다.
    recommended_action: REFRESH_RESULT
  - code: AI_HANDOFF_STALE
    category: workflow
    http_status: 409
    retryable: false
    user_message: AI 상담 인계 요청이 원래 실행 기록과 일치하지 않습니다.
    recommended_action: DO_NOT_RETRY_HANDOFF
  - code: PRODUCT_NOT_SUPPORTED
    category: product
    http_status: 422
    retryable: false
    user_message: 지원하는 제품 모델을 선택해 주세요.
    recommended_action: SELECT_SUPPORTED_MODEL
  - code: SUBSCRIPTION_ALREADY_ACTIVE
    category: product
    http_status: 409
    retryable: false
    user_message: 동일 제품의 활성 구독이 이미 등록되어 있습니다.
    recommended_action: OPEN_EXISTING_SUBSCRIPTION
  - code: AI-FAILED-01
    category: ai
    http_status: 503
    retryable: true
    user_message: AI 분석을 완료하지 못했습니다.
    recommended_action: RETRY_OR_REQUEST_CONSULTATION
  - code: AI_GUIDANCE_NOT_READY
    category: ai
    http_status: 409
    retryable: true
    user_message: AI 안내가 아직 준비되지 않았습니다. 상담 검토가 필요합니다.
    recommended_action: REFRESH_OR_REQUEST_CONSULTATION
  - code: AI_HANDOFF_NOT_READY
    category: ai
    http_status: 409
    retryable: true
    user_message: AI 상담 인계 기록이 아직 준비되지 않았습니다.
    recommended_action: RETRY_HANDOFF_ONCE
  - code: SEARCH-FAILED-01
    category: retrieval
    http_status: 503
    retryable: true
    user_message: 공식 근거를 조회하지 못했습니다.
    recommended_action: RETRY_OR_REQUEST_CONSULTATION
  - code: AI_HANDOFF_EVIDENCE_REJECTED
    category: evidence
    http_status: 422
    retryable: false
    user_message: AI 상담 인계 근거를 확인할 수 없습니다.
    recommended_action: REVIEW_EVIDENCE_BINDING
  - code: INVALID_REQUEST
    category: validation
    http_status: 400
    retryable: false
    user_message: 요청 형식을 확인해 주세요.
    recommended_action: CORRECT_REQUEST
  - code: RESOURCE_NOT_FOUND
    category: persistence
    http_status: 404
    retryable: false
    user_message: 요청한 대상을 찾을 수 없습니다.
    recommended_action: RETURN_TO_LIST
  - code: VALIDATION_ERROR
    category: validation
    http_status: 422
    retryable: false
    user_message: 입력값을 확인해 주세요.
    recommended_action: CORRECT_INPUT
  - code: INTERNAL_ERROR
    category: system
    http_status: 500
    retryable: false
    user_message: 요청 처리 중 오류가 발생했습니다.
    recommended_action: REPORT_WITH_CORRELATION_ID

runtime_http_mapping:
  precedence:
    - backend_error_passthrough
    - exception_overrides
    - server_error_family_fallback
    - status_overrides
    - client_error_family_fallback
    - unhandled_exception
  exception_overrides:
    - exception: rest_framework.exceptions.ValidationError
      code: VALIDATION_ERROR
      http_status: 422
  status_overrides:
    400: INVALID_REQUEST
    401: AUTH_REQUIRED
    403: FORBIDDEN
    404: RESOURCE_NOT_FOUND
  family_fallbacks:
    - minimum: 500
      maximum: 599
      code: INTERNAL_ERROR
    - minimum: 400
      maximum: 499
      code: INVALID_REQUEST
  unhandled_exception:
    code: INTERNAL_ERROR
    http_status: 500
