/me/inquiries/active:
  get:
    operationId: getMyActiveInquiry
    summary: 고객 최신 진행 문의 조회
    description: |
      인증 고객이 홈 복귀 또는 앱 재시작 후 가장 최근에 갱신된 비종결
      문의를 다시 찾도록 최소 Snapshot을 반환한다. RESOLVED와 CANCELLED는
      제외하며 진행 문의가 없으면 active_inquiry=null을 반환한다. 고객은
      응답의 inquiry_id로 기존 Snapshot과 Guidance를 다시 조회하고,
      Mobile은 상태나 allowed_actions를 자체 계산하지 않는다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-permission-scope: OWN_INQUIRY
    security: [{BearerAuth: []}]
    responses:
      "200":
        description: 최신 진행 문의 Snapshot 또는 null
        headers:
          X-Correlation-ID: {$ref: ../components/headers/CorrelationId.yaml}
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/inquiry/CustomerActiveInquiry.yaml
            examples:
              activeInquiry:
                externalValue: ../examples/inquiries/customer-active-inquiry-success.json
              noActiveInquiry:
                externalValue: ../examples/inquiries/customer-active-inquiry-empty.json
      "401": {$ref: ../components/responses/Unauthorized.yaml}
      "403": {$ref: ../components/responses/Forbidden.yaml}
      "422": {$ref: ../components/responses/UnprocessableEntity.yaml}
      "500": {$ref: ../components/responses/InternalServerError.yaml}

/me/inquiries/{inquiry_id}:
  parameters: &customer_inquiry_path_parameters
    - name: inquiry_id
      in: path
      required: true
      description: 고객 본인이 생성한 문의의 공개 UUID
      schema:
        type: string
        format: uuid
  get:
    operationId: getMyInquiry
    summary: 고객 본인 문의 Snapshot 조회
    description: |
      앱 재시작과 화면 복구를 위해 인증 고객이 본인 문의의 최신 상태와
      Backend 동적 Resolver가 계산한 allowed_actions를 조회한다. AI가
      미답변 질문을 저장한 뒤 재조회하면 SUBMIT_ANSWERS 노출 여부가 최신
      Guard 결과에 따라 바뀐다. Mobile·Web은 질문 존재만으로 Action을
      자체 계산하지 않는다. Backend는 최근 실제 CONSULTATION_REQUIRED 전환
      Event를 고객 공개 consultation_reason으로 제공한다. 현재 상태 진입 원인이
      AI_PROCESSING_TIMEOUT이면 하위 호환용 고정 system_notice도 함께 제공하며,
      다음 상태로 진행되면 system_notice는 null로 해제한다. 타 고객 문의와 없는
      문의는 동일한 404로 응답한다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-permission-scope: OWN_INQUIRY
    security: [{BearerAuth: []}]
    responses:
      "200":
        description: 고객 본인 문의의 최소 Snapshot
        headers:
          X-Correlation-ID: {$ref: ../components/headers/CorrelationId.yaml}
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/inquiry/CustomerInquirySnapshot.yaml
            examples:
              aiProcessingTimeout:
                externalValue: ../examples/inquiries/customer-timeout-snapshot-success.json
      "401": {$ref: ../components/responses/Unauthorized.yaml}
      "403": {$ref: ../components/responses/Forbidden.yaml}
      "404": {$ref: ../components/responses/NotFound.yaml}
      "422": {$ref: ../components/responses/UnprocessableEntity.yaml}
      "500": {$ref: ../components/responses/InternalServerError.yaml}

/me/inquiries/{inquiry_id}/questions:
  parameters: *customer_inquiry_path_parameters
  get:
    operationId: listMyInquiryQuestions
    summary: 고객 본인 문의 추가 질문 조회
    description: |
      인증 고객의 본인 문의에 저장된 미답변 질문 메타데이터만 순서대로 반환한다.
      답변·AI 원천·내부 target field는 이 읽기 Projection에 포함하지 않는다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-permission-scope: OWN_INQUIRY
    security: [{BearerAuth: []}]
    responses:
      "200":
        description: 고객 본인 문의의 추가 질문 목록
        headers:
          X-Correlation-ID: {$ref: ../components/headers/CorrelationId.yaml}
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/inquiry/CustomerInquiryQuestions.yaml
      "401": {$ref: ../components/responses/Unauthorized.yaml}
      "403": {$ref: ../components/responses/Forbidden.yaml}
      "404": {$ref: ../components/responses/NotFound.yaml}
      "422": {$ref: ../components/responses/UnprocessableEntity.yaml}
      "500": {$ref: ../components/responses/InternalServerError.yaml}

/me/inquiries/{inquiry_id}/guidance:
  parameters: *customer_inquiry_path_parameters
  get:
    operationId: getMyInquiryGuidance
    summary: 고객 본인 문의의 최신 AI Guidance 조회
    description: |
      스키마 검증을 통과해 저장된 최신 AI Guidance와 현재 문의 상태 및
      Backend Resolver가 계산한 allowed_actions를 반환한다. Public Evidence
      Runtime은 이번 P0 범위 밖이므로 evidence는 빈 배열이며 내부 chunk,
      score, prompt, 저장 경로, AI trace를 노출하지 않는다. Guidance가 아직
      생성되지 않았거나 AI 실행이 실패한 경우 AI_GUIDANCE_NOT_READY를 반환한다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-permission-scope: OWN_INQUIRY
    security: [{BearerAuth: []}]
    responses:
      "200":
        description: 고객 본인 문의의 최신 검증 완료 AI Guidance
        headers:
          X-Correlation-ID: {$ref: ../components/headers/CorrelationId.yaml}
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/inquiry/CustomerInquiryGuidance.yaml
      "401": {$ref: ../components/responses/Unauthorized.yaml}
      "403": {$ref: ../components/responses/Forbidden.yaml}
      "404": {$ref: ../components/responses/NotFound.yaml}
      "409": {$ref: ../components/responses/Conflict.yaml}
      "422": {$ref: ../components/responses/UnprocessableEntity.yaml}
      "500": {$ref: ../components/responses/InternalServerError.yaml}

/me/inquiries/{inquiry_id}/consultation-result:
  parameters: *customer_inquiry_path_parameters
  get:
    operationId: getMyInquiryConsultationResult
    summary: 고객 본인 문의의 최신 상담 처리 결과 조회
    description: |
      완료된 상담 중 가장 최근 결과에서 고객 공개 목적으로 저장된 안내와
      처리 결과, 사용 제한 상태, 완료 시각 및 Backend Resolver가 계산한
      allowed_actions만 반환한다. 상담 메모, 추가 확인사항, AI 초안·확정 요약,
      상담사 식별자와 상담 저장 레코드의 Correlation·Idempotency 값은
      공개하지 않는다. 공통 응답 metadata의 요청 추적용 correlation_id는
      기존 규칙대로 유지한다. 완료 상담, 고객 안내 또는 사용 제한 상태가
      준비되지 않으면 CONSULTATION_RESULT_NOT_READY를 반환하며 AI Guidance로
      대체하지 않는다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-permission-scope: OWN_INQUIRY
    security: [{BearerAuth: []}]
    responses:
      "200":
        description: 고객 본인 문의의 최신 완료 상담 결과
        headers:
          X-Correlation-ID: {$ref: ../components/headers/CorrelationId.yaml}
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/inquiry/CustomerInquiryConsultationResult.yaml
            examples:
              completedConsultation:
                externalValue: ../examples/inquiries/customer-consultation-result-success.json
      "401": {$ref: ../components/responses/Unauthorized.yaml}
      "403": {$ref: ../components/responses/Forbidden.yaml}
      "404": {$ref: ../components/responses/NotFound.yaml}
      "409": {$ref: ../components/responses/Conflict.yaml}
      "422": {$ref: ../components/responses/UnprocessableEntity.yaml}
      "500": {$ref: ../components/responses/InternalServerError.yaml}
