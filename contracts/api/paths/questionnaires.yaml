# questionnaires API 경로 계약
# Endpoint와 request/response 참조는 백엔드 API 설계 확정 후 작성한다.
# T-021 고객 CARE_PRECHECK 사전 문진 Runtime 계약
x-t021-policy:
  inquiry_creation: SEPARATE_START_INQUIRY_ONLY
  questionnaire_version: CARE_PRECHECK-v1
  lifecycle: [UNANSWERED, IN_PROGRESS, SUBMITTED]
  owner_scope: CUSTOMER_SELF_ACTIVE_SUBSCRIPTION
  object_mask_policy: NOT_FOUND_404
  answer_update_policy: FULL_REPLACEMENT_WITH_STATE_VERSION
  inquiry_link_policy: SUBMITTED_UNLINKED_SAME_SUBSCRIPTION_ONCE

/me/questionnaire-sessions:
  post:
    operationId: startCarePrecheck
    summary: 고객 사전 문진 세션 시작
    description: |
      CUSTOMER 본인의 ACTIVE 구독에 Inquiry 없는 UNANSWERED CARE_PRECHECK
      세션을 생성한다. 같은 사용자·operation·Idempotency-Key와 같은 요청은
      기존 결과를 Replay하며 다른 요청은 409다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-requirements: [T-021, NFR-010, DR-006]
    x-workflow-event: START_CARE_PRECHECK
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/questionnaire/StartCarePrecheckRequest.yaml
          examples:
            start:
              externalValue: ../examples/questionnaires/start-request.json
    responses:
      "201":
        description: 신규 문진 세션 또는 멱등 Replay
        content:
          application/json:
            schema:
              $ref: ../components/schemas/questionnaire/CarePrecheckSessionResponse.yaml
            examples:
              started:
                externalValue: ../examples/questionnaires/start-response.json
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "409":
        $ref: ../components/responses/WorkflowConflict.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml
      "500":
        $ref: ../components/responses/InternalServerError.yaml

/me/questionnaire-sessions/{questionnaire_session_id}:
  parameters:
    - name: questionnaire_session_id
      in: path
      required: true
      description: QuestionnaireSession.public_id 공개 UUID
      schema: {type: string, format: uuid}
  get:
    operationId: getCarePrecheck
    summary: 고객 본인 사전 문진 세션 복구 조회
    description: |
      인증 고객이 소유한 세션의 현재 Snapshot을 반환한다. 타인·미존재
      세션은 동일 404로 숨기며 내부 PK와 생성 멱등 키는 공개하지 않는다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-requirements: [T-021]
    security:
      - BearerAuth: []
    responses:
      "200":
        description: 최신 문진 세션 Snapshot
        content:
          application/json:
            schema:
              $ref: ../components/schemas/questionnaire/CarePrecheckSessionResponse.yaml
            examples:
              inProgress:
                externalValue: ../examples/questionnaires/save-response.json
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml
      "500":
        $ref: ../components/responses/InternalServerError.yaml
  patch:
    operationId: saveCarePrecheck
    summary: 고객 사전 문진 답변 임시 저장
    description: |
      요청의 전체 answers Snapshot으로 기존 답변을 교체하고 IN_PROGRESS로
      전환한다. Row Lock과 state_version으로 동시 수정을 차단한다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-requirements: [T-021, NFR-010]
    x-questionnaire-action: SAVE_CARE_PRECHECK
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/questionnaire/MutateCarePrecheckRequest.yaml
          examples:
            save:
              externalValue: ../examples/questionnaires/save-request.json
    responses:
      "200":
        description: 임시 저장 결과 또는 멱등 Replay
        content:
          application/json:
            schema:
              $ref: ../components/schemas/questionnaire/CarePrecheckSessionResponse.yaml
            examples:
              saved:
                externalValue: ../examples/questionnaires/save-response.json
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "409":
        $ref: ../components/responses/WorkflowConflict.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml
      "500":
        $ref: ../components/responses/InternalServerError.yaml

/me/questionnaire-sessions/{questionnaire_session_id}/submit:
  parameters:
    - name: questionnaire_session_id
      in: path
      required: true
      description: QuestionnaireSession.public_id 공개 UUID
      schema: {type: string, format: uuid}
  post:
    operationId: submitCarePrecheck
    summary: 고객 사전 문진 제출
    description: |
      최신 answers Snapshot을 저장하고 SUBMITTED로 전환한다. 이후 증상 상담이
      필요하면 별도 START_INQUIRY 요청에 questionnaire_session_id를 포함한다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-requirements: [T-021, NFR-010]
    x-questionnaire-action: SUBMIT_CARE_PRECHECK
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/questionnaire/MutateCarePrecheckRequest.yaml
          examples:
            submit:
              externalValue: ../examples/questionnaires/submit-request.json
    responses:
      "200":
        description: 제출 완료 또는 멱등 Replay
        content:
          application/json:
            schema:
              $ref: ../components/schemas/questionnaire/CarePrecheckSessionResponse.yaml
            examples:
              submitted:
                externalValue: ../examples/questionnaires/submit-response.json
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "409":
        $ref: ../components/responses/WorkflowConflict.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml
      "500":
        $ref: ../components/responses/InternalServerError.yaml
