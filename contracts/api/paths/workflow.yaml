# T-023 최소 수직 흐름의 행동 기반 API 계약이다.
# PM State Machine 원본은 contracts/state-machine에서 읽기 전용으로 소비한다.
/inquiries/{id}/cancel:
  parameters:
    - name: id
      in: path
      required: true
      description: 취소할 문의의 공개 UUID
      schema:
        type: string
        format: uuid
  post:
    operationId: cancelInquiry
    summary: 고객 문의 취소
    description: |
      인증 고객이 본인 소유의 DRAFT 문의를 CANCEL_INQUIRY 이벤트로
      취소한다. 성공 시 DRAFT에서 CANCELLED로 전환하고 state_version을
      1 증가시킨다. 동일 Idempotency-Key와 동일 요청은 저장된 결과를
      재사용하며 상태 변경과 이력을 중복 생성하지 않는다.
    x-contract-status: CONFIRMED
    x-state-machine:
      event: CANCEL_INQUIRY
      transition_rule: TR-INQ-004
      from_state: DRAFT
      to_state: CANCELLED
      actor_role: CUSTOMER
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/workflow/CancelInquiryRequest.yaml
          examples:
            cancelInquiryRequest:
              externalValue: ../examples/workflow/cancel-inquiry-request.json
    responses:
      "200":
        description: 문의 취소 성공 또는 동일 요청의 멱등 재사용
        headers:
          X-Correlation-ID:
            $ref: ../components/headers/CorrelationId.yaml
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/workflow/CancelInquiryResult.yaml
            examples:
              cancelled:
                externalValue: ../examples/workflow/cancel-inquiry-success-response.json
              idempotentReplay:
                externalValue: ../examples/workflow/cancel-inquiry-replay-response.json
      "400":
        $ref: ../components/responses/BadRequest.yaml
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "409":
        $ref: ../components/responses/WorkflowConflict.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml

/inquiries/{id}/answers:
  parameters: &week5_inquiry_path_parameters
    - name: id
      in: path
      required: true
      description: 대상 문의의 공개 UUID
      schema:
        type: string
        format: uuid
  post:
    operationId: submitFollowUpAnswers
    summary: 고객 추가 질문 답변 제출
    description: |
      본인 문의의 열린 질문에 텍스트 또는 구조화 답변을 제출한다.
      질문 메타데이터와 실제 answer_payload의 물리 분리 Gate가 남아 있어
      현재 Operation은 계약만 확정하고 Runtime은 공개하지 않는다.
    x-contract-status: CONFIRMED
    x-runtime-status: NOT_IMPLEMENTED
    x-state-machine:
      event: SUBMIT_ANSWERS
      transition_rule: TR-INQ-003
      from_state: QUESTIONNAIRE_IN_PROGRESS
      to_state: QUESTIONNAIRE_IN_PROGRESS
      actor_role: CUSTOMER
    x-permission-scope: OWN_INQUIRY
    security: [{BearerAuth: []}]
    parameters: &week5_write_headers
      - $ref: ../components/parameters/IdempotencyKey.yaml
      - $ref: ../components/parameters/CorrelationId.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/questionnaire/SubmitFollowUpAnswersRequest.yaml
          examples:
            textAnswer:
              externalValue: ../examples/workflow/submit-followup-answers-request.json
            structuredAnswer:
              value:
                state_version: 2
                answers:
                  - question_id: 31b58743-d099-4e9b-99d8-73017c7fb129
                    answer_payload:
                      selected_option: FILTER_REPLACEMENT
    responses:
      "200":
        description: 추가 답변 상태 전환 결과 또는 동일 요청 Replay
        headers:
          X-Correlation-ID: {$ref: ../components/headers/CorrelationId.yaml}
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data: {$ref: ../components/schemas/workflow/StateTransitionResult.yaml}
            examples:
              accepted:
                externalValue: ../examples/workflow/submit-followup-answers-success-response.json
      "400": {$ref: ../components/responses/BadRequest.yaml}
      "401": {$ref: ../components/responses/Unauthorized.yaml}
      "403": {$ref: ../components/responses/Forbidden.yaml}
      "404": {$ref: ../components/responses/NotFound.yaml}
      "409": {$ref: ../components/responses/WorkflowConflict.yaml}
      "422": {$ref: ../components/responses/UnprocessableEntity.yaml}
      "500": {$ref: ../components/responses/InternalServerError.yaml}

