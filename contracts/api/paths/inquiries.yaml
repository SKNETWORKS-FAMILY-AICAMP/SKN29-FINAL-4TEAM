/inquiries/{id}/submit:
  parameters:
    - name: id
      in: path
      required: true
      description: 제출할 문의의 공개 UUID
      schema:
        type: string
        format: uuid
  post:
    operationId: submitSymptom
    summary: 저장된 고객 증상 제출 확정
    description: |
      인증 고객이 본인 소유 DRAFT 문의에 이미 저장된 원문과 대표 증상을
      SUBMIT_SYMPTOM 이벤트로 확정한다. 성공 시 상태는
      QUESTIONNAIRE_IN_PROGRESS로 전환되고 state_version은 1 증가한다.
      동일 Idempotency-Key와 동일 요청은 저장된 결과를 재사용하며 원문,
      상태와 이력을 중복 변경하지 않는다. 저장 Transaction은 AI 결과를
      기다리지 않으며 성공 Commit 이후 Django transaction.on_commit
      Callback으로 AI 분석을 후속 실행한다. 이 응답은 Commit 시점의 문의
      Snapshot이며 AI 결과나 추가 질문 생성 완료를 보장하지 않는다.
      멱등 Replay는 AI 분석을 추가 실행하지 않고, Target-only
      QuestionnaireSession도 생성하지 않는다. 제출 시점에도 문의에 연결된
      구독이 ACTIVE이고 제품 모델 연결이 유지돼야 하며, 이 Runtime
      사전조건이 깨지면 422로 거부한다.
    x-contract-status: CONFIRMED
    x-requirements:
      - FR-008
      - FR-009
      - DR-001
      - DR-006
    x-state-machine:
      event: SUBMIT_SYMPTOM
      operation_id: submitSymptom
      transition_rule: TR-INQ-002
      from_state: DRAFT
      to_state: QUESTIONNAIRE_IN_PROGRESS
      actor_role: CUSTOMER
      symptom_source: Inquiry.raw_text
      adhoc_questionnaire_projection: INQUIRY_STATE_AND_HISTORY
    x-runtime-preconditions:
      subscription_status: ACTIVE
      product_model_required: true
    x-ai-dispatch:
      boundary: AFTER_SUCCESSFUL_COMMIT
      mechanism: DJANGO_TRANSACTION_ON_COMMIT
      response_snapshot: COMMIT_TIME_ONLY
      response_includes_ai_result: false
      idempotency_replay_dispatches: false
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/questionnaire/SymptomSubmissionRequest.yaml
          examples:
            submitSymptomRequest:
              externalValue: ../examples/inquiries/submit-symptom-request.json
    responses:
      "200":
        description: 증상 제출 성공 또는 동일 요청의 멱등 재사용
        headers:
          X-Correlation-ID:
            $ref: ../components/headers/CorrelationId.yaml
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/inquiry/SubmitSymptomResult.yaml
            examples:
              submitted:
                externalValue: ../examples/inquiries/submit-symptom-success-response.json
              idempotentReplay:
                externalValue: ../examples/inquiries/submit-symptom-replay-response.json
      "400":
        $ref: ../components/responses/BadRequest.yaml
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "409":
        $ref: ../components/responses/WorkflowConflict.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml
