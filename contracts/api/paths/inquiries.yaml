# T-022 최지용 확정 API 기준선이다. Runtime 구현 상태와 별개로 관리한다.
/inquiries:
  post:
    operationId: startInquiry
    summary: 고객 문의 생성
    description: |
      본인의 활성 구독에 자연어 증상 원문을 연결해 신규 문의를 생성한다.
      문의 ID, 채널 코드와 대표 증상 코드는 확정된 요청 Schema에 따라
      검증하고 저장한다.
    x-contract-status: CONFIRMED
    x-requirements:
      - FR-008
      - FR-009
      - DR-001
      - DR-006
    x-state-machine:
      event: START_INQUIRY
      operation_id: startInquiry
      transition_rule: TR-INQ-001
      from_state: null
      to_state: DRAFT
      actor_role: CUSTOMER
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/inquiry/CreateInquiryRequest.yaml
          examples:
            startInquiryRequest:
              externalValue: ../examples/inquiries/start-inquiry-request.json
    responses:
      "201":
        description: 신규 문의 생성
        headers:
          X-Correlation-ID:
            $ref: ../components/headers/CorrelationId.yaml
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/inquiry/CreateInquiryResult.yaml
            examples:
              created:
                externalValue: ../examples/inquiries/start-inquiry-success-response.json
              idempotentReplay:
                externalValue: ../examples/inquiries/start-inquiry-replay-response.json
      "400":
        $ref: ../components/responses/BadRequest.yaml
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "409":
        $ref: ../components/responses/WorkflowConflict.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml

/inquiries/{id}/questionnaire:
  parameters:
    - name: id
      in: path
      required: true
      description: 기존 문의의 공개 식별값
      schema:
        type: string
        maxLength: 48
  patch:
    operationId: accumulateInquiryQuestionnaire
    summary: 문의 원문·문진 정보 누적
    description: |
      최초 원문을 덮어쓰지 않고 추가 원문과 문진 정보를 동일 문의에
      누적하며 기존 원문은 보존한다.
    x-contract-status: CONFIRMED
    x-requirements:
      - FR-009
      - FR-011
      - DR-006
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/inquiry/InquiryQuestionnaireRequest.yaml
    responses:
      "200":
        description: 동일 문의에 누적한 결과
        headers:
          X-Correlation-ID:
            $ref: ../components/headers/CorrelationId.yaml
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/inquiry/InquiryDetail.yaml
      "400":
        $ref: ../components/responses/BadRequest.yaml
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "409":
        $ref: ../components/responses/Conflict.yaml

/inquiries/{id}/action-results:
  parameters:
    - name: id
      in: path
      required: true
      description: 기존 문의의 공개 식별값
      schema:
        type: string
        maxLength: 48
  post:
    operationId: createInquiryActionResult
    summary: 고객 자가조치 결과 누적
    description: |
      자가조치 결과 원문을 동일 문의에 누적한다. 수행 여부는
      result_code를 단일 원천으로 사용한다.
    x-contract-status: CONFIRMED
    x-requirements:
      - FR-020
      - DR-006
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/inquiry/ActionResultRequest.yaml
    responses:
      "201":
        description: 동일 문의에 누적한 자가조치 결과
        headers:
          X-Correlation-ID:
            $ref: ../components/headers/CorrelationId.yaml
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/inquiry/ActionResult.yaml
      "400":
        $ref: ../components/responses/BadRequest.yaml
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "409":
        $ref: ../components/responses/Conflict.yaml

/inquiries/{id}/submit:
  parameters:
    - name: id
      in: path
      required: true
      description: 제출할 문의의 공개 UUID
      schema:
        type: string
        format: uuid
  post:
    operationId: submitSymptom
    summary: 저장된 고객 증상 제출 확정
    description: |
      인증 고객이 본인 소유 DRAFT 문의에 이미 저장된 원문과 대표 증상을
      SUBMIT_SYMPTOM 이벤트로 확정한다. 성공 시 상태는
      QUESTIONNAIRE_IN_PROGRESS로 전환되고 state_version은 1 증가한다.
      동일 Idempotency-Key와 동일 요청은 저장된 결과를 재사용하며 원문,
      상태와 이력을 중복 변경하지 않는다. 이 Slice는 AI 호출과 Target-only
      QuestionnaireSession 생성을 포함하지 않는다. 제출 시점에도 문의에
      연결된 구독이 ACTIVE이고 제품 모델 연결이 유지돼야 하며, 이
      Runtime 사전조건이 깨지면 422로 거부한다.
    x-contract-status: CONFIRMED
    x-requirements:
      - FR-008
      - FR-009
      - DR-001
      - DR-006
    x-state-machine:
      event: SUBMIT_SYMPTOM
      operation_id: submitSymptom
      transition_rule: TR-INQ-002
      from_state: DRAFT
      to_state: QUESTIONNAIRE_IN_PROGRESS
      actor_role: CUSTOMER
      symptom_source: Inquiry.raw_text
      adhoc_questionnaire_projection: INQUIRY_STATE_AND_HISTORY
    x-runtime-preconditions:
      subscription_status: ACTIVE
      product_model_required: true
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/questionnaire/SymptomSubmissionRequest.yaml
          examples:
            submitSymptomRequest:
              externalValue: ../examples/inquiries/submit-symptom-request.json
    responses:
      "200":
        description: 증상 제출 성공 또는 동일 요청의 멱등 재사용
        headers:
          X-Correlation-ID:
            $ref: ../components/headers/CorrelationId.yaml
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/inquiry/SubmitSymptomResult.yaml
            examples:
              submitted:
                externalValue: ../examples/inquiries/submit-symptom-success-response.json
              idempotentReplay:
                externalValue: ../examples/inquiries/submit-symptom-replay-response.json
      "400":
        $ref: ../components/responses/BadRequest.yaml
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "409":
        $ref: ../components/responses/WorkflowConflict.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml
