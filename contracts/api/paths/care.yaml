# T-019 고객 본인 케어 이력 최소 Runtime 계약
x-t019-policy:
  decision_status: PM_APPROVED_WITH_CONDITIONS
  customer_scope: OWNER_ACTIVE_SUPPORTED_SUBSCRIPTION
  history_status_scope: COMPLETED_ONLY
  self_care_allowlist: [FILTER_REPLACEMENT, CLEANING]
  date_policy: DATE_ONLY_NO_FUTURE_AND_NOT_BEFORE_SUBSCRIPTION
  object_mask_policy: NOT_FOUND_404
  idempotency_scope: ACTOR_OPERATION_KEY
  ai_projection: RECENT_COMPLETED_SAFE_FIELDS_MAX_5
  next_care_owner: T-020
  visit_result_dedupe_owner: T-044
  consumer_connection_allowed: false
  staff_scope: ASSIGNED_SAFE_PROJECTION_ONLY
  operator_scope: EXPLICIT_PERMISSION_ONLY

/me/subscriptions/{subscription_id}/care-records:
  parameters:
    - name: subscription_id
      in: path
      required: true
      description: CustomerSubscription.public_id 공개 UUID
      schema: {type: string, format: uuid}
  get:
    operationId: listMyCareRecords
    summary: 고객 본인 완료 케어 이력 목록 조회
    description: |
      CUSTOMER 본인의 ACTIVE WPUJAC104DWH 구독에 연결된 COMPLETED 이력만
      최신 관리일 순으로 조회한다. 내부 ID·자유 서술·개인정보는 공개하지 않는다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-requirements: [FR-016, DR-004]
    x-owner-scope: CUSTOMER_SELF_ACTIVE_SUPPORTED_SUBSCRIPTION
    x-unknown-query-policy: REJECT_422
    security:
      - BearerAuth: []
    parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema: {type: string, format: uuid}
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/Size.yaml
    responses:
      "200":
        description: 완료 이력 목록 또는 빈 목록
        content:
          application/json:
            schema:
              $ref: ../components/schemas/care/CareHistoryListResponse.yaml
            examples:
              completed:
                externalValue: ../examples/care/list-success.json
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml
      "500":
        $ref: ../components/responses/InternalServerError.yaml
  post:
    operationId: createMyCareRecord
    summary: 고객 본인 승인 셀프 케어 이력 등록
    description: |
      CUSTOMER 본인의 ACTIVE WPUJAC104DWH 구독에 승인된 셀프 케어 유형과
      관리일을 등록한다. 결과·수행 주체·출처는 서버가 정규화한다. 동일
      Idempotency-Key와 동일 요청은 저장 결과를 Replay하며 다른 요청은 409다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-requirements: [FR-016, NFR-010, DR-004]
    x-owner-scope: CUSTOMER_SELF_ACTIVE_SUPPORTED_SUBSCRIPTION
    security:
      - BearerAuth: []
    parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema: {type: string, format: uuid}
      - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/care/CareHistoryCreateRequest.yaml
    responses:
      "201":
        description: 케어 이력 등록 또는 멱등 Replay
        content:
          application/json:
            schema:
              $ref: ../components/schemas/care/CareHistoryMutationResponse.yaml
            examples:
              created:
                externalValue: ../examples/care/create-success.json
              replay:
                externalValue: ../examples/care/create-replay.json
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "409":
        description: 동일 Key의 다른 요청
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common/ApiResponse.yaml
            examples:
              conflict:
                externalValue: ../examples/care/idempotency-conflict.json
      "422":
        description: 미지원 유형·날짜·Payload 검증 오류
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common/ApiResponse.yaml
            examples:
              invalid:
                externalValue: ../examples/care/validation-error.json
      "500":
        $ref: ../components/responses/InternalServerError.yaml

/me/subscriptions/{subscription_id}/care-records/{care_record_id}:
  parameters:
    - name: subscription_id
      in: path
      required: true
      description: CustomerSubscription.public_id 공개 UUID
      schema: {type: string, format: uuid}
    - name: care_record_id
      in: path
      required: true
      description: CareRecord.public_id 공개 UUID
      schema: {type: string, format: uuid}
  get:
    operationId: getMyCareRecord
    summary: 고객 본인 완료 케어 이력 상세 조회
    description: |
      본인 ACTIVE 지원 구독의 COMPLETED 이력만 안전 필드로 조회한다.
      미존재·타인·비활성·미지원 구독과 비공개 상태는 동일 404로 숨긴다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-requirements: [FR-016, DR-004]
    x-owner-scope: CUSTOMER_SELF_ACTIVE_SUPPORTED_SUBSCRIPTION
    security:
      - BearerAuth: []
    parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema: {type: string, format: uuid}
    responses:
      "200":
        description: 완료 케어 이력 상세
        content:
          application/json:
            schema:
              $ref: ../components/schemas/care/CareHistoryDetailResponse.yaml
            examples:
              completed:
                externalValue: ../examples/care/detail-success.json
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml
      "500":
        $ref: ../components/responses/InternalServerError.yaml
