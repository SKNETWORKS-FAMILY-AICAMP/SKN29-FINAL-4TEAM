# T-018 R1 고객 본인 제품·구독 목록·상세 조회 계약
x-t018-r1-policy:
  decision_id: T018-D07
  decision_status: FINAL_APPROVED
  customer_scope: OWNER_ONLY
  product_model_code: WPUJAC104DWH
  product_model_active_required: true
  subscription_status_scope: ACTIVE_ONLY
  business_timezone: Asia/Seoul
  last_care_on:
    eligible_status: COMPLETED
    primary_date: performed_on
    fallback_date: completed_at_ASIA_SEOUL_DATE
    aggregate: MAX_PER_SUBSCRIPTION
    empty_result: null
  inquiry_eligibility_owner: T022_GUARD
  allowed_actions_owner: T023_STATE_MACHINE
  allowed_actions_in_t018: false
  hidden_fields:
    - internal_database_ids
    - contract_no
    - serial_no
    - installation_address
    - source_customer_product_public_id
    - product_features
    - customer_personal_information
  runtime_implementation_start_allowed: true
  migration_change_allowed: false
  database_change_allowed: false

x-t018-r2-write-policy:
  status: CONFIRMED_IMPLEMENTED
  customer_scope: SYNTHETIC_OWNER_ONLY
  product_catalog_creation_allowed: false
  supported_model_code: WPUJAC104DWH
  create_fields: [model_code, started_on, management_type_code, last_care_on]
  update_fields: [started_on, management_type_code, last_care_on]
  active_duplicate_policy: REJECT_409
  idempotency_scope: ACTOR_OPERATION_KEY
  database_migration_required: false

/me/subscriptions:
  get:
    operationId: listMySubscriptions
    summary: 고객 본인 ACTIVE 구독 목록 조회
    description: |
      인증된 CUSTOMER가 본인에게 연결된 WPUJAC104DWH 활성 제품 모델의
      ACTIVE 구독만 조회한다. 문의 가능 여부는 T-022 Guard가 검증하며
      allowed_actions는 T-023 State Machine 후속 계약에서 제공한다.
      정렬은 started_on DESC, public_id ASC이며 상태 변경을 수행하지 않는다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-requirements: [FR-002, DR-003]
    x-owner-filter: customer.user=request.user AND customer.deleted_at IS NULL
    x-product-filter: model_code=WPUJAC104DWH AND product_model.is_active=true
    x-subscription-filter: status_code=ACTIVE
    x-sort: [started_on DESC, public_id ASC]
    x-unknown-query-policy: REJECT_422
    security:
      - BearerAuth: []
    parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        description: 요청·응답·구조화 로그를 연결하는 선택적 UUID. 없으면 서버가 생성한다.
        schema:
          type: string
          format: uuid
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/Size.yaml
    responses:
      "200":
        description: 고객 본인 ACTIVE 구독 목록 또는 빈 목록
        headers:
          X-Correlation-ID:
            $ref: ../components/headers/CorrelationId.yaml
        content:
          application/json:
            schema:
              $ref: ../components/schemas/product/SubscriptionListResponse.yaml
            examples:
              activeSubscriptions:
                externalValue: ../examples/subscriptions/list-active-success.json
              emptySubscriptions:
                externalValue: ../examples/subscriptions/list-empty-success.json
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "422":
        description: 정의되지 않은 Query 또는 Pagination 검증 오류
        headers:
          X-Correlation-ID:
            $ref: ../components/headers/CorrelationId.yaml
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common/ApiResponse.yaml
            examples:
              activeOnly:
                externalValue: ../examples/subscriptions/query-validation-error.json
      "500":
        $ref: ../components/responses/InternalServerError.yaml
  post:
    operationId: createMySubscription
    summary: 합성 고객 본인 구독 제품 등록
    description: |
      인증된 합성 CUSTOMER가 기존 Catalog의 WPUJAC104DWH를 선택해 ACTIVE
      구독을 등록한다. Catalog Row, 계약번호와 Serial은 고객 입력으로 만들지
      않으며 서버가 합성 식별자를 생성한다. 동일 Key·동일 요청은 저장 결과를
      Replay하고 같은 Key의 다른 요청 또는 동일 활성 제품 중복은 409로 거부한다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-requirements: [FR-002, FR-003, DR-003]
    x-owner-scope: SYNTHETIC_CUSTOMER_SELF
    security:
      - BearerAuth: []
    parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema: {type: string, format: uuid}
      - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/product/SubscriptionCreateRequest.yaml
    responses:
      "201":
        description: 구독 등록 또는 멱등 Replay 성공
        content:
          application/json:
            schema:
              $ref: ../components/schemas/product/SubscriptionMutationResponse.yaml
            examples:
              created:
                externalValue: ../examples/subscriptions/create-success.json
              replay:
                externalValue: ../examples/subscriptions/create-replay.json
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "409":
        description: 활성 제품 중복 또는 Idempotency-Key 충돌
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common/ApiResponse.yaml
            examples:
              duplicateActive:
                externalValue: ../examples/subscriptions/duplicate-active-error.json
      "422":
        description: 미지원 제품 또는 입력 검증 오류
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common/ApiResponse.yaml
            examples:
              unsupportedProduct:
                externalValue: ../examples/subscriptions/unsupported-product-error.json
      "500":
        $ref: ../components/responses/InternalServerError.yaml

/me/subscriptions/{subscription_id}:
  parameters:
    - name: subscription_id
      in: path
      required: true
      description: CustomerSubscription.public_id 공개 UUID
      schema:
        type: string
        format: uuid
  get:
    operationId: getMySubscription
    summary: 고객 본인 ACTIVE 구독 상세 조회
    description: |
      인증된 CUSTOMER 본인의 WPUJAC104DWH 활성 제품 모델·ACTIVE 구독만
      조회한다. 잘못된 UUID, 미존재, 타 고객, 삭제 고객, 비활성 구독과
      비지원 모델은 존재를 숨기고 동일한 404를 반환한다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-requirements: [FR-002, DR-003]
    x-owner-filter: customer.user=request.user AND customer.deleted_at IS NULL
    x-product-filter: model_code=WPUJAC104DWH AND product_model.is_active=true
    x-subscription-filter: status_code=ACTIVE
    x-unknown-query-policy: REJECT_422
    security:
      - BearerAuth: []
    parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        description: 요청·응답·구조화 로그를 연결하는 선택적 UUID. 없으면 서버가 생성한다.
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: 고객 본인 ACTIVE 구독 상세
        headers:
          X-Correlation-ID:
            $ref: ../components/headers/CorrelationId.yaml
        content:
          application/json:
            schema:
              $ref: ../components/schemas/product/SubscriptionDetailResponse.yaml
            examples:
              activeSubscription:
                externalValue: ../examples/subscriptions/detail-active-success.json
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "422":
        description: 정의되지 않은 Query 검증 오류
        headers:
          X-Correlation-ID:
            $ref: ../components/headers/CorrelationId.yaml
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common/ApiResponse.yaml
            examples:
              activeOnly:
                externalValue: ../examples/subscriptions/query-validation-error.json
      "500":
        $ref: ../components/responses/InternalServerError.yaml
  patch:
    operationId: updateMySubscription
    summary: 고객 본인 ACTIVE 구독 허용 필드 수정
    description: |
      인증된 합성 CUSTOMER가 본인 ACTIVE WPUJAC104DWH 구독의 사용 시작일,
      관리 유형과 최근 필터 교체 기준일만 수정한다. 타인·비활성·미지원 제품은
      동일 404로 숨기고, 기존 완료 관리일 뒤로 사용 시작일을 늦추지 않는다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    x-requirements: [FR-002, FR-003, DR-003]
    x-owner-scope: SYNTHETIC_CUSTOMER_SELF_ACTIVE
    security:
      - BearerAuth: []
    parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema: {type: string, format: uuid}
      - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/product/SubscriptionUpdateRequest.yaml
    responses:
      "200":
        description: 수정 또는 멱등 Replay 성공
        content:
          application/json:
            schema:
              $ref: ../components/schemas/product/SubscriptionMutationResponse.yaml
            examples:
              updated:
                externalValue: ../examples/subscriptions/update-success.json
      "401":
        $ref: ../components/responses/Unauthorized.yaml
      "403":
        $ref: ../components/responses/Forbidden.yaml
      "404":
        $ref: ../components/responses/NotFound.yaml
      "409":
        $ref: ../components/responses/Conflict.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml
      "500":
        $ref: ../components/responses/InternalServerError.yaml
