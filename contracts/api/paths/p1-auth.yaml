# P1-A 합성 계약고객 회원가입·계정연결 계약
x-p1a-policy:
  scope: SYNTHETIC_CONTRACT_CUSTOMER_ONLY
  password_login_scope: SYNTHETIC_CUSTOMER_AND_CONSULTANT
  contract_status: CONFIRMED
  otp_ttl_seconds: 300
  otp_resend_after_seconds: 60
  otp_max_failures: 5
  account_enumeration: CONCEALED
  kakao_login: OUT_OF_SCOPE_P1_B_HOLD

/auth/contract-verification/challenges:
  post:
    operationId: createContractVerificationChallenge
    summary: 합성 계약고객 계약 이메일 OTP Challenge 접수
    description: |
      계약 후보가 존재하는 경우와 존재하지 않는 경우 모두 동일한 HTTP 202,
      응답 Schema와 일반 안내 문구를 반환한다. 이메일 힌트는 공개하지 않는다.
    x-contract-status: CONFIRMED
    x-runtime-status: NOT_IMPLEMENTED
    security: []
    parameters:
      - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth/P1ChallengeRequest.yaml
    responses:
      "202":
        description: 계약 후보 존재 여부와 무관한 동일 Challenge 접수 응답
        headers:
          X-Correlation-ID:
            $ref: ../components/headers/CorrelationId.yaml
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/auth/P1ChallengeAccepted.yaml
      "400":
        $ref: ../components/responses/BadRequest.yaml
      "409":
        $ref: ../components/responses/Conflict.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml
      "429":
        $ref: ../components/responses/TooManyRequests.yaml

/auth/contract-verification/challenges/{challenge_id}/verify:
  parameters:
    - &challenge-id
      name: challenge_id
      in: path
      required: true
      description: 외부에 발급한 OTP Challenge UUID
      schema: {type: string, format: uuid}
  post:
    operationId: verifyContractVerificationChallenge
    summary: 회원가입용 계약 이메일 OTP 확인
    x-contract-status: CONFIRMED
    x-runtime-status: NOT_IMPLEMENTED
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth/P1OtpVerificationRequest.yaml
    responses:
      "200":
        description: 단기·단회성 claim_ticket 발급
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/auth/P1ClaimTicket.yaml
      "401":
        $ref: ../components/responses/P1VerificationFailed.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml
      "429":
        $ref: ../components/responses/TooManyRequests.yaml

/auth/signup:
  post:
    operationId: signupContractCustomer
    summary: 검증된 합성 계약고객 WaterBridge 계정 생성
    description: |
      claim_ticket 소비, User·CustomerAccountLink·필수 동의·감사 이벤트 저장을
      하나의 Transaction으로 처리하고 Commit 후 기존 LoginResponse를 반환한다.
    x-contract-status: CONFIRMED
    x-runtime-status: NOT_IMPLEMENTED
    security: []
    parameters:
      - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth/P1SignupRequest.yaml
    responses:
      "201":
        description: 계정 연결 완료와 JWT Session 발급
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/auth/LoginResponse.yaml
      "401":
        $ref: ../components/responses/P1VerificationFailed.yaml
      "409":
        $ref: ../components/responses/Conflict.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml
      "429":
        $ref: ../components/responses/TooManyRequests.yaml

/auth/login:
  post:
    operationId: loginWithPassword
    summary: WaterBridge ID/PW 일반 로그인
    description: |
      합성 계약고객과 활성 합성 상담사의 ID/PW 로그인을 제공한다.
      사용자명·계정·역할 존재 여부를 구분하지 않는 공통 401을 사용한다.
    x-contract-status: CONFIRMED
    x-runtime-status: IMPLEMENTED
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth/P1PasswordLoginRequest.yaml
    responses:
      "200":
        description: 기존 Mobile 호환 JWT Session
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common/ApiResponse.yaml
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/auth/LoginResponse.yaml
      "401":
        $ref: ../components/responses/P1LoginFailed.yaml
      "422":
        $ref: ../components/responses/UnprocessableEntity.yaml
      "429":
        $ref: ../components/responses/TooManyRequests.yaml

/auth/account-recovery/username/challenges:
  post:
    operationId: createUsernameRecoveryChallenge
    summary: 아이디 찾기 OTP Challenge 접수
    description: 계약·계정 존재 여부와 무관하게 동일 HTTP 202를 반환한다.
