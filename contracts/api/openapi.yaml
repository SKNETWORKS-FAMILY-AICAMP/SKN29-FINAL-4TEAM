openapi: 3.1.0
info:
  title: Water Care Support API
  version: 0.9.0
  description: 정수기 구독 고객 케어 및 A/S 업무 지원 시스템 API 계약
servers:
  - url: /api/v1
paths:
  /auth/demo-login:
    $ref: ./paths/auth.yaml#/~1auth~1demo-login
  /auth/refresh:
    $ref: ./paths/auth.yaml#/~1auth~1refresh
  /auth/logout:
    $ref: ./paths/auth.yaml#/~1auth~1logout
  /auth/contract-verification/challenges:
    $ref: ./paths/p1-auth.yaml#/~1auth~1contract-verification~1challenges
  /auth/contract-verification/challenges/{challenge_id}/verify:
    $ref: ./paths/p1-auth.yaml#/~1auth~1contract-verification~1challenges~1{challenge_id}~1verify
  /auth/signup:
    $ref: ./paths/p1-auth.yaml#/~1auth~1signup
  /auth/login:
    $ref: ./paths/p1-auth.yaml#/~1auth~1login
  /auth/account-recovery/username/challenges:
    $ref: ./paths/p1-auth.yaml#/~1auth~1account-recovery~1username~1challenges
  /auth/account-recovery/username/challenges/{challenge_id}/verify:
    $ref: ./paths/p1-auth.yaml#/~1auth~1account-recovery~1username~1challenges~1{challenge_id}~1verify
  /auth/password-reset/challenges:
    $ref: ./paths/p1-auth.yaml#/~1auth~1password-reset~1challenges
  /auth/password-reset/challenges/{challenge_id}/verify:
    $ref: ./paths/p1-auth.yaml#/~1auth~1password-reset~1challenges~1{challenge_id}~1verify
  /auth/password-reset/confirm:
    $ref: ./paths/p1-auth.yaml#/~1auth~1password-reset~1confirm
  /me:
    $ref: ./paths/auth.yaml#/~1me
  /me/subscriptions:
    $ref: ./paths/products.yaml#/~1me~1subscriptions
  /me/subscriptions/{subscription_id}:
    $ref: ./paths/products.yaml#/~1me~1subscriptions~1{subscription_id}
  /me/subscriptions/{subscription_id}/care-records:
    $ref: ./paths/care.yaml#/~1me~1subscriptions~1{subscription_id}~1care-records
  /me/subscriptions/{subscription_id}/care-records/{care_record_id}:
    $ref: ./paths/care.yaml#/~1me~1subscriptions~1{subscription_id}~1care-records~1{care_record_id}
  /me/questionnaire-sessions:
    $ref: ./paths/questionnaires.yaml#/~1me~1questionnaire-sessions
  /me/questionnaire-sessions/{questionnaire_session_id}:
    $ref: ./paths/questionnaires.yaml#/~1me~1questionnaire-sessions~1{questionnaire_session_id}
  /me/questionnaire-sessions/{questionnaire_session_id}/submit:
    $ref: ./paths/questionnaires.yaml#/~1me~1questionnaire-sessions~1{questionnaire_session_id}~1submit
  /me/inquiries/active:
    $ref: ./paths/customer-inquiries.yaml#/~1me~1inquiries~1active
  /me/inquiries/{inquiry_id}:
    $ref: ./paths/customer-inquiries.yaml#/~1me~1inquiries~1{inquiry_id}
  /me/inquiries/{inquiry_id}/questions:
    $ref: ./paths/customer-inquiries.yaml#/~1me~1inquiries~1{inquiry_id}~1questions
  /me/inquiries/{inquiry_id}/guidance:
    $ref: ./paths/customer-inquiries.yaml#/~1me~1inquiries~1{inquiry_id}~1guidance
  /consultant/customer-subscriptions/search:
    $ref: ./paths/consultant-phone-inquiries.yaml#/~1consultant~1customer-subscriptions~1search
  /consultant/phone-inquiries:
    $ref: ./paths/consultant-phone-inquiries.yaml#/~1consultant~1phone-inquiries
  /consultant/dashboard:
    $ref: ./paths/operations.yaml#/~1consultant~1dashboard
  /inquiries:
    $ref: ./paths/inquiries.yaml#/~1inquiries
  /inquiries/unassigned-consultations:
    $ref: ./paths/inquiries.yaml#/~1inquiries~1unassigned-consultations
  /inquiries/{id}:
    $ref: ./paths/inquiries.yaml#/~1inquiries~1{id}
  /inquiries/{id}/questionnaire:
    $ref: ./paths/inquiries.yaml#/~1inquiries~1{id}~1questionnaire
  /inquiries/{id}/answers:
    $ref: ./paths/workflow.yaml#/~1inquiries~1{id}~1answers
  /inquiries/{id}/request-consultation:
    $ref: ./paths/workflow.yaml#/~1inquiries~1{id}~1request-consultation
  /inquiries/{id}/resolution-feedback:
    $ref: ./paths/workflow.yaml#/~1inquiries~1{id}~1resolution-feedback
  /inquiries/{id}/finalize:
    $ref: ./paths/workflow.yaml#/~1inquiries~1{id}~1finalize
  /inquiries/{id}/report-unresolved:
    $ref: ./paths/workflow.yaml#/~1inquiries~1{id}~1report-unresolved
  /inquiries/{id}/resume-consultation:
    $ref: ./paths/workflow.yaml#/~1inquiries~1{id}~1resume-consultation
  /inquiries/{id}/action-results:
    $ref: ./paths/inquiries.yaml#/~1inquiries~1{id}~1action-results
  /inquiries/{id}/submit:
    $ref: ./paths/inquiries.yaml#/~1inquiries~1{id}~1submit
  /inquiries/{id}/cancel:
    $ref: ./paths/workflow.yaml#/~1inquiries~1{id}~1cancel
  /inquiries/{id}/start-consultation:
    $ref: ./paths/consultations.yaml#/~1inquiries~1{id}~1start-consultation
  /inquiries/{id}/claim-consultation:
    $ref: ./paths/consultations.yaml#/~1inquiries~1{id}~1claim-consultation
  /inquiries/{id}/consultation-summary:
    $ref: ./paths/consultations.yaml#/~1inquiries~1{id}~1consultation-summary
  /inquiries/{id}/consultation-summary/confirm:
    $ref: ./paths/consultations.yaml#/~1inquiries~1{id}~1consultation-summary~1confirm
  /inquiries/{id}/complete-consultation:
    $ref: ./paths/consultations.yaml#/~1inquiries~1{id}~1complete-consultation
  /inquiries/{id}/visit-review:
    $ref: ./paths/visits.yaml#/~1inquiries~1{id}~1visit-review
  /inquiries/{id}/visits:
    $ref: ./paths/visits.yaml#/~1inquiries~1{id}~1visits
  /inquiries/{id}/visit-not-needed:
    $ref: ./paths/visits.yaml#/~1inquiries~1{id}~1visit-not-needed
  /visits/{visit_id}/schedule:
    $ref: ./paths/visits.yaml#/~1visits~1{visit_id}~1schedule
  /visits/{visit_id}/confirm:
    $ref: ./paths/visits.yaml#/~1visits~1{visit_id}~1confirm
  /visits/{visit_id}/start:
    $ref: ./paths/visits.yaml#/~1visits~1{visit_id}~1start
  /visits/{visit_id}/complete:
    $ref: ./paths/visits.yaml#/~1visits~1{visit_id}~1complete
  /health:
    get:
      operationId: getProvisionalHealth
      summary: 임시 서비스 liveness 확인
      description: |
        현재 구현된 provisional GET /health의 실행 사실만 기록한다.
        200 응답은 본문이 없고 X-Correlation-ID 응답 Header를 제공한다.
        HealthDTO, 공통 Wrapper, 인증·dependency 공개 범위와 최종 성공
        status는 아직 OPEN이다.
      x-contract-status: IN_PROGRESS
      servers:
        - url: /
          description: /api/v1 외부의 provisional health 경로
      responses:
        "200":
          description: 현재 구현 기준의 provisional liveness 응답(본문 없음)
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
components:
  schemas:
    ApiResponse:
      $ref: ./components/schemas/common/ApiResponse.yaml
    ApiError:
      $ref: ./components/schemas/common/ApiError.yaml
    PageInfo:
      $ref: ./components/schemas/common/PageInfo.yaml
    TraceContext:
      $ref: ./components/schemas/common/TraceContext.yaml
  parameters:
    Idempotency-Key:
      $ref: ./components/parameters/IdempotencyKey.yaml
    X-Correlation-ID:
      $ref: ./components/parameters/CorrelationId.yaml
  headers:
    X-Correlation-ID:
      $ref: ./components/headers/CorrelationId.yaml
  responses:
    WorkflowConflict:
      $ref: ./components/responses/WorkflowConflict.yaml
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
