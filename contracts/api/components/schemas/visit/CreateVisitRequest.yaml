title: CreateVisitRequest
type: object
description: 방문 검토 완료 후 미배정 ASSIGNING Visit을 생성하는 요청
x-contract-status: CONFIRMED
additionalProperties: false
required:
  - state_version
  - visit_reason
  - usage_guidance_status
  - handoff
properties:
  state_version:
    type: integer
    minimum: 1
  visit_reason:
    type: string
    minLength: 1
    maxLength: 1000
  preferred_date:
    type: [string, "null"]
    format: date
  usage_guidance_status:
    type: string
    enum: [NORMAL, PARTIAL_STOP, TOTAL_STOP, PENDING_CONSULTATION]
  handoff:
    $ref: ./VisitHandoff.yaml
