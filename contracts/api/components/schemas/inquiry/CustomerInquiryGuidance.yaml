title: CustomerInquiryGuidance
type: object
description: 고객 본인에게 제공하는 최신 검증 완료 AI Guidance Projection
x-contract-status: CONFIRMED
additionalProperties: false
required:
  - inquiry_id
  - inquiry_code
  - status_code
  - state_version
  - symptom_summary
  - risk_level
  - usage_guidance_status
  - usage_guidance_message
  - restricted_functions
  - safe_actions
  - escalation_conditions
  - prohibited_actions
  - next_action
  - requires_consultation
  - evidence
  - allowed_actions
properties:
  inquiry_id:
    type: string
    format: uuid
  inquiry_code:
    type: string
    minLength: 1
    maxLength: 50
  status_code:
    type: string
    enum:
      - AI_GUIDANCE
      - CONSULTATION_REQUIRED
      - CONSULTATION_IN_PROGRESS
      - VISIT_REVIEW_PENDING
      - VISIT_SCHEDULING
      - VISIT_SCHEDULED
      - COMPLETION_PENDING
      - REVISIT_REQUIRED
      - RESOLVED
  state_version:
    type: integer
    minimum: 1
  symptom_summary:
    type: string
    minLength: 1
    maxLength: 2000
  risk_level:
    type: string
    enum: [general, caution, danger]
  usage_guidance_status:
    type: string
    enum: [NORMAL, PARTIAL_STOP, TOTAL_STOP, PENDING_CONSULTATION]
  usage_guidance_message:
    type: string
    minLength: 1
    maxLength: 3000
  restricted_functions:
    $ref: '#/$defs/guidanceTextList'
  safe_actions:
    type: array
    minItems: 1
    maxItems: 20
    items:
      type: string
      minLength: 1
      maxLength: 1000
  escalation_conditions:
    $ref: '#/$defs/guidanceTextList'
  prohibited_actions:
    $ref: '#/$defs/guidanceTextList'
  next_action:
    type: string
    minLength: 1
    maxLength: 1000
  requires_consultation:
    type: boolean
  evidence:
    type: array
    maxItems: 0
    description: Public Evidence Runtime은 P0 범위 밖이므로 내부 근거를 노출하지 않는다.
    items:
      type: object
  allowed_actions:
    type: array
    items:
      $ref: ../workflow/AllowedAction.yaml
$defs:
  guidanceTextList:
    type: array
    maxItems: 20
    items:
      type: string
      minLength: 1
      maxLength: 1000
