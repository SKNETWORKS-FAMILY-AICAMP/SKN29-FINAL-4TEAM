title: UnassignedConsultationQueueItem
type: object
description: Claim 전에 상담사에게 허용하는 미배정 합성 문의 최소 Projection
x-contract-status: CONFIRMED
additionalProperties: false
required:
  - inquiry_id
  - inquiry_code
  - status
  - state_version
  - risk_level
  - priority
  - symptom_summary
  - customer_display_name_masked
  - product_model
  - current_assignee_type
  - received_at
  - updated_at
  - waiting_seconds
  - allowed_actions
properties:
  inquiry_id:
    type: string
    format: uuid
  inquiry_code:
    type: string
    maxLength: 48
  status:
    type: string
    const: CONSULTATION_REQUIRED
  state_version:
    type: integer
    minimum: 1
  risk_level:
    type: string
    enum: [general, caution, danger]
  priority:
    type: string
    enum: [LOW, NORMAL, HIGH, URGENT]
  symptom_summary:
    type: string
    maxLength: 1000
  customer_display_name_masked:
    type: string
    maxLength: 80
  product_model:
    type: string
    maxLength: 120
  current_assignee_type:
    type: string
    const: NONE
  received_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  waiting_seconds:
    type: integer
    minimum: 0
  allowed_actions:
    type: array
    items:
      $ref: ../workflow/AllowedAction.yaml
