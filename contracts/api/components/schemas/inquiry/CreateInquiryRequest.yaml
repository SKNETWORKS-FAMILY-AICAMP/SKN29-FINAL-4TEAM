title: CreateInquiryRequest
type: object
description: |
  CUSTOMER가 본인 ACTIVE 구독의 공개 UUID로 DRAFT 문의를 생성한다.
  생성 요청에는 state_version을 보내지 않으며 서버가 1로 초기화한다.
x-contract-status: CONFIRMED
additionalProperties: false
required:
  - subscription_id
  - channel_code
  - raw_text
properties:
  subscription_id:
    type: string
    format: uuid
    description: 인증 고객 본인의 ACTIVE 구독 공개 UUID
  channel_code:
    type: string
    enum:
      - WEB
      - MOBILE
      - PHONE
      - OPERATOR
    description: 문의 접수 채널
  raw_text:
    type: string
    minLength: 1
    maxLength: 5000
    description: trim 후 비어 있지 않은 최초 고객 원문
  representative_symptom_code:
    type:
      - string
      - "null"
    minLength: 1
    maxLength: 40
    description: 선택한 대표 증상 코드
  questionnaire_session_id:
    type:
      - string
      - "null"
    format: uuid
    description: 연결할 사전 문진 세션 공개 UUID
