title: CreateInquiryRequest
type: object
description: |
  T-022 문의 생성 확정 기준선. 고객 원문과 선택한 대표 증상 코드를
  본인의 활성 구독에 연결한다.
x-contract-status: CONFIRMED
additionalProperties: false
required:
  - subscription_id
  - channel_code
  - raw_text
properties:
  subscription_id:
    type: string
    minLength: 1
    maxLength: 48
    description: 인증 고객 본인의 활성 구독 식별값
  channel_code:
    type: string
    minLength: 1
    description: 허용된 문의 접수 채널 코드
  raw_text:
    type: string
    minLength: 1
    description: trim 후 비어 있지 않아야 하며 최초 원문으로 보존
  representative_symptom_code:
    type:
      - string
      - "null"
    minLength: 1
    description: 선택한 대표 증상 코드
  questionnaire_session_id:
    type:
      - string
      - "null"
    maxLength: 48
    description: 제출된 동일 구독 사전 문진 식별값
