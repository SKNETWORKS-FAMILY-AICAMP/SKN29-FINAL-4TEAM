title: ActionResult
type: object
description: 고객 자가조치 결과 T-022 확정 DTO
x-contract-status: CONFIRMED
additionalProperties: false
required:
  - id
  - inquiry_id
  - guidance_item_id
  - attempt_no
  - result_code
  - result_text
  - performed_at
  - customer_comment
  - submitted_by
  - state_version
  - idempotent_replay
  - created_at
properties:
  id:
    type: string
    format: uuid
  inquiry_id:
    type: string
    format: uuid
  guidance_item_id:
    type: string
    format: uuid
  attempt_no:
    type: integer
  result_code:
    type: string
  result_text:
    type:
      - string
      - "null"
  performed_at:
    type:
      - string
      - "null"
    format: date-time
  customer_comment:
    type:
      - string
      - "null"
  submitted_by:
    type: string
    format: uuid
  state_version:
    type: integer
    minimum: 1
  idempotent_replay:
    type: boolean
  created_at:
    type: string
    format: date-time
