title: CustomerInquirySnapshot
type: object
description: 고객 본인 문의의 앱 복구용 최소 읽기 Projection
x-contract-status: CONFIRMED
additionalProperties: false
required:
  - inquiry_id
  - status_code
  - state_version
  - subscription_id
  - product
  - allowed_actions
  - updated_at
properties:
  inquiry_id:
    type: string
    format: uuid
  status_code:
    type: string
    enum:
      - DRAFT
      - QUESTIONNAIRE_IN_PROGRESS
      - AI_GUIDANCE
      - CONSULTATION_REQUIRED
      - CONSULTATION_IN_PROGRESS
      - VISIT_REVIEW_PENDING
      - VISIT_SCHEDULING
      - VISIT_SCHEDULED
      - COMPLETION_PENDING
      - REVISIT_REQUIRED
      - REOPENED
      - RESOLVED
      - CANCELLED
  state_version:
    type: integer
    minimum: 1
  subscription_id:
    type: string
    format: uuid
  product:
    type: object
    additionalProperties: false
    required: [model_code]
    properties:
      model_code:
        type: string
        maxLength: 60
  allowed_actions:
    type: array
    description: 최신 문의·질문 Snapshot에 대해 Backend 동적 Resolver가 계산한 현재 호출 가능 Action
    items:
      $ref: ../workflow/AllowedAction.yaml
  updated_at:
    type: string
    format: date-time
  system_notice:
    description: 고객 상세 조회 시 현재 상태 진입 원인이 AI 처리 시간 초과이면 Backend가 제공하는 고정 안내문이며 그 외에는 null
    oneOf:
      - type: string
        maxLength: 200
        enum:
          - AI 안내 생성이 지연되어 상담으로 연결합니다.
      - type: "null"
