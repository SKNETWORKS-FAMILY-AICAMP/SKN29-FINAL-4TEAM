title: SubscriptionCreateRequest
type: object
description: T-018 합성 고객의 지원 제품 구독 등록 입력
x-contract-status: CONFIRMED
additionalProperties: false
required:
  - model_code
  - started_on
  - management_type_code
properties:
  model_code:
    type: string
    enum:
      - WPUJAC104DWH
      - WPUIAC425SNW
      - WPUIAC606SNW
    description: >-
      계약상 인식하는 정확 판매코드. 실제 등록 가능 여부는 Backend의
      ProductModel 활성·지원 상태를 함께 검증한다.
  started_on:
    type: string
    format: date
  management_type_code:
    type: string
    enum: [SELF_MANAGED, VISIT_CARE]
  last_care_on:
    type: [string, "null"]
    format: date
    description: 선택적인 최근 필터 교체 기준일. 사용 시작일 이후·오늘 이하만 허용한다.
