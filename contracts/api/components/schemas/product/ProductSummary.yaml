title: ProductSummary
type: object
description: T-018 R1 고객 본인 구독에 포함되는 제품 최소 Projection
x-contract-status: CONFIRMED
additionalProperties: false
required:
  - product_model_id
  - model_code
  - model_name
  - generation_code
  - manufacturer
properties:
  product_model_id:
    type: string
    format: uuid
    description: ProductModel.public_id 공개 UUID
  model_code:
    type: string
    enum:
      - WPUJAC104DWH
      - WPUIAC425SNW
      - WPUIAC606SNW
    description: 계약에서 허용하며 Backend 활성·지원 상태를 통과한 정확 판매코드
  model_name:
    type: string
    minLength: 1
    maxLength: 150
  generation_code:
    type: [string, "null"]
    maxLength: 40
  manufacturer:
    type: string
    minLength: 1
    maxLength: 100
