title: FollowUpAnswerRequest
type: object
description: 공개 질문 UUID에 대한 텍스트 또는 단일 선택 답변
x-contract-status: CONFIRMED
additionalProperties: false
required:
  - question_id
properties:
  question_id:
    type: string
    format: uuid
    description: Backend가 발급한 InquiryQA 공개 UUID
  answer_text:
    type: string
    minLength: 1
    maxLength: 1000
    pattern: ".*\\S.*"
    description: FREE_TEXT 질문 답변. answer_payload와 함께 보낼 수 없다.
  answer_payload:
    type: object
    additionalProperties: false
    required:
      - selected_option
    properties:
      selected_option:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ".*\\S.*"
    description: SINGLE_CHOICE 질문에 Backend가 공개한 선택지 값
oneOf:
  - title: TextFollowUpAnswer
    required:
      - answer_text
    not:
      required:
        - answer_payload
  - title: StructuredFollowUpAnswer
    required:
      - answer_payload
    not:
      required:
        - answer_text
