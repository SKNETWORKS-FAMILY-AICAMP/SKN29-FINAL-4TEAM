title: P1PasswordLoginRequest
type: object
description: WaterBridge ID/PW 일반 로그인 요청
additionalProperties: false
required:
  - username
  - password
properties:
  username:
    type: string
    minLength: 1
    maxLength: 150
  password:
    type: string
    minLength: 1
    maxLength: 64
    writeOnly: true
