title: P1PasswordResetConfirmRequest
type: object
description: 단회성 reset_ticket을 사용한 비밀번호 재설정 요청
additionalProperties: false
required:
  - reset_ticket
  - password
properties:
  reset_ticket:
    type: string
    minLength: 32
    writeOnly: true
  password:
    type: string
    minLength: 12
    maxLength: 64
    pattern: '^(?=.*[A-Za-z])(?=.*[0-9]).{12,64}$'
    writeOnly: true
