title: P1PasswordResetTicket
type: object
description: 비밀번호 재설정 OTP 성공 후 발급하는 단기·단회성 Ticket
additionalProperties: false
required:
  - reset_ticket
  - expires_in
properties:
  reset_ticket:
    type: string
    minLength: 32
    x-sensitive: true
    description: 응답으로 한 번 전달하며 로그·영속 저장을 금지한다.
  expires_in:
    type: integer
    minimum: 1
    maximum: 900
