contract:
  name: action-operation-crosswalk
  version: 1.0.0
  status: PM_BASELINE_CANDIDATE
  owner: PM_TECHNICAL_INTEGRATION
  updated_at: 2026-08-23
  sources:
    action_registry: ../codes/workflow-actions.yaml
    allowed_actions: ../state-machine/allowed-actions.yaml
    inquiry_events: ../state-machine/inquiry-events.yaml
    openapi: ./openapi.yaml
  allowed_classifications:
    - RUNTIME_IMPLEMENTED
    - OPENAPI_CONFIRMED
    - CONTRACT_ONLY
    - DEFERRED

classification_policy:
  RUNTIME_IMPLEMENTED: 정확히 일치하는 OpenAPI Operation과 Backend Runtime 및 Test 증거가 모두 존재한다.
  OPENAPI_CONFIRMED: 정확히 일치하는 OpenAPI Operation은 존재하지만 Runtime은 NOT_IMPLEMENTED이다.
  CONTRACT_ONLY: 4주차 우선 Action이지만 정확히 일치하는 OpenAPI Operation 또는 Runtime이 없다.
  DEFERRED: 승인된 State Machine Action이지만 4주차 Runtime 범위 밖이며 후속 구현 대상으로 유지한다.
  rules:
    - Action Code와 operation_id는 allowed-actions.yaml 값을 단일 원천으로 사용한다.
    - 유사한 범용 Operation이 있어도 operation_id와 State Machine Event가 정확히 일치하지 않으면 연결하지 않는다.
    - Web·Mobile Mock만 존재하는 경우 Runtime 구현으로 판정하지 않는다.
    - RUNTIME_IMPLEMENTED는 Backend Source와 Test 경로를 모두 증거로 기록한다.

summary:
  total_actions: 24
  RUNTIME_IMPLEMENTED: 18
  OPENAPI_CONFIRMED: 2
  CONTRACT_ONLY: 0
  DEFERRED: 4

