  - dec: DEC-003
    method: POST
    path: /inquiries/{id}/complete-consultation
    operation_id: completeConsultation
    request_schema: CompleteConsultationRequest
    response_schema: StateTransitionResult
    event: CONSULTATION_COMPLETED
    transition_rule: TR-INQ-017
    permission_scope: ASSIGNED_INQUIRIES
    runtime_status: NOT_IMPLEMENTED
  - dec: DEC-004
    method: POST
    path: /inquiries/{id}/visit-review
    operation_id: requestVisitReview
    request_schema: VisitReviewRequest
    response_schema: StateTransitionResult
    event: VISIT_REVIEW_REQUIRED
