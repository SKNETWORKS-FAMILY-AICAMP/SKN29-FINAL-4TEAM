    dec009_boundary: USER_TRIGGERED_SAVE_ONLY
  - dec: DEC-003
    method: POST
    path: /inquiries/{id}/consultation-summary/confirm
    operation_id: confirmConsultationSummary
    request_schema: StateTransitionRequest
