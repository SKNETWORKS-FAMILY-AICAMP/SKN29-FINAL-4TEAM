    permission_scope: ASSIGNED_INQUIRIES
    runtime_status: NOT_IMPLEMENTED
  - dec: DEC-004
    method: POST
    path: /inquiries/{id}/visits
    operation_id: createVisitRequest
    request_schema: CreateVisitRequest
    response_schema: StateTransitionResult
