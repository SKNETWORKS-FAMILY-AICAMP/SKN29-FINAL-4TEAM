contract:
  name: g2-operation-crosswalk
  version: 1.0.0
  status: G2_ACTIVE_CANDIDATE
  owner: BACKEND_DB
  policy_baseline: 윤승혁 PM 2026-08-04 14:43 KST 회신
  included_decisions: [DEC-001, DEC-002, DEC-003, DEC-004, DEC-005, DEC-007, DEC-009]
  excluded_decisions: [DEC-006, DEC-008]
  runtime_implementation_start_allowed: false
  consumer_integration_start_allowed: false

operations:
  - dec: DEC-002
    method: GET
    path: /inquiries
    operation_id: listConsultantInquiries
    request_schema: null
    response_schema: ConsultantInquiryListData
    event: null
    transition_rule: null
    permission_scope: ASSIGNED_INQUIRIES
    runtime_status: IMPLEMENTED
  - dec: DEC-002
    method: GET
    path: /inquiries/{id}
    operation_id: getConsultantInquiryDetail
    request_schema: null
    response_schema: ConsultantInquiryDetail
    event: null
    transition_rule: null
    permission_scope: ASSIGNED_INQUIRIES
    runtime_status: IMPLEMENTED
  - dec: DEC-003
    method: POST
    path: /inquiries/{id}/start-consultation
    operation_id: startConsultation
    request_schema: StateTransitionRequest
    response_schema: StateTransitionResult
    event: START_CONSULTATION
    transition_rule: TR-INQ-014
    permission_scope: ASSIGNED_INQUIRIES
    runtime_status: NOT_IMPLEMENTED
  - dec: DEC-003
    method: PATCH
    path: /inquiries/{id}/consultation-summary
    operation_id: updateConsultationSummary
    request_schema: SaveConsultationRequest
    response_schema: StateTransitionResult
    event: UPDATE_CONSULTATION_SUMMARY
    transition_rule: TR-INQ-015
    permission_scope: ASSIGNED_INQUIRIES
