cross_cutting:
  DEC-001: P0 순서는 목록, 상세, 상담, 방문이며 각 Operation은 독립 Gate를 유지한다.
  DEC-005: 쓰기 Operation은 state_version, Idempotency-Key, X-Correlation-ID와 409 계약을 사용한다.
  DEC-007: 역할과 현재 배정을 모두 검증하고 is_synthetic=true인 최소 Projection만 반환한다.
  DEC-009: 명시적 상담 저장만 API에 포함하며 서버 Draft·자동저장은 포함하지 않는다.
