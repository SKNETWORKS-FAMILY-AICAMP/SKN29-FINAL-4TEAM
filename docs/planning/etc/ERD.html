<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaterCare 현재 업무 ERD v1.5</title>
  <style>
:root {
  --navy: #17354b;
  --ink: #183247;
  --muted: #667b8e;
  --line: #d7e1e9;
  --paper: #ffffff;
  --surface: #eef3f7;
  --teal: #1b8b82;
  --teal-dark: #126f69;
  --shadow: 0 10px 30px rgba(27, 52, 73, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--surface);
}

body {
  margin: 0;
  color: var(--ink);
  background: var(--surface);
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

.app-header {
  display: grid;
  grid-template-columns: 60px minmax(360px, 1fr) auto;
  gap: 20px;
  align-items: center;
  min-height: 132px;
  padding: 24px 34px;
  color: #fff;
  background: linear-gradient(110deg, #163c54 0%, #14645f 58%, #168178 100%);
}

.brand-mark {
  display: grid;
  width: 58px;
  height: 58px;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.46);
  border-radius: 17px;
  background: rgba(255, 255, 255, 0.11);
  font-size: 20px;
  font-weight: 800;
}

.header-copy .eyebrow {
  margin: 0 0 6px;
  color: #8fe1d8;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
}

.header-copy h1 {
  margin: 0;
  font-size: clamp(26px, 3vw, 38px);
  line-height: 1.18;
  letter-spacing: -0.035em;
}

.header-copy > p:last-child {
  margin: 10px 0 0;
  color: #d8e8eb;
  font-size: 14px;
}

.header-metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(88px, 1fr));
  gap: 10px;
}

.header-metrics div {
  min-width: 96px;
  padding: 14px 16px;
  border: 1px solid rgba(255, 255, 255, 0.27);
  border-radius: 12px;
  background: rgba(13, 52, 69, 0.34);
}

.header-metrics strong,
.header-metrics span {
  display: block;
}

.header-metrics strong {
  font-size: 24px;
  line-height: 1;
}

.header-metrics span {
  margin-top: 7px;
  color: #cfe2e6;
  font-size: 11px;
}

.control-bar {
  position: relative;
  z-index: 40;
  display: grid;
  grid-template-columns: minmax(270px, 390px) 1fr auto;
  gap: 16px;
  align-items: end;
  padding: 16px 34px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.96);
  box-shadow: 0 5px 18px rgba(26, 54, 76, 0.04);
}

.search-wrap {
  position: relative;
}

.search-wrap label {
  display: block;
  margin: 0 0 7px 2px;
  color: #526b7e;
  font-size: 12px;
  font-weight: 800;
}

.search-wrap input {
  width: 100%;
  height: 42px;
  padding: 0 14px;
  border: 1px solid #cbd8e2;
  border-radius: 10px;
  outline: none;
  color: var(--ink);
  background: #fff;
}

.search-wrap input:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(27, 139, 130, 0.12);
}

.search-results {
  position: absolute;
  top: calc(100% + 7px);
  right: 0;
  left: 0;
  overflow: hidden;
  border: 1px solid #cbd8e2;
  border-radius: 12px;
  background: #fff;
  box-shadow: var(--shadow);
}

.search-results button {
  display: grid;
  width: 100%;
  grid-template-columns: 1fr auto;
  gap: 8px;
  padding: 11px 13px;
  border: 0;
  border-bottom: 1px solid #edf1f4;
  text-align: left;
  background: #fff;
  cursor: pointer;
}

.search-results button:last-child {
  border-bottom: 0;
}

.search-results button:hover,
.search-results button:focus-visible {
  background: #eff8f7;
  outline: none;
}

.search-results strong,
.search-results code,
.search-results small {
  display: block;
}

.search-results code {
  margin-top: 3px;
  color: #6a7e90;
  font-size: 11px;
}

.search-results small {
  align-self: center;
  color: #728597;
  font-size: 11px;
}

.layer-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.layer-filter button,
.relation-toggle,
.zoom-controls button,
.drawer-close {
  border: 1px solid #ced9e2;
  border-radius: 9px;
  background: #fff;
  cursor: pointer;
}

.layer-filter button {
  min-height: 42px;
  padding: 0 13px;
  color: #536b7e;
  font-size: 12px;
  font-weight: 800;
}

.layer-filter button:hover,
.layer-filter button.is-active {
  border-color: #72b9b2;
  color: var(--teal-dark);
  background: #edf8f6;
}

.relation-toggle {
  height: 42px;
  padding: 0 16px;
  color: #fff;
  border-color: var(--teal-dark);
  background: var(--teal-dark);
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.relation-toggle[aria-pressed="true"] {
  color: var(--teal-dark);
  background: #eaf7f5;
}

main {
  padding: 22px 28px 32px;
}

.diagram-panel {
  overflow: hidden;
  border: 1px solid #cfdae3;
  border-radius: 16px;
  background: #fff;
  box-shadow: var(--shadow);
}

.diagram-head {
  display: grid;
  grid-template-columns: minmax(255px, 1fr) auto auto;
  gap: 22px;
  align-items: center;
  padding: 15px 20px;
  border-bottom: 1px solid var(--line);
}

.diagram-head h2 {
  margin: 0;
  font-size: 18px;
}

.diagram-head p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 12px;
  color: #5f7487;
  font-size: 11px;
}

.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.legend .line {
  display: inline-block;
  width: 25px;
  border-top: 2px solid #54738c;
}

.legend .line.optional {
  border-top: 1px dashed #748da1;
}

.legend .line.support {
  border-top: 1px dotted #9caab6;
}

.zoom-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.zoom-controls button {
  min-width: 34px;
  height: 34px;
  padding: 0 10px;
  color: #4d6579;
  font-weight: 800;
}

.zoom-controls button:hover {
  border-color: #83bdb8;
  color: var(--teal-dark);
  background: #f0f8f7;
}

.zoom-controls span {
  min-width: 45px;
  color: #526a7d;
  font-size: 11px;
  text-align: center;
}

.diagram-viewport {
  position: relative;
  overflow: hidden;
  min-height: 720px;
  height: calc(100vh - 330px);
  background:
    linear-gradient(rgba(115, 137, 155, 0.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(115, 137, 155, 0.055) 1px, transparent 1px),
    #eef3f7;
  background-size: 24px 24px;
}

.diagram-svg {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.diagram-svg.is-panning {
  cursor: grabbing;
}

.diagram-status {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 18px;
  border-top: 1px solid var(--line);
  color: #667b8e;
  background: #fbfcfd;
  font-size: 11px;
}

.drawer-backdrop {
  position: fixed;
  z-index: 90;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: rgba(17, 42, 60, 0.28);
  transition: opacity 0.2s ease;
}

.drawer {
  position: fixed;
  z-index: 100;
  top: 0;
  right: 0;
  bottom: 0;
  overflow: auto;
  width: min(760px, 92vw);
  border-left: 1px solid #cbd7e0;
  background: #fff;
  box-shadow: -16px 0 38px rgba(20, 46, 65, 0.16);
  transform: translateX(102%);
  transition: transform 0.22s ease;
}

body.drawer-open {
  overflow: hidden;
}

body.drawer-open .drawer {
  transform: translateX(0);
}

body.drawer-open .drawer-backdrop {
  pointer-events: auto;
  opacity: 1;
}

.drawer-head {
  position: sticky;
  z-index: 2;
  top: 0;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 18px;
  padding: 22px 24px 18px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.97);
  backdrop-filter: blur(10px);
}

.drawer-head .layer-label {
  margin: 0 0 7px;
  color: var(--teal-dark);
  font-size: 12px;
  font-weight: 800;
}

.drawer-head h2 {
  margin: 0;
  font-size: 26px;
}

.drawer-head code {
  display: block;
  margin-top: 7px;
  color: #62778a;
  font-size: 12px;
}

.drawer-close {
  width: 38px;
  height: 38px;
  font-size: 20px;
}

.drawer-body {
  padding: 20px 24px 42px;
}

.table-description {
  margin: 0;
  color: #385166;
  font-size: 14px;
  line-height: 1.7;
}

.detail-metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
  margin: 18px 0 26px;
}

.detail-metrics div {
  padding: 13px;
  border: 1px solid #d7e1e8;
  border-radius: 11px;
  background: #f7f9fb;
}

.detail-metrics strong,
.detail-metrics span {
  display: block;
}

.detail-metrics strong {
  font-size: 19px;
}

.detail-metrics span {
  margin-top: 5px;
  color: #6c8092;
  font-size: 10px;
}

.detail-section {
  margin-top: 27px;
}

.detail-section h3 {
  margin: 0 0 11px;
  font-size: 16px;
}

.meta-grid {
  display: grid;
  grid-template-columns: 130px 1fr;
  border-top: 1px solid #dce4ea;
  font-size: 12px;
}

.meta-grid dt,
.meta-grid dd {
  margin: 0;
  padding: 9px 10px;
  border-bottom: 1px solid #e7edf1;
}

.meta-grid dt {
  color: #6d8192;
  background: #f7f9fb;
  font-weight: 800;
}

.meta-grid dd {
  overflow-wrap: anywhere;
}

.relation-list {
  display: grid;
  gap: 7px;
}

.relation-item {
  padding: 10px 12px;
  border: 1px solid #d8e1e8;
  border-radius: 9px;
  background: #fafcfd;
}

.relation-item strong,
.relation-item code,
.relation-item span {
  display: block;
}

.relation-item strong {
  font-size: 12px;
}

.relation-item code {
  margin-top: 5px;
  color: #38566d;
  font-size: 11px;
  overflow-wrap: anywhere;
}

.relation-item span {
  margin-top: 5px;
  color: #748798;
  font-size: 10px;
}

.empty-state {
  padding: 13px;
  border: 1px dashed #cfd9e1;
  border-radius: 9px;
  color: #748798;
  background: #fafbfc;
  font-size: 11px;
}

.column-table-wrap {
  overflow-x: auto;
  border: 1px solid #d8e1e8;
  border-radius: 10px;
}

.column-table {
  width: 100%;
  min-width: 680px;
  border-collapse: collapse;
  font-size: 11px;
}

.column-table th,
.column-table td {
  padding: 9px 10px;
  border-bottom: 1px solid #e6ecf0;
  vertical-align: top;
  text-align: left;
}

.column-table th {
  color: #50697c;
  background: #f4f7f9;
  font-weight: 800;
}

.column-table tr:last-child td {
  border-bottom: 0;
}

.column-table code {
  color: #284b63;
  font-size: 10px;
}

.constraint-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.constraint-list span {
  padding: 2px 5px;
  border-radius: 5px;
  color: #486175;
  background: #eaf0f4;
  font-size: 9px;
  font-weight: 800;
}

@media (max-width: 1180px) {
  .app-header {
    grid-template-columns: 56px 1fr;
  }

  .header-metrics {
    grid-column: 1 / -1;
  }

  .control-bar {
    grid-template-columns: minmax(260px, 1fr) auto;
  }

  .layer-filter {
    grid-column: 1 / -1;
    grid-row: 2;
  }

  .diagram-head {
    grid-template-columns: 1fr auto;
  }

  .legend {
    grid-column: 1 / -1;
    grid-row: 2;
    justify-content: flex-start;
  }
}

@media (max-width: 720px) {
  .app-header {
    grid-template-columns: 48px 1fr;
    gap: 13px;
    padding: 18px;
  }

  .brand-mark {
    width: 48px;
    height: 48px;
    border-radius: 13px;
    font-size: 16px;
  }

  .header-copy h1 {
    font-size: 24px;
  }

  .header-metrics {
    grid-template-columns: repeat(2, 1fr);
  }

  .control-bar {
    grid-template-columns: 1fr;
    padding: 14px 18px;
  }

  .layer-filter,
  .relation-toggle {
    grid-column: 1;
  }

  main {
    padding: 14px;
  }

  .diagram-head {
    grid-template-columns: 1fr;
  }

  .legend,
  .zoom-controls {
    grid-column: 1;
  }

  .diagram-viewport {
    min-height: 600px;
    height: 72vh;
  }

  .diagram-status {
    display: grid;
  }

  .detail-metrics {
    grid-template-columns: repeat(2, 1fr);
  }

  .drawer {
    width: 100vw;
  }
}

  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand-mark">WC</div>
    <div class="header-copy">
      <p class="eyebrow">WATERCARE DATA ARCHITECTURE</p>
      <h1>WaterCare 현재 업무 ERD</h1>
      <p>현재 사용 테이블 13개 · 4개 업무 계층 · 물리 FK 30개</p>
    </div>
    <div class="header-metrics" aria-label="ERD 주요 수치">
      <div><strong>13</strong><span>테이블</span></div>
      <div><strong>200</strong><span>표시 컬럼</span></div>
      <div><strong>30</strong><span>물리 FK</span></div>
      <div><strong>4</strong><span>업무 계층</span></div>
    </div>
  </header>

  <section class="control-bar" aria-label="ERD 조회 조건">
    <div class="search-wrap">
      <label for="table-search">테이블·컬럼 검색</label>
      <input id="table-search" type="search" autocomplete="off" placeholder="한글명, 테이블명 또는 컬럼명">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <div class="layer-filter" id="layer-filter" aria-label="업무 계층 선택">
      <button type="button" class="is-active" data-layer="all">전체</button>
      <button type="button" data-layer="1">L1 기준정보</button>
      <button type="button" data-layer="2">L2 고객·구독</button>
      <button type="button" data-layer="3">L3 문의·상태</button>
      <button type="button" data-layer="4">L4 상담·방문</button>
    </div>
    <button type="button" id="relation-toggle" class="relation-toggle" aria-pressed="false">전체 FK 30개 표시</button>
  </section>

  <main>
    <section class="diagram-panel" aria-labelledby="diagram-title">
      <div class="diagram-head">
        <div>
          <h2 id="diagram-title">테이블 참조 관계</h2>
          <p>부모 키에서 FK 보유 테이블 방향으로 표시한다.</p>
        </div>
        <div class="legend" aria-label="관계선 범례">
          <span><i class="line required"></i>필수 FK</span>
          <span><i class="line optional"></i>선택 업무 FK</span>
          <span><i class="line support"></i>담당자·처리이력 FK</span>
          <span>×N 복수 FK 집계</span>
        </div>
        <div class="zoom-controls">
          <button type="button" id="zoom-out" aria-label="축소">−</button>
          <span id="zoom-label">100%</span>
          <button type="button" id="zoom-in" aria-label="확대">＋</button>
          <button type="button" id="zoom-fit">전체 맞춤</button>
        </div>
      </div>
      <div class="diagram-viewport" id="diagram-viewport"><svg id="erd-svg" class="diagram-svg" xmlns="http://www.w3.org/2000/svg" width="3600" height="1970" viewBox="0 0 3600 1970" role="img" aria-label="WaterCare 현재 업무 ERD 13개 테이블">

    <rect width="3600" height="1970" fill="#eef3f7"></rect>
    <g aria-label="ERD 표시 기준">
      <rect class="artifact-header" x="24" y="12" width="3552" height="46" rx="14"></rect>

  <script>
"use strict";

(function () {
  const schema = window.WATERCARE_ERD;
  if (!schema) throw new Error("ERD schema data is not available.");

  const svg = document.getElementById("erd-svg");
  const viewport = document.getElementById("diagram-viewport");
  const relationToggle = document.getElementById("relation-toggle");
  const relationStatus = document.getElementById("relation-status");
  const layerFilter = document.getElementById("layer-filter");
  const searchInput = document.getElementById("table-search");
  const searchResults = document.getElementById("search-results");
  const drawer = document.getElementById("table-drawer");
  const drawerContent = document.getElementById("drawer-content");
  const drawerBackdrop = document.getElementById("drawer-backdrop");
  const zoomLabel = document.getElementById("zoom-label");

  const state = {
    showAllRelations: false,
    selectedLayer: null,
    selectedTable: null,
    viewBox: {
      x: 0,
      y: 0,
      width: schema.display.canvas.width,
      height: schema.display.canvas.height,
    },
    initialViewBox: {
      x: 0,
      y: 0,
      width: schema.display.canvas.width,
      height: schema.display.canvas.height,
    },
    panning: null,
  };

  const tableEntries = Object.entries(schema.tables);
  const tableNames = new Set(tableEntries.map(([name]) => name));
  const continuitySet = new Set(schema.display.coreContinuityColumns);
  const coreEdges = schema.physicalEdges.filter(
    (edge) => edge.required || continuitySet.has(edge.childTable + "." + edge.childColumn),
  );

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function groupPathCount(edges) {
    return new Set(
      edges.map((edge) => {
        const type = edge.required
          ? "required"
          : continuitySet.has(edge.childTable + "." + edge.childColumn)
            ? "optional"
            : "support";
        return edge.parentTable + "|" + edge.childTable + "|" + type;
      }),
    ).size;
  }

  function layerForTable(name) {
    return schema.layers.find((layer) => layer.tables.includes(name));
  }

  function setRelationMode(showAll) {
    state.showAllRelations = showAll;
    const coreGroup = svg.querySelector(".relations-core");
    const fullGroup = svg.querySelector(".relations-full");
    coreGroup.style.display = showAll ? "none" : "block";
    fullGroup.style.display = showAll ? "block" : "none";
    relationToggle.setAttribute("aria-pressed", showAll ? "true" : "false");
    relationToggle.textContent = showAll ? "기본 관계 16개만 표시" : "전체 FK 30개 표시";
    const edges = showAll ? schema.physicalEdges : coreEdges;
    relationStatus.textContent =
      "표시 관계 " + edges.length + "개 · 집계 경로 " + groupPathCount(edges) + "개";
    applyHighlight();
  }

  function setLayer(layerNumber) {
    state.selectedLayer = layerNumber === "all" ? null : Number(layerNumber);
    state.selectedTable = null;
    closeDrawer(false);
    layerFilter.querySelectorAll("button").forEach((button) => {
      const isActive = state.selectedLayer == null ? button.dataset.layer === "all" : Number(button.dataset.layer) === state.selectedLayer;
      button.classList.toggle("is-active", isActive);
    });
    applyHighlight();
  }

  function applyHighlight() {
    const relatedTables = new Set();
    if (state.selectedTable) {
      relatedTables.add(state.selectedTable);
      schema.physicalEdges.forEach((edge) => {
        if (edge.parentTable === state.selectedTable) relatedTables.add(edge.childTable);
        if (edge.childTable === state.selectedTable) relatedTables.add(edge.parentTable);
      });
    }

    svg.querySelectorAll(".table-node").forEach((node) => {
      const name = node.dataset.table;
      const selected = name === state.selectedTable;
      let dimmed = false;
      if (state.selectedTable) dimmed = !relatedTables.has(name);
      else if (state.selectedLayer) dimmed = Number(node.dataset.layer) !== state.selectedLayer;
      node.classList.toggle("is-selected", selected);
      node.classList.toggle("is-dimmed", dimmed);
    });

    svg.querySelectorAll(".relation-wrap").forEach((wrap) => {
      const parent = wrap.dataset.parent;
      const child = wrap.dataset.child;
      let highlighted = false;
      let dimmed = false;
      if (state.selectedTable) {
        highlighted = parent === state.selectedTable || child === state.selectedTable;
        dimmed = !highlighted;
      } else if (state.selectedLayer) {
        const parentLayer = schema.tables[parent].layerNumber;
        const childLayer = schema.tables[child].layerNumber;
        highlighted = parentLayer === state.selectedLayer && childLayer === state.selectedLayer;
        dimmed = !highlighted;
      }
      wrap.classList.toggle("is-highlighted", highlighted);
      wrap.classList.toggle("is-dimmed", dimmed);
    });
  }

  function relationshipHtml(edge, direction) {
    const child = schema.tables[edge.childTable];
    const parent = schema.tables[edge.parentTable];
    const title = direction === "out" ? parent.nameKo : child.nameKo;
    const relation =
      edge.childTable + "." + edge.childColumn + " → " + edge.parentTable + "." + edge.parentColumn;
    const cardinality = edge.unique ? (edge.required ? "1:1" : "0..1:1") : edge.required ? "N:1" : "N:0..1";
    return (
      '<div class="relation-item"><strong>' +
      escapeHtml(title) +
      "</strong><code>" +
      escapeHtml(relation) +
      "</code><span>" +
      (edge.required ? "필수 FK" : "선택 FK") +
      " · " +
      cardinality +
      "</span></div>"
    );
  }

  function constraintHtml(column, tableName) {
    const labels = [];
    if (column.pk) labels.push("PK");
    if (column.nn) labels.push("NOT NULL");
    const internalFk = schema.physicalEdges.some(
      (edge) => edge.childTable === tableName && edge.childColumn === column.name,
    );
    if (internalFk) labels.push("FK");
    if (column.referenceKind === "logical_code") labels.push("CODE");
    return labels.length
      ? '<div class="constraint-list">' + labels.map((label) => "<span>" + label + "</span>").join("") + "</div>"
      : "—";
  }

  function visibleReference(column) {
    if (!column.reference) return "";
    if (column.referenceKind === "logical_code") return column.reference;
    const target = String(column.reference).split(".")[0];
    return tableNames.has(target) ? column.reference : "";
  }

  function openTable(name) {
    const table = schema.tables[name];
    if (!table) return;
    state.selectedTable = name;
    const layer = layerForTable(name);
    const outgoing = schema.physicalEdges.filter((edge) => edge.childTable === name);
    const incoming = schema.physicalEdges.filter((edge) => edge.parentTable === name);
    const logicalCodes = table.columns.filter((column) => column.referenceKind === "logical_code");
    const primaryKeys = table.columns.filter((column) => column.pk).map((column) => column.name).join(" · ") || "—";

    const columnRows = table.columns
      .map((column) => {
        const reference = visibleReference(column);
        const defaultAndReference = [column.default, reference].filter(Boolean).join(" / ") || "—";
        return (
          "<tr><td><strong>" +
          escapeHtml(column.labelKo || column.name) +
          "</strong><br><code>" +
          escapeHtml(column.name) +
          "</code></td><td><code>" +
          escapeHtml(column.type) +
          "</code><br>" +
          constraintHtml(column, name) +
          "</td><td>" +
          escapeHtml(defaultAndReference) +
          "</td><td>" +
          escapeHtml(column.note || "—") +
          "</td></tr>"
        );
      })
      .join("");

    drawerContent.innerHTML =
      '<div class="drawer-head"><div><p class="layer-label">L' +
      layer.number +
      " · " +
      escapeHtml(layer.title) +
      "</p><h2>" +
      escapeHtml(table.nameKo) +
      "</h2><code>" +
      escapeHtml(name) +
      '</code></div><button type="button" class="drawer-close" id="drawer-close" aria-label="상세정보 닫기">×</button></div>' +
      '<div class="drawer-body"><p class="table-description">' +
      escapeHtml(table.description) +
      '</p><div class="detail-metrics"><div><strong>' +
      table.rowCount +
      "</strong><span>데이터 건수</span></div><div><strong>" +
      table.columns.length +
      "</strong><span>컬럼</span></div><div><strong>" +
      outgoing.length +
      "</strong><span>참조 FK</span></div><div><strong>" +
      incoming.length +
      "</strong><span>피참조 FK</span></div></div>" +
      '<section class="detail-section"><h3>테이블 개요</h3><dl class="meta-grid"><dt>기본키</dt><dd><code>' +
      escapeHtml(primaryKeys) +
      "</code></dd><dt>업무 모듈</dt><dd>" +
      escapeHtml(table.djangoApp || "—") +
      "</dd><dt>업무 계층</dt><dd>" +
      escapeHtml("L" + layer.number + " " + layer.title) +
      "</dd></dl></section>" +
      '<section class="detail-section"><h3>참조 관계</h3><div class="relation-list">' +
      (outgoing.length ? outgoing.map((edge) => relationshipHtml(edge, "out")).join("") : '<div class="empty-state">참조하는 테이블이 없습니다.</div>') +
      "</div></section>" +
      '<section class="detail-section"><h3>피참조 관계</h3><div class="relation-list">' +
      (incoming.length ? incoming.map((edge) => relationshipHtml(edge, "in")).join("") : '<div class="empty-state">이 테이블을 참조하는 테이블이 없습니다.</div>') +
      "</div></section>" +
      '<section class="detail-section"><h3>공통코드 연결</h3><div class="relation-list">' +
      (logicalCodes.length
        ? logicalCodes
            .map(
              (column) =>
                '<div class="relation-item"><strong>' +
                escapeHtml(column.labelKo || column.name) +
                "</strong><code>" +
                escapeHtml(column.name + " → " + column.reference) +
                "</code></div>",
            )
            .join("")
        : '<div class="empty-state">공통코드 연결이 없습니다.</div>') +
      "</div></section>" +
      '<section class="detail-section"><h3>컬럼 명세</h3><div class="column-table-wrap"><table class="column-table"><thead><tr><th>컬럼명</th><th>데이터 타입·제약</th><th>기본값·참조 대상</th><th>업무 설명</th></tr></thead><tbody>' +
      columnRows +
      "</tbody></table></div></section></div>";

    document.body.classList.add("drawer-open");
    drawer.setAttribute("aria-hidden", "false");
    document.getElementById("drawer-close").addEventListener("click", () => closeDrawer());
    applyHighlight();
  }

  function closeDrawer(clearSelection = true) {
    document.body.classList.remove("drawer-open");
    drawer.setAttribute("aria-hidden", "true");
    if (clearSelection) state.selectedTable = null;
    applyHighlight();
  }

  function searchMatches(query) {
    const normalized = query.trim().toLowerCase();
    if (!normalized) return [];
    const matches = [];
    for (const [name, table] of tableEntries) {
      const tableText = [name, table.nameKo, table.description, table.djangoApp].join(" ").toLowerCase();
      if (tableText.includes(normalized)) {
        matches.push({ table: name, kind: "테이블", detail: table.nameKo });
      }
      for (const column of table.columns) {
        const columnText = [column.name, column.labelKo, column.note].join(" ").toLowerCase();
        if (columnText.includes(normalized)) {
          matches.push({ table: name, kind: "컬럼", detail: column.name + " · " + (column.labelKo || "") });
        }
      }
    }
    const unique = [];
    const keys = new Set();
    for (const match of matches) {
      const key = match.table + "|" + match.kind + "|" + match.detail;
      if (!keys.has(key)) {
        keys.add(key);
        unique.push(match);
      }
      if (unique.length === 9) break;
    }
    return unique;
  }

  function renderSearchResults() {
    const matches = searchMatches(searchInput.value);
    if (!matches.length) {
      searchResults.hidden = true;
      searchResults.innerHTML = "";
      return;
    }
    searchResults.innerHTML = matches
      .map((match, index) => {
        const table = schema.tables[match.table];
        return (
          '<button type="button" data-result-index="' +
          index +
          '"><span><strong>' +
          escapeHtml(table.nameKo) +
          "</strong><code>" +
          escapeHtml(match.table) +
          "</code></span><small>" +
          escapeHtml(match.kind + " · " + match.detail) +
          "</small></button>"
        );
      })
      .join("");
    searchResults.hidden = false;
    searchResults.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => {
        const match = matches[Number(button.dataset.resultIndex)];
        searchResults.hidden = true;
        openTable(match.table);
      });
    });
  }

  function updateViewBox() {
    const box = state.viewBox;
    svg.setAttribute("viewBox", box.x + " " + box.y + " " + box.width + " " + box.height);
    const percent = Math.round((state.initialViewBox.width / box.width) * 100);
    zoomLabel.textContent = percent + "%";
  }

  function zoom(factor) {
    const current = state.viewBox;
    const newWidth = Math.max(1500, Math.min(state.initialViewBox.width, current.width * factor));
    const newHeight = newWidth * (state.initialViewBox.height / state.initialViewBox.width);
    const centerX = current.x + current.width / 2;
    const centerY = current.y + current.height / 2;
    state.viewBox = {
      x: centerX - newWidth / 2,
      y: centerY - newHeight / 2,
      width: newWidth,
      height: newHeight,
    };
    clampViewBox();
    updateViewBox();
  }

  function clampViewBox() {
    const max = state.initialViewBox;
    state.viewBox.x = Math.max(0, Math.min(max.width - state.viewBox.width, state.viewBox.x));
    state.viewBox.y = Math.max(0, Math.min(max.height - state.viewBox.height, state.viewBox.y));
  }

  relationToggle.addEventListener("click", () => setRelationMode(!state.showAllRelations));
  layerFilter.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-layer]");
    if (button) setLayer(button.dataset.layer);
  });

  svg.querySelectorAll(".table-node").forEach((node) => {
    node.addEventListener("click", () => openTable(node.dataset.table));
    node.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openTable(node.dataset.table);
      }
    });
  });

  searchInput.addEventListener("input", renderSearchResults);
  searchInput.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      searchInput.value = "";
      searchResults.hidden = true;
    }
  });

  drawerBackdrop.addEventListener("click", () => closeDrawer());
  document.getElementById("zoom-in").addEventListener("click", () => zoom(0.84));
  document.getElementById("zoom-out").addEventListener("click", () => zoom(1.18));
  document.getElementById("zoom-fit").addEventListener("click", () => {
    state.viewBox = { ...state.initialViewBox };
    updateViewBox();
  });

  svg.addEventListener("pointerdown", (event) => {
    if (event.target.closest(".table-node")) return;
    state.panning = {
      pointerId: event.pointerId,
      startX: event.clientX,
      startY: event.clientY,
      boxX: state.viewBox.x,
      boxY: state.viewBox.y,
    };
    svg.setPointerCapture(event.pointerId);
    svg.classList.add("is-panning");
  });

  svg.addEventListener("pointermove", (event) => {
    if (!state.panning || state.panning.pointerId !== event.pointerId) return;
    const rect = viewport.getBoundingClientRect();
    const scaleX = state.viewBox.width / rect.width;
    const scaleY = state.viewBox.height / rect.height;
    state.viewBox.x = state.panning.boxX - (event.clientX - state.panning.startX) * scaleX;
    state.viewBox.y = state.panning.boxY - (event.clientY - state.panning.startY) * scaleY;
    clampViewBox();
    updateViewBox();
  });

  function stopPanning(event) {
    if (!state.panning || state.panning.pointerId !== event.pointerId) return;
    state.panning = null;
    svg.classList.remove("is-panning");
  }

  svg.addEventListener("pointerup", stopPanning);
  svg.addEventListener("pointercancel", stopPanning);

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      if (document.body.classList.contains("drawer-open")) closeDrawer();
      else if (state.selectedLayer) setLayer("all");
    }
    if (event.key === "/" && document.activeElement !== searchInput) {
      event.preventDefault();
      searchInput.focus();
    }
  });

  document.addEventListener("click", (event) => {
    if (!event.target.closest(".search-wrap")) searchResults.hidden = true;
  });

  setRelationMode(false);
  updateViewBox();
})();
