version: 1.0.0
fields:
  data_classification:
    type: string
    allowed: [official, team_designed, synthetic]
    description: 데이터의 출처 분류
  risk_level:
    type: string
    allowed: [general, caution, danger]
    description: 안전 위험도 canonical 코드
  use_guidance:
    type: string
    allowed: [NORMAL, PARTIAL_STOP, TOTAL_STOP, PENDING_CONSULTATION]
    description: 증상별 제품 사용 안내
  inquiry_status:
    type: string
    allowed: [DRAFT, QUESTIONNAIRE_IN_PROGRESS, AI_GUIDANCE, CONSULTATION_REQUIRED, CONSULTATION_IN_PROGRESS, VISIT_REVIEW_PENDING, VISIT_SCHEDULING, VISIT_SCHEDULED, COMPLETION_PENDING, REVISIT_REQUIRED, REOPENED, RESOLVED, CANCELLED]
    description: Inquiry 상태 집합
  visit_status:
    type: string
    allowed: [ASSIGNING, SCHEDULING, CONFIRMED, IN_PROGRESS, COMPLETED, FOLLOW_UP_REQUIRED, CANCELLED]
    description: Visit 상태 집합
  id:
    type: integer
    description: Fixture 내부 관계에만 사용하는 local PK
  public_id:
    type: uuid
    description: Public API에서 사용하는 외부 식별자
  business_code:
    type: string
    pattern: "^(DEMO|SYN)-"
    description: 사람이 확인하는 업무 코드이며 DB FK나 Public API ID로 사용하지 않음
  state_version:
    type: integer
    description: 대상 Aggregate별 연속 상태 변경 버전이며 중복 차단 기준
  target_type_code:
    type: string
    allowed: [QUESTIONNAIRE, INQUIRY, CONSULTATION, VISIT]
    description: 상태이력 대상 유형이며 설정된 대상별 FK와 반드시 일치
  target_foreign_key:
    type: integer
    allowed_fields: [questionnaire_session_id, inquiry_id, consultation_id, visit_id]
    description: 네 대상 FK 중 정확히 하나만 설정
  idempotency_key:
    type: string
    description: 요청과 상태이력을 연결하는 추적값이며 상태이력에서 UNIQUE가 아님
  internal_conflict_code:
    type: string
    allowed: [IDEMPOTENCY_KEY_REUSE_CONFLICT]
    description: 상태 계약 내부 Guard 충돌 코드
  expected_api_error_code:
    type: string
    allowed: [DUPLICATE-EVENT-01]
    description: Public API 409 응답에서 기대하는 외부 오류 코드
  source_file_sha256:
    type: string
    pattern: "^[A-F0-9]{64}$"
    description: 원본 파일의 SHA-256
  generated_at:
    type: datetime
    format: ISO-8601
    timezone: Asia/Seoul
    description: 결정적 산출물 생성 기준 시각
