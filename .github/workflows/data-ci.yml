permissions:
  contents: read

jobs:
  verify-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements/base.txt"

      - name: Install contract validator dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Validate approved state machine
        run: python scripts/contracts/validate_state_machine.py

      - name: Reject state machine diagram drift
        run: python scripts/contracts/render_state_machine.py --check

      - name: Validate common code registries
        run: python scripts/contracts/validate_codes.py

      - name: Validate OpenAPI contract
        run: python scripts/contracts/validate_openapi.py

      - name: Validate contract examples
        run: python scripts/contracts/validate_examples.py

      - name: Validate Action OpenAPI Runtime crosswalk
        run: python scripts/contracts/validate_contract_crosswalk.py

      - name: Run contract tests
        run: |
          python -B -m unittest discover -s tests/contract/api -p "test_*.py" -v
          python -B -m unittest discover -s tests/contract -p "test_*.py" -v

      - name: Run Data unit tests
        run: python -B -m unittest discover -s data/tools/tests -v

      - name: Verify deterministic rebuild and QA
        run: python -B data/tools/pipeline.py qa --verify-rebuild

      - name: Reject generated artifact drift
        run: git diff --exit-code -- data
