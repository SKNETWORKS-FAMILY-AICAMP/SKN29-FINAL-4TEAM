name: Data CI

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/contracts/**"
      - "scripts/data/**"
      - ".github/workflows/data-ci.yml"
      - "contracts/state-machine/**"
      - "backend/apps/accounts/models/customer_profile.py"
      - "backend/apps/accounts/models/user.py"
      - "backend/apps/accounts/repositories/account_repository.py"
      - "backend/apps/audit/models/audit_event.py"
      - "backend/apps/care/models/care_history.py"
      - "backend/apps/consultations/models/consultation.py"
      - "backend/apps/inquiries/models/followup_confirmation.py"
      - "backend/apps/inquiries/models/inquiry.py"
      - "backend/apps/inquiries/models/symptom_entry.py"
      - "backend/apps/operations/management/commands/import_synthetic_handoff.py"
      - "backend/apps/operations/models/synthetic_import_ledger.py"
      - "backend/apps/operations/repositories/operations_repository.py"
      - "backend/apps/operations/services/operations_service.py"
      - "backend/apps/products/models/product_model_registry.py"
      - "backend/apps/subscriptions/models/subscription.py"
      - "backend/apps/visits/models/visit.py"
      - "backend/apps/workflow/models/transition_history.py"
      - "docs/individual/jiyong/manuals/20260729_postgresql_synthetic_handoff_runtime_verification.md"
      - "ai/evaluation/reports/pgvector_verification.json"
      - "ai/configs/index_manifest.json"
  push:
    paths:
      - "data/**"
      - "scripts/contracts/**"
      - "scripts/data/**"
      - ".github/workflows/data-ci.yml"
      - "contracts/state-machine/**"
      - "backend/apps/accounts/models/customer_profile.py"
      - "backend/apps/accounts/models/user.py"
      - "backend/apps/accounts/repositories/account_repository.py"
      - "backend/apps/audit/models/audit_event.py"
      - "backend/apps/care/models/care_history.py"
      - "backend/apps/consultations/models/consultation.py"
      - "backend/apps/inquiries/models/followup_confirmation.py"
      - "backend/apps/inquiries/models/inquiry.py"
      - "backend/apps/inquiries/models/symptom_entry.py"
      - "backend/apps/operations/management/commands/import_synthetic_handoff.py"
      - "backend/apps/operations/models/synthetic_import_ledger.py"
      - "backend/apps/operations/repositories/operations_repository.py"
      - "backend/apps/operations/services/operations_service.py"
      - "backend/apps/products/models/product_model_registry.py"
      - "backend/apps/subscriptions/models/subscription.py"
      - "backend/apps/visits/models/visit.py"
      - "backend/apps/workflow/models/transition_history.py"
      - "docs/individual/jiyong/manuals/20260729_postgresql_synthetic_handoff_runtime_verification.md"
      - "ai/evaluation/reports/pgvector_verification.json"
      - "ai/configs/index_manifest.json"

permissions:
  contents: read

jobs:
  verify-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/constraints-py313.txt

      - name: Install data gate dependencies
        run: >-
          python -m pip install
          --constraint backend/requirements/constraints-py313.txt
          PyYAML==6.0.3 jsonschema==4.26.0

      - name: Validate approved state machine
        run: python scripts/contracts/validate_state_machine.py

      - name: Reject state machine diagram drift
        run: python scripts/contracts/render_state_machine.py --check

      - name: Run Data unit tests
        run: python -B -m unittest discover -s data/tools/tests -v

      - name: Verify deterministic rebuild and QA
        run: python -B data/tools/pipeline.py qa --verify-rebuild

      - name: Reject generated artifact drift
        run: git diff --exit-code -- data
