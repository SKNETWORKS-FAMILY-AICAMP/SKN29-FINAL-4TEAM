name: AWS OIDC Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-oidc-smoke
  cancel-in-progress: false

jobs:
  verify-aws-oidc:
    name: Verify AWS OIDC, ECR, and SSM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      ECR_WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
      ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
      ECR_AI_REPOSITORY: ${{ vars.ECR_AI_REPOSITORY }}

    steps:
      - name: Validate repository variables
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'This smoke test must run from the main branch.' >&2
            exit 1
          fi

          required=(
            AWS_REGION
            AWS_ROLE_ARN
            AWS_ACCOUNT_ID
            EC2_INSTANCE_ID
            ECR_WEB_REPOSITORY
            ECR_BACKEND_REPOSITORY
            ECR_AI_REPOSITORY
          )
          missing=()

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing repository variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo 'AWS_ACCOUNT_ID must contain exactly 12 digits.' >&2
            exit 1
          fi

          if [[ ! "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]; then
            echo 'AWS_REGION is not a canonical AWS region.' >&2
            exit 1
          fi

          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo 'EC2_INSTANCE_ID must be a complete EC2 instance ID.' >&2
            exit 1
          fi

          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${AWS_ACCOUNT_ID}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
            echo 'AWS_ROLE_ARN must belong to the configured AWS account.' >&2
            exit 1
          fi

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: waterbridge-oidc-${{ github.run_id }}

      - name: Verify assumed AWS account and role
        shell: bash
        run: |
          set -euo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          actual_arn="$(aws sts get-caller-identity --query Arn --output text)"
          expected_role_name="${AWS_ROLE_ARN##*/}"
          expected_role_prefix="arn:aws:sts::${AWS_ACCOUNT_ID}:assumed-role/${expected_role_name}/"

          if [[ "$actual_account" != "$AWS_ACCOUNT_ID" ]]; then
            echo 'OIDC assumed an unexpected AWS account.' >&2
            exit 1
          fi

          if [[ "$actual_arn" != "${expected_role_prefix}"* ]]; then
            echo 'OIDC assumed an unexpected IAM role.' >&2
            exit 1
          fi

          echo 'AWS OIDC authentication verified.'

      - name: Verify ECR repositories
        shell: bash
        run: |
          repositories=(
            "$ECR_WEB_REPOSITORY"
            "$ECR_BACKEND_REPOSITORY"
            "$ECR_AI_REPOSITORY"
          )

          for repository in "${repositories[@]}"; do
            aws ecr describe-repositories \
              --region "$AWS_REGION" \
              --repository-names "$repository" \
              >/dev/null
          done

          echo 'WaterBridge ECR repositories verified.'

      - name: Verify SSM command path
        shell: bash
        run: |
          set -euo pipefail
          commands_json="$(jq -cn \
            --arg command "printf '%s\\n' AWS_OIDC_SSM_PATH_PASS" \
            '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'WaterBridge GitHub OIDC smoke test' \
            --parameters "$commands_json" \
            --query Command.CommandId \
            --output text)"

          poll_ssm_oidc() {
            local deadline invocation poll_status
            deadline=$((SECONDS + 120))
            while (( SECONDS < deadline )); do
              if invocation="$(aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --output json 2>/dev/null)"; then
                poll_status="$(jq -r '.Status' <<<"$invocation")"
                case "$poll_status" in
                  Success|Failed|Cancelled|TimedOut)
                    printf '%s' "$invocation"
                    return 0
                    ;;
                  Pending|InProgress|Delayed|Cancelling)
                    ;;
                  *)
                    printf 'SSM_OIDC_UNKNOWN_STATUS status=%s\n' "$poll_status" >&2
                    return 1
                    ;;
                esac
              fi
              sleep 5
            done
            printf 'SSM_OIDC_POLL_TIMEOUT seconds=120\n' >&2
            return 1
          }
          invocation="$(poll_ssm_oidc)"
          status="$(jq -r '.Status' <<<"$invocation")"
          stdout="$(jq -r '.StandardOutputContent // ""' <<<"$invocation")"
          stderr="$(jq -r '.StandardErrorContent // ""' <<<"$invocation")"
          printf '%s\n' "$stdout"
          [[ -z "$stderr" ]] || printf '%s\n' "$stderr" >&2
          [[ "$status" == "Success" ]]
          grep -q '^AWS_OIDC_SSM_PATH_PASS$' <<<"$stdout"

          echo 'EC2 SSM command path verified.'
