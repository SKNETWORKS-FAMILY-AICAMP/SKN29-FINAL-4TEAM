name: Production Deploy

on:
  workflow_run:
    workflows:
      - AI Backend Socket E2E Linux Gate
    types:
      - completed

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: waterbridge-production
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  ECR_WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
  ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
  ECR_AI_REPOSITORY: ${{ vars.ECR_AI_REPOSITORY }}

jobs:
  source-guard:
    name: Verify release source and container boundaries
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.13"

      - name: Reject placeholder images and mutable runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          for dockerfile in web/Dockerfile backend/Dockerfile ai/Dockerfile; do
            if ! grep -Eq '^[[:space:]]*FROM[[:space:]]+' "$dockerfile"; then
              echo "Production Dockerfile is still a placeholder: ${dockerfile}" >&2
              exit 1
            fi
            final_user="$(awk 'toupper($1) == "USER" { user=$2 } END { print user }' "$dockerfile")"
            if [[ -z "$final_user" || "$final_user" == "root" || "$final_user" == "0" ]]; then
              echo "Production image must declare a final non-root USER: ${dockerfile}" >&2
              exit 1
            fi
            grep -Eiq '^[[:space:]]*HEALTHCHECK[[:space:]]+' "$dockerfile" || {
              echo "Production image must declare HEALTHCHECK: ${dockerfile}" >&2
              exit 1
            }
          done
          [[ -s web/nginx.conf ]] || {
            echo "web/nginx.conf is empty." >&2
            exit 1
          }
          grep -Fq 'requirements/production.txt' backend/Dockerfile
          grep -Fq 'collectstatic' backend/Dockerfile
          grep -Fq 'ai/requirements-linux.lock' ai/Dockerfile
          grep -Fq 'VITE_USE_MOCK_API=false' web/Dockerfile
          grep -Fq 'VITE_ENABLE_DESIGN_MOCK_FALLBACK=false' web/Dockerfile
          grep -Fxq 'gunicorn==26.0.0' backend/requirements/production.txt
          grep -Fxq 'gunicorn==26.0.0' backend/requirements/constraints-py313.txt
          if rg -n 'data/(synthetic/fixtures|processed/structured/evidence)' web/src; then
            echo "Production Web source still statically imports Mock/Evidence files." >&2
            echo "The Web owner must exclude those imports from the production bundle." >&2
            exit 1
          fi
          if rg -n '(^|[[:space:]])(latest|:latest)([[:space:]]|$)' \
            web/Dockerfile backend/Dockerfile ai/Dockerfile \
            infra/docker/compose/production; then
            echo "Mutable latest image references are forbidden." >&2
            exit 1
          fi

      - name: Run deployment asset tests
        run: >-
          python -B -m unittest
          tests.deployment.test_production_deployment_assets -v

  backend-gate:
    name: Re-run Backend full gate
    needs: source-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/local.txt
            backend/requirements/production.txt
            backend/requirements/constraints-py313.txt
      - name: Prepare Backend environment
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install \
            --disable-pip-version-check \
            --constraint backend/requirements/constraints-py313.txt \
            colorama==0.4.6 tzdata==2026.3
          python scripts/development/bootstrap.py --service backend
          backend/.venv/bin/python -m pip check
          env \
            DJANGO_SECRET_KEY=ci-production-config-check-only \
            DJANGO_TIME_ZONE=UTC \
            DJANGO_ALLOWED_HOSTS=localhost \
            DJANGO_CORS_ALLOWED_ORIGINS=https://localhost \
            AI_SERVICE_BASE_URL=http://127.0.0.1:8001 \
            POSTGRES_DB=ci_production_config_check \
            POSTGRES_USER=ci_production_config_check \
            POSTGRES_PASSWORD=ci-production-config-check-only \
            POSTGRES_HOST=localhost \
            POSTGRES_PORT=5432 \
            POSTGRES_SSLMODE=verify-full \
            POSTGRES_SSLROOTCERT=/etc/ssl/certs/ca-certificates.crt \
            backend/.venv/bin/gunicorn \
            --chdir backend \
            --worker-class sync \
            --workers 2 \
            --timeout 60 \
            --check-config \
            config.wsgi:application
      - name: Run Backend full environment gate
        run: python scripts/development/check_environment.py --service backend --full

  web-gate:
    name: Re-run Web production gate
    needs: source-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Build with production-only runtime flags
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_USE_MOCK_API: "false"
          VITE_ENABLE_DESIGN_MOCK_FALLBACK: "false"
        run: npm run build

  contract-data-gate:
    name: Re-run Contract and Data gates
    needs: source-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: backend/requirements/constraints-py313.txt
      - name: Install gate dependencies
        run: >-
          python -m pip install
          --constraint backend/requirements/constraints-py313.txt
          PyYAML==6.0.3 jsonschema==4.26.0 pytest==9.1.1
      - name: Validate machine contracts
        run: |
          python -B scripts/contracts/validate_state_machine.py
          python -B scripts/contracts/render_state_machine.py --check
          python -B scripts/contracts/validate_codes.py
          python -B scripts/contracts/validate_openapi.py
          python -B scripts/contracts/validate_examples.py
          python -B scripts/contracts/validate_contract_crosswalk.py
          python -B -m pytest tests/contract -q -p no:cacheprovider
      - name: Validate deterministic Data baseline
        run: |
          python -B -m unittest discover -s data/tools/tests -v
          python -B data/tools/pipeline.py qa --verify-rebuild
          git diff --exit-code -- data

  build-and-publish:
    name: Build and publish immutable images
    needs:
      - backend-gate
      - web-gate
      - contract-data-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      web_digest: ${{ steps.web-build.outputs.digest }}
      backend_digest: ${{ steps.backend-build.outputs.digest }}
      ai_digest: ${{ steps.ai-build.outputs.digest }}
      storage_bucket: ${{ steps.storage.outputs.bucket }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate AWS repository variables
        shell: bash
        run: |
          set -euo pipefail
          for key in AWS_REGION AWS_ROLE_ARN EC2_INSTANCE_ID ECR_WEB_REPOSITORY ECR_BACKEND_REPOSITORY ECR_AI_REPOSITORY; do
            if [[ -z "${!key:-}" ]]; then
              echo "Required repository variable is missing: ${key}" >&2
              exit 1
            fi
          done

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - uses: docker/setup-buildx-action@v4

      - name: Resolve bootstrap storage
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          bucket="$(aws ssm get-parameter \
            --name /waterbridge/production/storage-bucket \
            --query 'Parameter.Value' \
            --output text)"
          [[ -n "$bucket" && "$bucket" != "None" ]] || {
            echo "Production Bootstrap must create or connect storage before deployment." >&2
            exit 1
          }
          echo "bucket=${bucket}" >> "$GITHUB_OUTPUT"

      - name: Build AI Linux unit-test target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ai/Dockerfile
          target: qa
          build-args: RELEASE_SHA=${{ env.RELEASE_SHA }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=waterbridge-ai
          cache-to: type=gha,mode=max,scope=waterbridge-ai

      - name: Build and push Web image
        id: web-build
        uses: docker/build-push-action@v7
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_WEB_REPOSITORY }}:${{ env.RELEASE_SHA }}
          platforms: linux/amd64
          provenance: true
          sbom: true
          cache-from: type=gha,scope=waterbridge-web
          cache-to: type=gha,mode=max,scope=waterbridge-web

      - name: Build and push Backend image
        id: backend-build
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ env.RELEASE_SHA }}
          platforms: linux/amd64
          provenance: true
          sbom: true
          cache-from: type=gha,scope=waterbridge-backend
          cache-to: type=gha,mode=max,scope=waterbridge-backend

      - name: Build and push AI image
        id: ai-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ai/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_AI_REPOSITORY }}:${{ env.RELEASE_SHA }}
          platforms: linux/amd64
          provenance: true
          sbom: true
          cache-from: type=gha,scope=waterbridge-ai
          cache-to: type=gha,mode=max,scope=waterbridge-ai

      - name: Verify published images are non-root and executable
        shell: bash
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          WEB_DIGEST: ${{ steps.web-build.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend-build.outputs.digest }}
          AI_DIGEST: ${{ steps.ai-build.outputs.digest }}
        run: |
          set -euo pipefail
          web_ref="${REGISTRY}/${ECR_WEB_REPOSITORY}@${WEB_DIGEST}"
          backend_ref="${REGISTRY}/${ECR_BACKEND_REPOSITORY}@${BACKEND_DIGEST}"
          ai_ref="${REGISTRY}/${ECR_AI_REPOSITORY}@${AI_DIGEST}"
          for image_ref in "$web_ref" "$backend_ref" "$ai_ref"; do
            docker pull "$image_ref"
            image_user="$(docker image inspect --format '{{.Config.User}}' "$image_ref")"
            [[ -n "$image_user" && "$image_user" != "root" && "$image_user" != "0" ]] || {
              echo "Published image has no final non-root user: ${image_ref}" >&2
              exit 1
            }
          done
          docker run --rm --add-host backend:127.0.0.1 --tmpfs /tmp:rw,size=32m \
            --entrypoint nginx "$web_ref" -t
          docker run --rm --entrypoint python "$backend_ref" \
            -c "import os; assert os.getuid() != 0"
          docker run --rm --entrypoint gunicorn "$backend_ref" --version
          docker run --rm --entrypoint python "$ai_ref" \
            -c "import os; assert os.getuid() != 0"
          docker run --rm --entrypoint python "$ai_ref" -m pip check

      - name: Create and upload the release bundle
        shell: bash
        env:
          STORAGE_BUCKET: ${{ steps.storage.outputs.bucket }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          WEB_DIGEST: ${{ steps.web-build.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend-build.outputs.digest }}
          AI_DIGEST: ${{ steps.ai-build.outputs.digest }}
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/release"
          mkdir -p "$release_root/infra/docker/compose/production" "$release_root/scripts/deployment/production"
          cp infra/docker/compose/production/compose.yml infra/docker/compose/production/tempo.yml \
            "$release_root/infra/docker/compose/production/"
          cp scripts/deployment/production/deploy-release.sh \
            scripts/deployment/production/rollback-release.sh \
            scripts/deployment/production/validate_backend_runtime.py \
            scripts/deployment/production/validate_ai_readonly_runtime.py \
            scripts/deployment/production/trace_canary.py \
            "$release_root/scripts/deployment/production/"
          {
            echo "WEB_IMAGE=${REGISTRY}/${ECR_WEB_REPOSITORY}"
            echo "WEB_IMAGE_DIGEST=${WEB_DIGEST}"
            echo "BACKEND_IMAGE=${REGISTRY}/${ECR_BACKEND_REPOSITORY}"
            echo "BACKEND_IMAGE_DIGEST=${BACKEND_DIGEST}"
            echo "AI_IMAGE=${REGISTRY}/${ECR_AI_REPOSITORY}"
            echo "AI_IMAGE_DIGEST=${AI_DIGEST}"
          } > "$release_root/release.env"
          tar -C "$release_root" -czf "$RUNNER_TEMP/release.tar.gz" .
          sha256sum "$RUNNER_TEMP/release.tar.gz" > "$RUNNER_TEMP/release.tar.gz.sha256"
          prefix="s3://${STORAGE_BUCKET}/releases/${RELEASE_SHA}"
          aws s3 cp "$RUNNER_TEMP/release.tar.gz" "${prefix}/release.tar.gz" --only-show-errors
          aws s3 cp "$RUNNER_TEMP/release.tar.gz.sha256" "${prefix}/release.tar.gz.sha256" --only-show-errors
          aws s3 cp scripts/deployment/production/deploy-release.sh "${prefix}/deploy-release.sh" --only-show-errors
          aws s3 cp scripts/deployment/production/rollback-release.sh "${prefix}/rollback-release.sh" --only-show-errors

  deploy:
    name: Deploy through SSM and verify HTTPS
    needs: build-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: production
      url: https://waterbridge.site
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.13"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy the immutable release on EC2
        id: deploy
        shell: bash
        env:
          STORAGE_BUCKET: ${{ needs.build-and-publish.outputs.storage_bucket }}
        run: |
          set -euo pipefail
          commands_json="$(jq -cn \
            --arg bucket "$STORAGE_BUCKET" \
            --arg sha "$RELEASE_SHA" \
            --arg region "$AWS_REGION" \
            '{commands:[
              "set -euo pipefail",
              "install -d -m 0750 /opt/waterbridge/shared",
              ("aws s3 cp s3://" + $bucket + "/releases/" + $sha + "/deploy-release.sh /opt/waterbridge/shared/deploy-release.sh --only-show-errors"),
              "chmod 0750 /opt/waterbridge/shared/deploy-release.sh",
              ("/opt/waterbridge/shared/deploy-release.sh " + $sha + " " + $bucket + " " + $region + " /etc/waterbridge/backend.env /etc/waterbridge/ai.env /etc/waterbridge/certs/rds-ca.pem")
            ]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "WaterBridge deploy ${RELEASE_SHA}" \
            --parameters "$commands_json" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=${command_id}" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          invocation="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --output json)"
          status="$(jq -r '.Status' <<<"$invocation")"
          stdout="$(jq -r '.StandardOutputContent' <<<"$invocation")"
          stderr="$(jq -r '.StandardErrorContent' <<<"$invocation")"
          printf '%s\n' "$stdout"
          [[ -z "$stderr" ]] || printf '%s\n' "$stderr" >&2
          [[ "$status" == "Success" ]]
          grep -q '^DEPLOYMENT_RUNTIME_PASS$' <<<"$stdout"

      - name: Run external HTTPS smoke
        run: python scripts/smoke/check_production_deployment.py --base-url https://waterbridge.site

      - name: Roll back after a post-deployment failure
        if: ${{ failure() && steps.deploy.outputs.command_id != '' }}
        shell: bash
        env:
          STORAGE_BUCKET: ${{ needs.build-and-publish.outputs.storage_bucket }}
        run: |
          set -euo pipefail
          commands_json="$(jq -cn \
            --arg bucket "$STORAGE_BUCKET" \
            --arg sha "$RELEASE_SHA" \
            '{commands:[
              "set -euo pipefail",
              ("aws s3 cp s3://" + $bucket + "/releases/" + $sha + "/rollback-release.sh /opt/waterbridge/shared/rollback-release.sh --only-show-errors"),
              "chmod 0750 /opt/waterbridge/shared/rollback-release.sh",
              "/opt/waterbridge/shared/rollback-release.sh"
            ]}')"
          rollback_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "WaterBridge rollback after ${RELEASE_SHA}" \
            --parameters "$commands_json" \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed --command-id "$rollback_id" --instance-id "$EC2_INSTANCE_ID"

      - name: Record deployment result
        if: ${{ success() }}
        run: |
          {
            echo "### WaterBridge production deployment"
            echo
            echo "- Release SHA: \`${RELEASE_SHA}\`"
            echo "- Runtime: \`DEPLOYMENT_RUNTIME_PASS\`"
            echo "- Observability: \`OBSERVABILITY_PARTIAL\`"
            echo "- Migration/Seed/Evidence import: not executed"
            echo "- Trace completion remains blocked on Backend trace propagation."
          } >> "$GITHUB_STEP_SUMMARY"
