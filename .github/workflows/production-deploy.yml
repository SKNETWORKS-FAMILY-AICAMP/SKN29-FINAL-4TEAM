name: Production Deploy Trusted Implementation

on:
  workflow_call:
    inputs:
      operation:
        description: Trusted operation selected by an approved caller.
        required: false
        default: release
        type: string
      release_sha:
        description: Immutable release SHA selected by the caller.
        required: true
        type: string
      release_tag:
        description: Stable SemVer release tag selected by the tag event.
        required: false
        default: ""
        type: string
      canary_action:
        description: AI Handoff Canary action.
        required: false
        default: ""
        type: string
      canary_inquiry_id:
        description: Existing synthetic Inquiry UUID for the Canary.
        required: false
        default: ""
        type: string
      canary_operator_ip:
        description: One fixed public IPv4 address allowed during the window.
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: waterbridge-production
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.release_sha }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  ECR_WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
  ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
  ECR_AI_REPOSITORY: ${{ vars.ECR_AI_REPOSITORY }}
  BACKEND_EMAIL_AUTH_SECRET_ID: ${{ vars.BACKEND_EMAIL_AUTH_SECRET_ID }}

jobs:
  ai-handoff-canary:
    name: Control the protected AI Handoff Canary window
    if: ${{ inputs.operation == 'ai_handoff_canary' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - name: Validate Canary caller and inputs
        shell: bash
        env:
          CANARY_ACTION: ${{ inputs.canary_action }}
          CANARY_INQUIRY_ID: ${{ inputs.canary_inquiry_id }}
          CANARY_OPERATOR_IP: ${{ inputs.canary_operator_ip }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$CALLER_REPOSITORY" == "SKNETWORKS-FAMILY-AICAMP/SKN29-FINAL-4TEAM" ]]
          [[ "$CALLER_REF" == "refs/heads/main" ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANARY_ACTION" =~ ^(preflight|open|run|close|status)$ ]]
          [[ "$CANARY_INQUIRY_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          python3 - "$CANARY_OPERATOR_IP" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4 or not address.is_global:
              raise SystemExit("Canary operator address must be one public IPv4 address")
          PY
          for key in AWS_REGION AWS_ROLE_ARN AWS_ACCOUNT_ID EC2_INSTANCE_ID; do
            [[ -n "${!key:-}" ]] || {
              echo "Required repository variable is missing: ${key}" >&2
              exit 1
            }
          done
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]
          [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${AWS_ACCOUNT_ID}:role/[A-Za-z0-9+=,.@_/-]+$ ]]

      - name: Checkout trusted main caller for SSM transport helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/deployment/production

      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: waterbridge-handoff-canary-${{ github.run_id }}

      - name: Run protected Canary action through SSM
        id: canary
        shell: bash
        env:
          CANARY_ACTION: ${{ inputs.canary_action }}
          CANARY_INQUIRY_ID: ${{ inputs.canary_inquiry_id }}
          CANARY_OPERATOR_IP: ${{ inputs.canary_operator_ip }}
        run: |
          set -euo pipefail
          if [[ "$CANARY_ACTION" == "run" ]]; then
            script_path="/opt/waterbridge/current/scripts/deployment/production/run-ai-resume-handoff-canary.sh"
            printf -v canary_command '%q %q %q %q' \
              "$script_path" "$RELEASE_SHA" \
              "$CANARY_INQUIRY_ID" "$CANARY_OPERATOR_IP"
          else
            script_path="/opt/waterbridge/current/scripts/deployment/production/manage-ai-handoff-canary.sh"
            printf -v canary_command '%q %q %q %q %q' \
              "$script_path" "$CANARY_ACTION" "$RELEASE_SHA" \
              "$CANARY_INQUIRY_ID" "$CANARY_OPERATOR_IP"
          fi
          commands_json="$(python3 scripts/deployment/production/build_ssm_bash_parameters.py \
            "$canary_command")"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "WaterBridge AI Handoff Canary ${CANARY_ACTION}" \
            --parameters "$commands_json" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=${command_id}" >> "$GITHUB_OUTPUT"

          poll_ssm_canary() {
            local deadline invocation poll_status
            deadline=$((SECONDS + 1200))
            while (( SECONDS < deadline )); do
              if invocation="$(aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --output json 2>/dev/null)"; then
                poll_status="$(jq -r '.Status' <<<"$invocation")"
                case "$poll_status" in
                  Success|Failed|Cancelled|TimedOut)
                    printf '%s' "$invocation"
                    return 0
                    ;;
                  Pending|InProgress|Delayed|Cancelling)
                    ;;
                  *)
                    printf 'SSM_CANARY_UNKNOWN_STATUS status=%s\n' "$poll_status" >&2
                    return 1
                    ;;
                esac
              fi
              sleep 5
            done
            printf 'SSM_CANARY_POLL_TIMEOUT seconds=1200\n' >&2
            return 1
          }

          invocation="$(poll_ssm_canary)"
          status="$(jq -r '.Status' <<<"$invocation")"
          stdout="$(jq -r '.StandardOutputContent // ""' <<<"$invocation")"
          stderr="$(jq -r '.StandardErrorContent // ""' <<<"$invocation")"
          printf '%s\n' "$stdout"
          [[ -z "$stderr" ]] || printf '%s\n' "$stderr" >&2
          [[ "$status" == "Success" ]]
          case "$CANARY_ACTION" in
            preflight) marker=CANARY_PREFLIGHT_PASS ;;
            open) marker=CANARY_OPEN_PASS ;;
            run) marker=CANARY_RUN_PASS ;;
            close) marker=CANARY_CLOSE_PASS ;;
            status) marker=CANARY_STATUS_PASS ;;
          esac
          grep -q "^${marker}$" <<<"$stdout"

      - name: Record non-sensitive Canary action evidence
        shell: bash
        env:
          CANARY_ACTION: ${{ inputs.canary_action }}
          CANARY_INQUIRY_ID: ${{ inputs.canary_inquiry_id }}
        run: |
          {
            echo "### AI Handoff Canary operation"
            echo
            echo "- Action: \`${CANARY_ACTION}\`"
            echo "- Release SHA: \`${RELEASE_SHA}\`"
            echo "- Inquiry ID: \`${CANARY_INQUIRY_ID}\`"
            echo "- SSM command ID: \`${{ steps.canary.outputs.command_id }}\`"
            echo "- Always-on activation: \`HOLD\`"
          } >> "$GITHUB_STEP_SUMMARY"

  source-guard:
    name: Verify release source and container boundaries
    if: ${{ inputs.operation == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.13"

      - name: Verify stable SemVer tag and main ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REF_NAME: ${{ github.ref_name }}
          CALLER_REF_TYPE: ${{ github.ref_type }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CALLER_REPOSITORY" == "SKNETWORKS-FAMILY-AICAMP/SKN29-FINAL-4TEAM" ]]
          [[ "$CALLER_EVENT" == "push" ]]
          [[ "$CALLER_REF_TYPE" == "tag" ]]
          [[ "$CALLER_REF" == "refs/tags/${RELEASE_TAG}" ]]
          [[ "$CALLER_REF_NAME" == "$RELEASE_TAG" ]]
          [[ "$CALLER_SHA" == "$RELEASE_SHA" ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Production release tag must be stable SemVer: ${RELEASE_TAG}" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "Production release commit is not contained in origin/main." >&2
            exit 1
          }

      - name: Reject placeholder images and mutable runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          for dockerfile in web/Dockerfile backend/Dockerfile ai/Dockerfile; do
            if ! grep -Eq '^[[:space:]]*FROM[[:space:]]+' "$dockerfile"; then
              echo "Production Dockerfile is still a placeholder: ${dockerfile}" >&2
              exit 1
            fi
            final_user="$(awk 'toupper($1) == "USER" { user=$2 } END { print user }' "$dockerfile")"
            if [[ -z "$final_user" || "$final_user" == "root" || "$final_user" == "0" ]]; then
              echo "Production image must declare a final non-root USER: ${dockerfile}" >&2
              exit 1
            fi
            grep -Eiq '^[[:space:]]*HEALTHCHECK[[:space:]]+' "$dockerfile" || {
              echo "Production image must declare HEALTHCHECK: ${dockerfile}" >&2
              exit 1
            }
          done
          [[ -s web/nginx.conf ]] || {
            echo "web/nginx.conf is empty." >&2
            exit 1
          }
          grep -Fq 'requirements/production.txt' backend/Dockerfile
          grep -Fq 'collectstatic' backend/Dockerfile
          grep -Fq 'COPY --from=state_machine_contracts . /workspace/contracts/state-machine/' backend/Dockerfile
          grep -Fq 'COPY --from=api_contracts action-operation-crosswalk.yaml /workspace/contracts/api/action-operation-crosswalk.yaml' backend/Dockerfile
          grep -Fq 'COPY --from=ai_contracts . /workspace/contracts/ai/' backend/Dockerfile
          grep -Fq 'COPY --from=code_contracts safety-rule-ids.yaml /workspace/contracts/codes/safety-rule-ids.yaml' backend/Dockerfile
          grep -Fq 'load_state_machine_contract()' backend/Dockerfile
          grep -Fq "load_yaml_mapping(Path('/workspace/contracts/api/action-operation-crosswalk.yaml'))" backend/Dockerfile
          grep -Fq 'AIContractValidator()' backend/Dockerfile
          grep -Fq 'load_safety_rule_registry()' backend/Dockerfile
          grep -Fq 'ai/requirements-linux.lock' ai/Dockerfile
          grep -Fq 'VITE_USE_MOCK_API=false' web/Dockerfile
          grep -Fq 'VITE_ENABLE_DESIGN_MOCK_FALLBACK=false' web/Dockerfile
          grep -Fxq 'gunicorn==26.0.0' backend/requirements/production.txt
          grep -Fxq 'gunicorn==26.0.0' backend/requirements/constraints-py313.txt
          if grep -R -n -E \
            'data/(synthetic/fixtures|processed/structured/evidence)' web/src; then
            echo "Production Web source still statically imports Mock/Evidence files." >&2
            echo "The Web owner must exclude those imports from the production bundle." >&2
            exit 1
          fi
          if grep -R -n -E '(^|[[:space:]])(latest|:latest)([[:space:]]|$)' \
            web/Dockerfile backend/Dockerfile ai/Dockerfile \
            infra/docker/compose/production; then
            echo "Mutable latest image references are forbidden." >&2
            exit 1
          fi

      - name: Require Backend-owned AWS NONPROD OTP and routing gates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKEND_EMAIL_AUTH_SECRET_ID" =~ ^waterbridge/[A-Za-z0-9/_+=.@-]{1,480}$ ]] || {
            echo "BACKEND_EMAIL_AUTH_SECRET_ID is missing or invalid." >&2
            exit 1
          }
          settings_source="$(cat backend/config/settings/base.py backend/config/settings/production.py)"
          email_service="$(cat backend/apps/accounts/services/p1_auth_email_service.py)"
          for key in \
            P1_AUTH_RUNTIME_ENVIRONMENT \
            P1_AUTH_APPROVED_TEST_RECIPIENT_DELIVERY_ENABLED \
            P1_AUTH_APPROVED_TEST_RECIPIENT_ALLOWLIST_HMACS; do
            grep -Fq "$key" <<<"$settings_source" || {
              echo "BACKEND_OWNER_WAIT: runtime setting is missing." >&2
              exit 1
            }
            grep -Fq "$key" <<<"$email_service" || {
              echo "BACKEND_OWNER_WAIT: delivery gate is missing." >&2
              exit 1
            }
          done
          for index in 001 002 003 004 005 006; do
            grep -R -Fq -- "SKN-${index}" backend/apps || {
              echo "BACKEND_OWNER_WAIT: consultant routing is missing." >&2
              exit 1
            }
            grep -R -Fq -- "SYN-P1-TEAM-CONTRACT-${index}" backend/apps || {
              echo "BACKEND_OWNER_WAIT: contract routing is missing." >&2
              exit 1
            }
          done
          echo "BACKEND_OWNER_GATE_PASS"

      - name: Run deployment asset tests
        run: >-
          python -B -m unittest
          tests.deployment.test_production_deployment_assets
          tests.deployment.test_release_image_maintenance
          tests.deployment.test_ssm_bash_parameters
          tests.deployment.test_backend_email_auth_secret_sync
          tests.deployment.test_github_oidc_trust
          tests.deployment.test_backend_ci_workflow
          tests.deployment.test_data_ci_workflow
          -v

  backend-gate:
    name: Re-run optimized Backend full gate
    needs: source-guard
    uses: ./.github/workflows/backend-ci.yml
    with:
      force_full: true

  backend-production-config-gate:
    name: Verify Backend production config
    needs: source-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/local.txt
            backend/requirements/production.txt
            backend/requirements/constraints-py313.txt
      - name: Prepare Backend environment
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install \
            --disable-pip-version-check \
            --constraint backend/requirements/constraints-py313.txt \
            colorama==0.4.6 tzdata==2026.3
          python scripts/development/bootstrap.py --service backend
          backend/.venv/bin/python -m pip check
          env \
            DJANGO_SECRET_KEY=ci-production-config-check-only \
            DJANGO_TIME_ZONE=UTC \
            DJANGO_ALLOWED_HOSTS=localhost \
            DJANGO_CORS_ALLOWED_ORIGINS=https://localhost \
            AI_SERVICE_BASE_URL=http://127.0.0.1:8001 \
            CONTRACT_EMAIL_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            CONTRACT_EMAIL_HMAC_KEY=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE= \
            CONTRACT_EMAIL_KEY_VERSION=ci-v1 \
            P1_AUTH_HMAC_SECRET=ci-p1-auth-secret-at-least-32-bytes \
            P1_AUTH_OTP_ENCRYPTION_KEY=AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI= \
            P1_AUTH_EMAIL_REDIRECT_TO=ci-inbox@example.invalid \
            P1_AUTH_RUNTIME_ENVIRONMENT=AWS_NONPROD \
            P1_AUTH_APPROVED_TEST_RECIPIENT_DELIVERY_ENABLED=true \
            P1_AUTH_APPROVED_TEST_RECIPIENT_ALLOWLIST_HMACS=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb,cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc,dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd,eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee,ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff \
            DJANGO_EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend \
            DJANGO_EMAIL_HOST=smtp.invalid \
            DJANGO_EMAIL_HOST_USER=ci-smtp-user \
            DJANGO_EMAIL_HOST_PASSWORD=ci-smtp-password \
            DJANGO_DEFAULT_FROM_EMAIL=no-reply@example.invalid \
            POSTGRES_DB=ci_production_config_check \
            POSTGRES_USER=ci_production_config_check \
            POSTGRES_PASSWORD=ci-production-config-check-only \
            POSTGRES_HOST=localhost \
            POSTGRES_PORT=5432 \
            POSTGRES_SSLMODE=verify-full \
            POSTGRES_SSLROOTCERT=/etc/ssl/certs/ca-certificates.crt \
            backend/.venv/bin/gunicorn \
            --chdir backend \
            --worker-class sync \
            --workers 2 \
            --timeout 60 \
            --check-config \
            config.wsgi:application

  socket-e2e-gate:
    name: Re-run AI Backend Socket E2E gate
    needs: source-guard
    uses: ./.github/workflows/ai-backend-socket-e2e.yml

  web-gate:
    name: Re-run Web production gate
    needs: source-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Build with production-only runtime flags
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_USE_MOCK_API: "false"
          VITE_ENABLE_DESIGN_MOCK_FALLBACK: "false"
        run: npm run build

  contract-data-gate:
    name: Re-run Contract and Data gates
    needs: source-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: backend/requirements/constraints-py313.txt
      - name: Install gate dependencies
        run: >-
          python -m pip install
          --constraint backend/requirements/constraints-py313.txt
          PyYAML==6.0.3 jsonschema==4.26.0 pytest==9.1.1
      - name: Validate machine contracts
        run: |
          python -B scripts/contracts/validate_state_machine.py
          python -B scripts/contracts/render_state_machine.py --check
          python -B scripts/contracts/validate_codes.py
          python -B scripts/contracts/validate_openapi.py
          python -B scripts/contracts/validate_examples.py
          python -B scripts/contracts/validate_contract_crosswalk.py
          python -B -m pytest tests/contract -q -p no:cacheprovider
      - name: Validate deterministic Data baseline
        run: |
          python -B -m unittest discover -s data/tools/tests -v
          python -B data/tools/pipeline.py qa --verify-rebuild
          git diff --exit-code -- data

  build-and-publish:
    name: Build and publish immutable images
    needs:
      - backend-gate
      - backend-production-config-gate
      - socket-e2e-gate
      - web-gate
      - contract-data-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      web_digest: ${{ steps.web-build.outputs.digest }}
      backend_digest: ${{ steps.backend-build.outputs.digest }}
      ai_digest: ${{ steps.ai-build.outputs.digest }}
      storage_bucket: ${{ steps.storage.outputs.bucket }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate AWS repository variables
        shell: bash
        run: |
          set -euo pipefail
          for key in AWS_REGION AWS_ROLE_ARN AWS_ACCOUNT_ID EC2_INSTANCE_ID ECR_WEB_REPOSITORY ECR_BACKEND_REPOSITORY ECR_AI_REPOSITORY; do
            if [[ -z "${!key:-}" ]]; then
              echo "Required repository variable is missing: ${key}" >&2
              exit 1
            fi
          done
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || {
            echo "AWS_ACCOUNT_ID must contain exactly 12 digits." >&2
            exit 1
          }
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]] || {
            echo "AWS_REGION is not a canonical AWS region." >&2
            exit 1
          }
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || {
            echo "EC2_INSTANCE_ID must be a complete EC2 instance ID." >&2
            exit 1
          }
          [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::${AWS_ACCOUNT_ID}:role/[A-Za-z0-9+=,.@_/-]+$ ]] || {
            echo "AWS_ROLE_ARN must belong to the configured AWS account." >&2
            exit 1
          }

      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: waterbridge-build-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - uses: docker/setup-buildx-action@v4

      - name: Resolve bootstrap storage
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          bucket="$(aws ssm get-parameter \
            --name /waterbridge/production/storage-bucket \
            --query 'Parameter.Value' \
            --output text)"
          [[ -n "$bucket" && "$bucket" != "None" ]] || {
            echo "Production Bootstrap must create or connect storage before deployment." >&2
            exit 1
          }
          [[ "$bucket" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] &&
            [[ "$bucket" != *..* ]] &&
            [[ ! "$bucket" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || {
              echo "Production storage bucket name is invalid." >&2
              exit 1
            }
          echo "bucket=${bucket}" >> "$GITHUB_OUTPUT"

      - name: Build AI Linux unit-test target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ai/Dockerfile
          target: qa
          build-args: RELEASE_SHA=${{ env.RELEASE_SHA }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=waterbridge-ai
          cache-to: type=gha,mode=max,scope=waterbridge-ai

      - name: Build and push Web image
        id: web-build
        uses: docker/build-push-action@v7
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_WEB_REPOSITORY }}:${{ env.RELEASE_SHA }}
          platforms: linux/amd64
          provenance: true
          sbom: true
          cache-from: type=gha,scope=waterbridge-web
          cache-to: type=gha,mode=max,scope=waterbridge-web

      - name: Build and push Backend image
        id: backend-build
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          build-contexts: |
            state_machine_contracts=contracts/state-machine
            api_contracts=contracts/api
            ai_contracts=contracts/ai
            code_contracts=contracts/codes
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ env.RELEASE_SHA }}
          platforms: linux/amd64
          provenance: true
          sbom: true
          cache-from: type=gha,scope=waterbridge-backend
          cache-to: type=gha,mode=max,scope=waterbridge-backend

      - name: Build and push AI image
        id: ai-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ai/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_AI_REPOSITORY }}:${{ env.RELEASE_SHA }}
          platforms: linux/amd64
          provenance: true
          sbom: true
          cache-from: type=gha,scope=waterbridge-ai
          cache-to: type=gha,mode=max,scope=waterbridge-ai

      - name: Verify published images are non-root and executable
        shell: bash
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          WEB_DIGEST: ${{ steps.web-build.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend-build.outputs.digest }}
          AI_DIGEST: ${{ steps.ai-build.outputs.digest }}
        run: |
          set -euo pipefail
          web_ref="${REGISTRY}/${ECR_WEB_REPOSITORY}@${WEB_DIGEST}"
          backend_ref="${REGISTRY}/${ECR_BACKEND_REPOSITORY}@${BACKEND_DIGEST}"
          ai_ref="${REGISTRY}/${ECR_AI_REPOSITORY}@${AI_DIGEST}"
          for image_ref in "$web_ref" "$backend_ref" "$ai_ref"; do
            docker pull "$image_ref"
            image_user="$(docker image inspect --format '{{.Config.User}}' "$image_ref")"
            [[ -n "$image_user" && "$image_user" != "root" && "$image_user" != "0" ]] || {
              echo "Published image has no final non-root user: ${image_ref}" >&2
              exit 1
            }
          done
          docker run --rm --add-host backend:127.0.0.1 --tmpfs /tmp:rw,size=32m \
            --entrypoint nginx "$web_ref" -t
          docker run --rm --entrypoint python "$backend_ref" \
            -c "import os; assert os.getuid() != 0"
          docker run --rm --entrypoint python "$backend_ref" \
            -c "from pathlib import Path; from apps.inquiries.services.safety_rule_registry import load_safety_rule_registry; from apps.workflow.contracts import load_state_machine_contract; from apps.workflow.contracts.state_machine_loader import load_yaml_mapping; from integrations.ai.schema_validator import AIContractValidator; load_state_machine_contract(); load_yaml_mapping(Path('/workspace/contracts/api/action-operation-crosswalk.yaml')); AIContractValidator(); assert load_safety_rule_registry(); print('BACKEND_RUNTIME_CONTRACTS_PASS'); print('BACKEND_AI_CONTRACTS_PASS'); print('BACKEND_SAFETY_RULE_REGISTRY_PASS')"
          docker run --rm --entrypoint gunicorn "$backend_ref" --version
          docker run --rm --entrypoint python "$ai_ref" \
            -c "import os; assert os.getuid() != 0"
          docker run --rm --entrypoint python "$ai_ref" -m pip check

      - name: Create and upload the release bundle
        shell: bash
        env:
          STORAGE_BUCKET: ${{ steps.storage.outputs.bucket }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          WEB_DIGEST: ${{ steps.web-build.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend-build.outputs.digest }}
          AI_DIGEST: ${{ steps.ai-build.outputs.digest }}
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/release"
          mkdir -p \
            "$release_root/infra/docker/compose/production" \
            "$release_root/infra/systemd" \
            "$release_root/scripts/deployment/production"
          cp infra/docker/compose/production/compose.yml infra/docker/compose/production/tempo.yml \
            "$release_root/infra/docker/compose/production/"
          cp infra/systemd/waterbridge-p1-auth-email-worker.service \
            "$release_root/infra/systemd/"
          cp scripts/deployment/production/deploy-release.sh \
            scripts/deployment/production/maintain_release_images.py \
            scripts/deployment/production/rollback-release.sh \
            scripts/deployment/production/manage-ai-handoff-canary.sh \
            scripts/deployment/production/run-ai-resume-handoff-canary.sh \
            scripts/deployment/production/prepare_ai_handoff_nginx.py \
            scripts/deployment/production/prepare_ai_handoff_runtime_env.py \
            scripts/deployment/production/prepare_ai_resume_runtime_env.py \
            scripts/deployment/production/run_p1_auth_email_worker.sh \
            scripts/deployment/production/sync_backend_email_auth_secret.py \
            scripts/deployment/production/validate_backend_runtime.py \
            scripts/deployment/production/validate_ai_readonly_runtime.py \
            scripts/deployment/production/validate_p1_auth_email_worker_runtime.py \
            scripts/deployment/production/trace_canary.py \
            "$release_root/scripts/deployment/production/"
          chmod 0750 \
            "$release_root/scripts/deployment/production/manage-ai-handoff-canary.sh" \
            "$release_root/scripts/deployment/production/run-ai-resume-handoff-canary.sh"
          {
            echo "WEB_IMAGE=${REGISTRY}/${ECR_WEB_REPOSITORY}"
            echo "WEB_IMAGE_DIGEST=${WEB_DIGEST}"
            echo "BACKEND_IMAGE=${REGISTRY}/${ECR_BACKEND_REPOSITORY}"
            echo "BACKEND_IMAGE_DIGEST=${BACKEND_DIGEST}"
            echo "AI_IMAGE=${REGISTRY}/${ECR_AI_REPOSITORY}"
            echo "AI_IMAGE_DIGEST=${AI_DIGEST}"
          } > "$release_root/release.env"
          tar -C "$release_root" -czf "$RUNNER_TEMP/release.tar.gz" .
          sha256sum "$RUNNER_TEMP/release.tar.gz" > "$RUNNER_TEMP/release.tar.gz.sha256"
          prefix="s3://${STORAGE_BUCKET}/releases/${RELEASE_SHA}"
          aws s3 cp "$RUNNER_TEMP/release.tar.gz" "${prefix}/release.tar.gz" --only-show-errors
          aws s3 cp "$RUNNER_TEMP/release.tar.gz.sha256" "${prefix}/release.tar.gz.sha256" --only-show-errors
          aws s3 cp scripts/deployment/production/deploy-release.sh "${prefix}/deploy-release.sh" --only-show-errors
          aws s3 cp scripts/deployment/production/rollback-release.sh "${prefix}/rollback-release.sh" --only-show-errors

  deploy:
    name: Deploy through SSM and verify HTTPS
    needs: build-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: production
      url: https://waterbridge.site
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.13"

      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: waterbridge-deploy-${{ github.run_id }}

      - name: Deploy the immutable release on EC2
        id: deploy
        shell: bash
        env:
          STORAGE_BUCKET: ${{ needs.build-and-publish.outputs.storage_bucket }}
        run: |
          set -euo pipefail
          deploy_source="s3://${STORAGE_BUCKET}/releases/${RELEASE_SHA}/deploy-release.sh"
          deploy_target="/opt/waterbridge/shared/deploy-release.sh"
          printf -v copy_command 'aws s3 cp %q %q --only-show-errors' \
            "$deploy_source" "$deploy_target"
          printf -v chmod_command 'chmod 0750 %q' "$deploy_target"
          printf -v deploy_command '%q %q %q %q %q %q %q %q' \
            "$deploy_target" "$RELEASE_SHA" "$STORAGE_BUCKET" "$AWS_REGION" \
            "/etc/waterbridge/backend.env" "/etc/waterbridge/ai.env" \
            "/etc/waterbridge/certs/rds-ca.pem" "$BACKEND_EMAIL_AUTH_SECRET_ID"
          commands_json="$(python3 scripts/deployment/production/build_ssm_bash_parameters.py \
            "if [[ -f /opt/waterbridge/shared/ai-handoff-canary.state ]]; then echo 'DEPLOYMENT_BLOCKED: active AI Handoff Canary window' >&2; exit 1; fi" \
            "install -d -m 0750 /opt/waterbridge/shared" \
            "$copy_command" "$chmod_command" "$deploy_command")"
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "WaterBridge deploy ${RELEASE_SHA}" \
            --parameters "$commands_json" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=${command_id}" >> "$GITHUB_OUTPUT"
          poll_ssm_deploy() {
            local deadline invocation poll_status
            deadline=$((SECONDS + 1200))
            while (( SECONDS < deadline )); do
              if invocation="$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --output json 2>/dev/null)"; then
                poll_status="$(jq -r '.Status' <<<"$invocation")"
                case "$poll_status" in
                  Success|Failed|Cancelled|TimedOut)
                    printf '%s' "$invocation"
                    return 0
                    ;;
                  Pending|InProgress|Delayed|Cancelling)
                    ;;
                  *)
                    printf 'SSM_DEPLOY_UNKNOWN_STATUS status=%s\n' "$poll_status" >&2
                    return 1
                    ;;
                esac
              fi
              sleep 10
            done
            printf 'SSM_DEPLOY_POLL_TIMEOUT seconds=1200\n' >&2
            return 1
          }
          invocation="$(poll_ssm_deploy)"
          status="$(jq -r '.Status' <<<"$invocation")"
          stdout="$(jq -r '.StandardOutputContent' <<<"$invocation")"
          stderr="$(jq -r '.StandardErrorContent' <<<"$invocation")"
          if grep -q '^DEPLOYMENT_MUTATION_STARTED$' <<<"$stdout"; then
            echo "mutation_started=true" >> "$GITHUB_OUTPUT"
          else
            echo "mutation_started=false" >> "$GITHUB_OUTPUT"
          fi
          printf '%s\n' "$stdout"
          [[ -z "$stderr" ]] || printf '%s\n' "$stderr" >&2
          [[ "$status" == "Success" ]]
          grep -q '^DEPLOYMENT_RUNTIME_PASS$' <<<"$stdout"

      - name: Run external HTTPS smoke
        run: python scripts/smoke/check_production_deployment.py --base-url https://waterbridge.site

      - name: Roll back after a post-deployment failure
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.deploy.outputs.command_id != '' && steps.deploy.outputs.mutation_started == 'true' }}
        shell: bash
        env:
          STORAGE_BUCKET: ${{ needs.build-and-publish.outputs.storage_bucket }}
        run: |
          set -euo pipefail
          rollback_source="s3://${STORAGE_BUCKET}/releases/${RELEASE_SHA}/rollback-release.sh"
          rollback_target="/opt/waterbridge/shared/rollback-release.sh"
          printf -v copy_command 'aws s3 cp %q %q --only-show-errors' \
            "$rollback_source" "$rollback_target"
          printf -v chmod_command 'chmod 0750 %q' "$rollback_target"
          printf -v rollback_command '%q' "$rollback_target"
          commands_json="$(python3 scripts/deployment/production/build_ssm_bash_parameters.py \
            "$copy_command" "$chmod_command" "$rollback_command")"
          rollback_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "WaterBridge rollback after ${RELEASE_SHA}" \
            --parameters "$commands_json" \
            --query 'Command.CommandId' \
            --output text)"
          poll_ssm_rollback() {
            local deadline invocation poll_status
            deadline=$((SECONDS + 600))
            while (( SECONDS < deadline )); do
              if invocation="$(aws ssm get-command-invocation \
                --command-id "$rollback_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --output json 2>/dev/null)"; then
                poll_status="$(jq -r '.Status' <<<"$invocation")"
                case "$poll_status" in
                  Success|Failed|Cancelled|TimedOut)
                    printf '%s' "$invocation"
                    return 0
                    ;;
                  Pending|InProgress|Delayed|Cancelling)
                    ;;
                  *)
                    printf 'SSM_ROLLBACK_UNKNOWN_STATUS status=%s\n' "$poll_status" >&2
                    return 1
                    ;;
                esac
              fi
              sleep 10
            done
            printf 'SSM_ROLLBACK_POLL_TIMEOUT seconds=600\n' >&2
            return 1
          }
          rollback_invocation="$(poll_ssm_rollback)"
          rollback_status="$(jq -r '.Status' <<<"$rollback_invocation")"
          rollback_stdout="$(jq -r '.StandardOutputContent' <<<"$rollback_invocation")"
          rollback_stderr="$(jq -r '.StandardErrorContent' <<<"$rollback_invocation")"
          printf '%s\n' "$rollback_stdout"
          [[ -z "$rollback_stderr" ]] || printf '%s\n' "$rollback_stderr" >&2
          [[ "$rollback_status" == "Success" ]]

      - name: Record deployment result
        if: ${{ success() }}
        run: |
          {
            echo "### WaterBridge production deployment"
            echo
            echo "- Release SHA: \`${RELEASE_SHA}\`"
            echo "- Runtime: \`DEPLOYMENT_RUNTIME_PASS\`"
            echo "- Observability: \`OBSERVABILITY_PARTIAL\`"
            echo "- Migration/Seed/Evidence import: not executed"
            echo "- Trace completion remains blocked on Backend trace propagation."
          } >> "$GITHUB_STEP_SUMMARY"
