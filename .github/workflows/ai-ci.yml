name: AI CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ai/**"
      - "contracts/ai/**"
      - "contracts/codes/**"
      - "contracts/error-codes/**"
      - "data/**"
      - ".github/workflows/ai-ci.yml"
  push:
    branches:
      - main
    paths:
      - "ai/**"
      - "contracts/ai/**"
      - "contracts/codes/**"
      - "contracts/error-codes/**"
      - "data/**"
      - ".github/workflows/ai-ci.yml"

permissions:
  contents: read

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ai:
    name: Verify AI Windows baseline
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: ai/requirements.lock

      - name: Create AI environment from Windows lock
        shell: pwsh
        run: |
          python -m venv ai\.venv
          .\ai\.venv\Scripts\python.exe -m pip install `
            --disable-pip-version-check `
            -r ai\requirements.lock

      - name: Check AI dependencies
        shell: pwsh
        run: .\ai\.venv\Scripts\python.exe -m pip check

      - name: Run AI unit tests
        shell: pwsh
        run: >-
          .\ai\.venv\Scripts\python.exe -m pytest
          ai\tests\unit -q -p no:cacheprovider

      - name: Record Windows baseline boundary
        if: ${{ success() }}
        shell: pwsh
        run: |
          @"
          ### AI general CI result

          WINDOWS_BASELINE_VERIFIED

          This job does not verify a Linux container, PostgreSQL, or an external LLM provider.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
