name: AI Backend Socket E2E Linux Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ai-backend-socket-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: config.settings.local
  DJANGO_SECRET_KEY: linux-candidate-only-django-secret
  DJANGO_TIME_ZONE: UTC
  DJANGO_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
  AI_SERVICE_BASE_URL: http://127.0.0.1:8001
  AI_OTEL_ENABLED: "false"
  POSTGRES_DB: waterbridge_socket_e2e
  POSTGRES_USER: waterbridge_socket_e2e
  POSTGRES_PASSWORD: linux-candidate-only-postgres-password
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: disable
  RUN_AI_BACKEND_SOCKET_E2E: "1"

jobs:
  verify-linux-gate:
    name: AI Backend Socket E2E Linux Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: waterbridge_socket_e2e
          POSTGRES_USER: waterbridge_socket_e2e
          POSTGRES_PASSWORD: linux-candidate-only-postgres-password
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waterbridge_socket_e2e -d waterbridge_socket_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/local.txt
            backend/requirements/constraints-py313.txt
            ai/requirements-linux.lock

      - name: Prepare Linux Backend constraint packages
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install \
            --disable-pip-version-check \
            --constraint backend/requirements/constraints-py313.txt \
            colorama==0.4.6 \
            tzdata==2026.3

      - name: Bootstrap Backend environment
        run: python scripts/development/bootstrap.py --service backend

      - name: Create locked CPU-only AI environment
        run: |
          python -m venv ai/.venv
          ai/.venv/bin/python -m pip install --disable-pip-version-check pip==26.1.2
          ai/.venv/bin/python -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --index-url https://pypi.org/simple \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --requirement ai/requirements-linux.lock

      - name: Check Backend and AI dependencies
        run: |
          backend/.venv/bin/python -m pip check
          ai/.venv/bin/python -m pip check

      - name: Verify and record AI Linux CI lock
        shell: bash
        run: |
          set -euo pipefail
          lock_sha256="$(sha256sum ai/requirements-linux.lock | awk '{print $1}')"
          ai/.venv/bin/python -c "import torch; assert torch.__version__ == '2.13.0+cpu'; assert torch.version.cuda is None"
          if ai/.venv/bin/python -m pip freeze | grep -Eiq '^(cuda-|cupy-|nvidia-|pytorch-triton|torchtriton|triton==|pywin32==)'; then
            echo "GPU/CUDA 또는 Windows 전용 Package가 Linux CI 환경에 설치됐습니다." >&2
            exit 1
          fi
          {
            echo "### AI Linux CI lock"
            echo
            echo '- Path: `ai/requirements-linux.lock`'
            echo "- SHA-256: \`${lock_sha256}\`"
            echo "- $(ai/.venv/bin/python -m pip --version)"
            echo '- Torch: `2.13.0+cpu`, CUDA runtime: `None`'
            echo '- Scope: CI candidate; production reuse is not verified.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run AI unit tests
        run: ai/.venv/bin/python -m pytest ai/tests/unit -q -p no:cacheprovider

      - name: Run or report AI contract tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t contract_tests < <(find ai/tests/contract -type f -name 'test_*.py' -print)
          if (( ${#contract_tests[@]} == 0 )); then
            {
              echo
              echo "### AI contract test status"
              echo
              echo "AI_CONTRACT_TESTS_NOT_IMPLEMENTED"
              echo
              echo '`ai/tests/contract` contains no executable test modules.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            ai/.venv/bin/python -m pytest ai/tests/contract -q -p no:cacheprovider
          fi

      - name: Verify FastAPI health
        shell: bash
        env:
          AI_VECTOR_DSN: ""
        run: |
          set -euo pipefail
          health_log="$RUNNER_TEMP/ai-health.log"
          health_body="$RUNNER_TEMP/ai-health.json"
          ai/.venv/bin/python -m uvicorn ai.app.main:app \
            --host 127.0.0.1 \
            --port 8001 \
            --log-level warning \
            --no-access-log >"$health_log" 2>&1 &
          server_pid=$!

          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
            fi
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8001/health >"$health_body"; then
              cat "$health_body"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$health_log"
              exit 1
            fi
            sleep 1
          done

          cat "$health_log"
          echo "FastAPI /health did not become ready within 30 seconds." >&2
          exit 1

      - name: Verify disposable PostgreSQL connection
        working-directory: backend
        run: >-
          .venv/bin/python -c
          "import django;
          django.setup();
          from django.db import connection;
          connection.ensure_connection();
          assert connection.vendor == 'postgresql', connection.vendor;
          print('connection.vendor=postgresql')"

      - name: Run AI Backend Handoff Socket E2E gate
        shell: bash
        env:
          WATERBRIDGE_AI_PYTHON: ${{ github.workspace }}/ai/.venv/bin/python
        run: |
          set -euo pipefail
          e2e_log="$RUNNER_TEMP/ai-backend-socket-e2e.log"
          backend/.venv/bin/python -m pytest \
            --ds=config.settings.local \
            --create-db \
            --color=no \
            backend/tests/integration/test_ai_handoff_backend_web_bridge.py \
            backend/tests/integration/test_ai_handoff_live_socket_e2e.py \
            -q \
            -p no:cacheprovider | tee "$e2e_log"

          if ! grep -Eq '3 passed([,[:space:]]|$)' "$e2e_log"; then
            echo "Expected the target gate to report exactly 3 passed." >&2
            exit 1
          fi
          if grep -Eq '[0-9]+ skipped|[0-9]+ failed|[0-9]+ errors?' "$e2e_log"; then
            echo "The target gate reported a skipped, failed, or errored test." >&2
            exit 1
          fi

      - name: Record Linux gate result
        if: ${{ success() }}
        run: |
          {
            echo
            echo "### AI Backend Socket E2E result"
            echo
            echo "LINUX_LOCK_GATE_VERIFIED"
            echo
            echo "The Ubuntu 24.04 CPU-only CI lock and Socket E2E gate passed."
            echo "Production container reuse remains NOT_VERIFIED."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record Linux gate failure
        if: ${{ failure() }}
        run: |
          {
            echo
            echo "### AI Backend Socket E2E result"
            echo
            echo "LINUX_GATE_FAILED"
            echo
            echo "Review the first failing step and hand it off to the owning area."
          } >> "$GITHUB_STEP_SUMMARY"
