name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - "data/**"
      - "scripts/development/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "contracts/**"
      - "data/**"
      - "scripts/development/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    name: Verify Backend baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/local.txt
            backend/requirements/constraints-py313.txt

      - name: Prepare Linux Backend constraint packages
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install \
            --disable-pip-version-check \
            --constraint backend/requirements/constraints-py313.txt \
            colorama==0.4.6 \
            tzdata==2026.3

      - name: Bootstrap Backend environment
        run: python scripts/development/bootstrap.py --service backend

      - name: Run Backend full environment gate
        run: python scripts/development/check_environment.py --service backend --full
