# 공식 환경 설치 SSOT는 requirements.lock이다. 이 파일은 Metadata·직접 의존성·
# Pytest 설정용이며 현재 `pip install ./ai` 또는 Wheel 배포를 지원하지 않는다.
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watercare-ai"
version = "1.0.0"
description = "SKmagic WaterCare 정수기 구독 고객 케어 AI 및 RAG 파이프라인 서비스"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "langgraph==1.2.2",
    "sentence-transformers==5.5.1",
    "psycopg[binary]==3.2.9",
    "pytest==9.0.3",
    "mcp[cli]==2.0.0",
    "opentelemetry-api==1.44.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["--basetemp=ai/tests/.pytest-tmp", "-p", "no:cacheprovider"]
