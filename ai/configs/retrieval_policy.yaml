# RAG 검색 및 Vector Store 검색 정책 설정

embedding:
  model_name: "BAAI/bge-m3"
  model_revision: "5617a9f61b028005a4858fdac845db406aefb181"
  dimension: 1024
  normalize_embeddings: true

vector_store:
  provider: "pgvector"
  search_type: "exact_search"  # Cosine Exact Search 사용 (MVP HNSW/IVFFlat 미사용)
  distance_strategy: "cosine"

retrieval_params:
  top_k: 5
  score_threshold: 0.4  # 최소 코사인 유사도 점수

# 고객 원문과 Gold 문장은 보존하고 Embedding 입력에만 공식 증상 용어를 보조한다.
# 완전 미출수 표현은 LOW-FLOW로 확장하지 않아 NO-WATER 의미를 침범하지 않는다.
query_expansion:
  policy_id: "RUNTIME_QUERY_EXPANSION_V1"
  max_expanded_length: 4096
  rules:
    - rule_id: "QUERY-LOW-FLOW-001"
      model_codes:
        - "WPUJAC104DWH"
        - "WPUIAC425SNW"
      trigger_phrases:
        - "쫄쫄"
        - "졸졸"
        - "물이 잘 안 나"
        - "출수량이 적"
        - "출수 속도가 느"
      excluded_phrases:
        - "한 방울도 안 나"
        - "아예 안 나"
        - "전혀 안 나"
        - "물이 나오지 않"
        - "출수가 안 되"
        - "출수되지 않"
      expansion_terms:
        - "출수량이 적을 경우"
        - "출수 속도가 느림"

metadata_filters:
  allowed_generations:
    - "D"  # MVP 대상 세대 (S세대 등 이전 세대 검색 포함 금지)
  target_models:
    - "WPUJAC104DWH"
    - "WPU-JAC104D/JCC104D"
  excluded_models:
    - "WPUIAC425SNW"  # 후속 확장 모델 제외
    - "WPU-IAC506"     # 제거 대상 제외
  require_official_verification: true

# 검색 점수와 무관하게 정적 매뉴얼로 답할 수 없는 질의를 검색 전에 차단한다.
answerability_capability_gate:
  policy_id: "ANSWERABILITY_CAPABILITY_GATE_V1"
  supported_model_codes:
    - "WPUJAC104DWH"
  supported_generations:
    - "D"
  unsupported_model_rule_id: "GATE-MODEL-001"
  unsupported_generation_rule_id: "GATE-GENERATION-001"

  unsupported_feature_rules:
    - rule_id: "GATE-JAC104-ICE-001"
      category: "UNSUPPORTED_PRODUCT_CAPABILITY"
      model_codes:
        - "WPUJAC104DWH"
      terms:
        - "얼음"
        - "제빙"
      reason: "JAC104 매뉴얼 범위에 제빙·얼음 기능이 없음"

  out_of_manual_rules:
    - rule_id: "GATE-COMMERCIAL-001"
      category: "DYNAMIC_COMMERCIAL_INFORMATION"
      any_term_groups:
        - ["제휴카드", "카드 할인", "렌탈료", "월 요금", "계약 요금", "납부 금액", "할인 금액", "할인 혜택"]
      excluded_terms: []
      reason: "정적 사용설명서 범위를 벗어난 계약·결제·할인 정보"

    - rule_id: "GATE-PART-PRICE-001"
      category: "DYNAMIC_COMMERCIAL_INFORMATION"
      any_term_groups:
        - ["필터", "부품", "소모품"]
        - ["가격", "비용", "구매", "구입", "판매", "구매처", "파는 곳"]
      excluded_terms: ["가격이 아니라", "비용이 아니라", "교체 주기", "얼마마다"]
      reason: "정적 사용설명서 범위를 벗어난 부품 가격·구매 정보"

    - rule_id: "GATE-PRODUCT-CATALOG-001"
      category: "FULL_PRODUCT_CATALOG"
      any_term_groups:
        - ["색상", "컬러"]
        - ["선택", "옵션", "주문", "종류", "판매", "구매", "구입", "모두", "전체"]
        - ["외관", "제품", "모델", "정수기"]
      excluded_terms: ["청소", "닦", "얼룩", "변색", "표시등", "표시창", "버튼"]
      reason: "사용설명서만으로 판매 색상·옵션의 전체 목록을 보장할 수 없음"

    - rule_id: "GATE-VISIT-SCHEDULE-001"
      category: "DYNAMIC_SERVICE_SCHEDULE"
      any_term_groups:
        - ["기사", "방문 기사", "서비스 기사", "엔지니어"]
        - ["몇 시", "도착", "언제 오", "방문 시간", "예정 시간"]
      excluded_terms: ["기사 방문이 필요", "방문이 필요한", "방문을 요청"]
      reason: "정적 사용설명서로 실시간 기사 방문·도착 일정을 확인할 수 없음"

# 3모델은 AI_RAG_RUNTIME_PROFILE=three_model_integration을 명시한 공식 통합검증
# Process에서만 선택한다. 기본 Profile은 계속 mvp이며 Public Runtime 활성화는 HOLD다.
prepared_runtime_profiles:
  three_model:
    activation_status: "INTEGRATION_VERIFICATION_ONLY"
    public_runtime_activation: "HOLD"
    selection_environment: "AI_RAG_RUNTIME_PROFILE"
    selection_value: "three_model_integration"
    activation_blockers:
      - "BACKEND_VIEW_METADATA_PATCH_MAIN_MERGE"
      - "OFFICIAL_THREE_MODEL_MANIFEST_PROVENANCE"
      - "AI_PROVIDER_RUNTIME_PASS"
      - "JOINT_E2E"
    supported_model_codes:
      - "WPUJAC104DWH"
      - "WPUIAC425SNW"
      - "WPUIAC606SNW"
    supported_generations:
      - "D"
      - "IAC425"
      - "IAC606"
    metadata_filters:
      allowed_generations:
        - "D"
        - "IAC425"
        - "IAC606"
      target_models:
        - "WPUJAC104DWH"
        - "WPUIAC425SNW"
        - "WPUIAC606SNW"
      excluded_models:
        - "WPUJCC104D"
        - "WPUIAC506SNW"
        - "WPU-IAC506"
    required_pre_score_filter: "exact_sales_code"
    cross_model_fallback: false
