# 금지 표현 및 가드레일 문구 정의

# 1. 확정 진단 금지 문구 (AI가 고장을 최종 확정짓는 단정적 표현 금지)
prohibited_diagnosis_phrases:
  - "고장이 확실합니다"
  - "100% 부품 결함입니다"
  - "반드시 교체해야 합니다"
  - "모터가 파손되었습니다"
  - "기판이 태워졌습니다"
  - "확실한 고장 원인은"

# 2. 안전 보증 금지 문구 (의학적/위생적/안전성 보증 표현 금지)
prohibited_guarantee_phrases:
  - "절대 안전합니다"
  - "100% 안심하고 드셔도 됩니다"
  - "수질에 아무 문제가 없습니다"
  - "유해 물질이 전혀 없습니다"
  - "마셔도 인체에 해가 없습니다"
  - "안전을 보증합니다"

# 3. 위험한 직접 수리 유도 금지 문구 (분해/전기 조작 안내 금지)
prohibited_repair_action_phrases:
  - "커버를 분해하세요"
  - "나사를 풀고 내부를"
  - "전선을 피복하여"
  - "기판을 뜯어서"
  - "밸브를 직접 뜯어"
  - "모터를 손으로 조여"

# 금지 문구 감지 시 차단 및 대체 안내 정책
enforcement_policy:
  action_on_match: "REJECT_AND_FALLBACK"
  fallback_message: "안전하고 검증된 안내를 위해 확정적인 진단 문구 대신 점검 필요 사항 및 공식 서비스 상담을 권장해 드립니다."
