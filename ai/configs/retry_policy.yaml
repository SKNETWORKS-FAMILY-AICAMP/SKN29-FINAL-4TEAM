# 백엔드-AI 호출 타임아웃 및 AI 내부 재시도 정책

backend_integration:
  overall_timeout_seconds: 30.0  # Backend의 전체 AI 호출 타임아웃 30초
  backend_retry_count: 0         # Backend의 자동 재시도는 0회로 제한 (중복 LLM 호출 방지)

ai_internal_retry:
  enabled: true                   # 일시적 검색 Provider 오류에 한해 Runtime에서 동작한다.
  max_retry_count: 1             # AI 내부 최대 재시도 횟수 1회
  backoff_factor: 0.5            # 재시도 대기 시간 백오프 (초)
  retry_on_exceptions:
    - "ConnectionError"
    - "TimeoutError"
    - "OperationalError"
    - "InterfaceError"

stage_timeouts:
  structuring_timeout_seconds: 5.0
  safety_timeout_seconds: 3.0
  retrieval_timeout_seconds: 5.0
  generation_timeout_seconds: 15.0
  validation_timeout_seconds: 3.0
